, Momentum, Adam, AdamW", "level": "🟢 Junior", "explanation": "<p>Оптимизатор определяет, как веса обновляются по градиенту. <code>SGD<\/code> — простой, но требует тщательного подбора learning rate; с <code>momentum<\/code> сходится быстрее за счёт накопления инерции.<\/p><ul><li><b>SGD+Momentum<\/b> — хорош для CV задач, часто даёт лучшую генерализацию<\/li><li><b>Adam<\/b> — адаптивный LR для каждого параметра, быстро сходится, но может переобучаться и иметь худшую генерализацию<\/li><li><b>AdamW<\/b> — Adam с правильно отделённым weight decay (не смешанным с градиентом) — стандарт в трансформерах<\/li><\/ul><p>Типичная ошибка — использовать Adam с L2-регуляризацией вместо AdamW: в Adam decay взаимодействует с адаптивным LR некорректно.<\/p><pre><code>import torch.optim as optim\nopt = optim.AdamW(model.parameters(), lr=3e-4, weight_decay=0.01)\n<\/code><\/pre><p>Совет: для NLP/трансформеров почти всегда берите AdamW; для классического CV (ResNet) SGD+momentum с хорошим schedule часто даёт top-1 accuracy выше.<\/p>", "links": [{"title": "PyTorch torch.optim docs", "url": "https://pytorch.org/docs/stable/optim.html"}, {"title": "Decoupled Weight Decay Regularization (AdamW paper)", "url": "https://arxiv.org/abs/1711.05101"}, {"title": "Adam: A Method for Stochastic Optimization", "url": "https://arxiv.org/abs/1412.6980"}]}, {"title": "Learning rate и стратегии его изменения (schedulers)", "level": "🟢 Junior", "explanation": "<p>LR — самый влиятельный гиперпараметр. Слишком большой — расхождение loss, слишком маленький — обучение стоит на месте или застревает в плохом минимуме.<\/p><ul><li><b>StepLR / MultiStepLR<\/b> — снижение в заданные эпохи<\/li><li><b>CosineAnnealingLR<\/b> — плавное косинусное затухание, популярно в CV/NLP<\/li><li><b>ReduceLROnPlateau<\/b> — снижает LR, если метрика перестала улучшаться<\/li><li><b>Warmup<\/b> — постепенный разогрев LR в первые шаги, обязателен для трансформеров и больших batch size<\/li><\/ul><pre><code>from torch.optim.lr_scheduler import CosineAnnealingLR\nscheduler = CosineAnnealingLR(opt, T_max=epochs)\nfor epoch in range(epochs):\n    train_one_epoch()\n    scheduler.step()\n<\/code><\/pre><p>Практический совет: используйте <code>LR range test<\/code> (fastai / torch-lr-finder) чтобы найти оптимальный диапазон LR перед полноценным обучением — это экономит часы экспериментов.<\/p>", "links": [{"title": "PyTorch lr_scheduler docs", "url": "https://pytorch.org/docs/stable/optim.html#how-to-adjust-learning-rate"}, {"title": "Cyclical Learning Rates for Training Neural Networks", "url": "https://arxiv.org/abs/1506.01186"}, {"title": "fast.ai course", "url": "https://course.fast.ai/"}]}, {"title": "Batch Normalization и Layer Normalization", "level": "🟡 Middle", "explanation": "<p>Нормализация активаций стабилизирует и ускоряет обучение, борется с internal covariate shift.<\/p><table><tr><th>BatchNorm<\/th><th>LayerNorm<\/th><\/tr><tr><td>Нормализует по batch-измерению<\/td><td>Нормализует по признакам одного примера<\/td><\/tr><tr><td>Плохо работает при малом batch size<\/td><td>Не зависит от размера batch<\/td><\/tr><tr><td>Стандарт для CNN<\/td><td>Стандарт для трансформеров/RNN<\/td><\/tr><\/table><p>Типичная ошибка — забыть переключить модель в <code>model.eval()<\/code> перед инференсом: BatchNorm использует running statistics только в eval-режиме, иначе метрики на валидации будут «плавать».<\/p><pre><code>import torch.nn as nn\nbn = nn.BatchNorm2d(64)\nln = nn.LayerNorm(768)\n<\/code><\/pre><p>При маленьком batch (&lt;8) рассмотрите <code>GroupNorm<\/code> — компромисс между BN и LN.<\/p>", "links": [{"title": "Batch Normalization paper", "url": "https://arxiv.org/abs/1502.03167"}, {"title": "Layer Normalization paper", "url": "https://arxiv.org/abs/1607.06450"}, {"title": "PyTorch nn.BatchNorm2d docs", "url": "https://pytorch.org/docs/stable/generated/torch.nn.BatchNorm2d.html"}, {"title": "PyTorch nn.LayerNorm docs", "url": "https://pytorch.org/docs/stable/generated/torch.nn.LayerNorm.html"}]}, {"title": "Dropout и регуляризация", "level": "🟢 Junior", "explanation": "<p>Dropout случайным образом зануляет часть нейронов на этапе обучения, снижая переобучение за счёт эффекта ансамбля подсетей.<\/p><ul><li><code>nn.Dropout(p=0.5)<\/code> — типично для полносвязных слоёв<\/li><li><code>nn.Dropout2d<\/code> — зануляет целые каналы в свёрточных картах<\/li><li>Weight decay (L2) — штраф за большие веса, встроен в оптимизатор<\/li><li>Label smoothing — сглаживает one-hot таргеты, снижает самоуверенность модели<\/li><\/ul><pre><code>class MLP(nn.Module):\n    def __init__(self):\n        super().__init__()\n        self.fc1 = nn.Linear(784, 256)\n        self.drop = nn.Dropout(0.3)\n        self.fc2 = nn.Linear(256, 10)\n    def forward(self, x):\n        x = torch.relu(self.fc1(x))\n        x = self.drop(x)\n        return self.fc2(x)\n<\/code><\/pre><p>Частая ошибка новичков: забыть <code>model.eval()<\/code>/<code>model.train()<\/code> — dropout продолжает работать на инференсе, давая недетерминированные предсказания.<\/p>", "links": [{"title": "Dropout: A Simple Way to Prevent Overfitting", "url": "https://jmlr.org/papers/v15/srivastava14a.html"}, {"title": "PyTorch nn.Dropout docs", "url": "https://pytorch.org/docs/stable/generated/torch.nn.Dropout.html"}, {"title": "PyTorch weight_decay / regularization guide", "url": "https://pytorch.org/docs/stable/optim.html"}]}, {"title": "Gradient Clipping", "level": "🟡 Middle", "explanation": "<p>Обрезка градиентов предотвращает 'взрыв градиентов' — резкий скачок нормы градиента, который ломает обучение (особенно в RNN и глубоких трансформерах).<\/p><pre><code>loss.backward()\ntorch.nn.utils.clip_grad_norm_(model.parameters(), max_norm=1.0)\noptimizer.step()\n<\/code><\/pre><ul><li><b>clip_grad_norm_<\/b> — обрезает по общей норме всех градиентов (предпочтительно)<\/li><li><b>clip_grad_value_<\/b> — обрезает поэлементно, грубее<\/li><\/ul><p>В продакшене при обучении LLM почти всегда ставят <code>max_norm=1.0<\/code> как страховку от редких «выбросов» в данных, которые дают аномально большой градиент и могут NaN'ить всю тренировку за один шаг.<\/p><p>Совет: логируйте норму градиента каждые N шагов — резкие скачки сигнализируют о проблемах с данными или LR.<\/p>", "links": [{"title": "PyTorch clip_grad_norm_ docs", "url": "https://pytorch.org/docs/stable/generated/torch.nn.utils.clip_grad_norm_.html"}, {"title": "On the difficulty of training RNNs (exploding gradients)", "url": "https://arxiv.org/abs/1211.5063"}]}, {"title": "Mixed Precision Training (AMP)", "level": "🟡 Middle", "explanation": "<p>Обучение в fp16/bf16 вместо fp32 ускоряет вычисления в 2-3 раза на современных GPU (Tensor Cores) и снижает потребление памяти, позволяя увеличить batch size.<\/p><pre><code>scaler = torch.cuda.amp.GradScaler()\nfor x, y in loader:\n    optimizer.zero_grad()\n    with torch.cuda.amp.autocast():\n        out = model(x)\n        loss = criterion(out, y)\n    scaler.scale(loss).backward()\n    scaler.step(optimizer)\n    scaler.update()\n<\/code><\/pre><p><code>GradScaler<\/code> нужен для fp16, чтобы избежать underflow маленьких градиентов (масштабирует loss перед backward). Для <code>bf16<\/code> (доступен на A100/H100/TPU) scaler обычно не требуется — динамический диапазон шире.<\/p><p>Частая ошибка — забыть <code>scaler.unscale_<\/code> перед gradient clipping, из-за чего клиппинг применяется к неверно масштабированным градиентам.<\/p>", "links": [{"title": "PyTorch Automatic Mixed Precision docs", "url": "https://pytorch.org/docs/stable/amp.html"}, {"title": "Mixed Precision Training paper", "url": "https://arxiv.org/abs/1710.03740"}, {"title": "NVIDIA Mixed Precision Training guide", "url": "https://docs.nvidia.com/deeplearning/performance/mixed-precision-training/index.html"}]}, {"title": "Early Stopping", "level": "🟢 Junior", "explanation": "<p>Остановка обучения при отсутствии улучшения метрики на валидации — простой и эффективный способ борьбы с переобучением и экономии compute.<\/p><pre><code>best_loss, patience, counter = float('inf'), 5, 0\nfor epoch in range(epochs):\n    val_loss = validate(model)\n    if val_loss < best_loss:\n        best_loss = val_loss\n        counter = 0\n        torch.save(model.state_dict(), 'best.pt')\n    else:\n        counter += 1\n        if counter >= patience:\n            print('Early stopping')\n            break\n<\/code><\/pre><ul><li>Всегда сохраняйте checkpoint лучшей модели, а не последней<\/li><li>Patience подбирают эмпирически (обычно 3-10 эпох)<\/li><li>В связке с ReduceLROnPlateau может давать ложные срабатывания — следите за порядком проверок<\/li><\/ul><p>Совет: используйте готовые реализации (Keras <code>EarlyStopping<\/code>, PyTorch Lightning <code>EarlyStopping<\/code> callback) вместо ручного кода — меньше багов.<\/p>", "links": [{"title": "PyTorch Lightning EarlyStopping callback", "url": "https://lightning.ai/docs/pytorch/stable/common/early_stopping.html"}, {"title": "Keras EarlyStopping docs", "url": "https://keras.io/api/callbacks/early_stopping/"}]}, {"title": "Аугментации данных", "level": "🟢 Junior", "explanation": "<p>Аугментации искусственно расширяют обучающую выборку, улучшая обобщающую способность модели без сбора новых данных.<\/p><ul><li><b>CV<\/b>: поворот, отражение, кроп, цветовые искажения, <code>CutMix<\/code>, <code>MixUp<\/code>, <code>RandAugment<\/code><\/li><li><b>NLP<\/b>: back-translation, синонимайзинг, случайное маскирование токенов<\/li><li><b>Audio<\/b>: time/frequency masking (SpecAugment)<\/li><\/ul><pre><code>import torchvision.transforms as T\ntransform = T.Compose([\n    T.RandomResizedCrop(224),\n    T.RandomHorizontalFlip(),\n    T.ColorJitter(0.2, 0.2, 0.2),\n    T.ToTensor(),\n])\n<\/code><\/pre><p>Типичная ошибка — применять аугментации к валидационному/тестовому набору (кроме TTA), что искажает метрики. Также важно не переусердствовать: слишком агрессивные аугментации могут «сломать» семантику (например, обрезать значимый объект целиком).<\/p>", "links": [{"title": "torchvision.transforms docs", "url": "https://pytorch.org/vision/stable/transforms.html"}, {"title": "MixUp paper", "url": "https://arxiv.org/abs/1710.09412"}, {"title": "CutMix paper", "url": "https://arxiv.org/abs/1905.04899"}, {"title": "RandAugment paper", "url": "https://arxiv.org/abs/1909.13719"}]}, {"title": "Мониторинг обучения: TensorBoard и Weights & Biases", "level": "🟡 Middle", "explanation": "<p>Без логирования метрик отладка обучения превращается в гадание. Логируйте loss, метрики, LR, норму градиентов, примеры предсказаний.<\/p><pre><code>import wandb\nwandb.init(project='my-model')\nfor epoch in range(epochs):\n    loss = train_epoch()\n    wandb.log({'loss': loss, 'lr': scheduler.get_last_lr()[0]})\n<\/code><\/pre><ul><li><b>TensorBoard<\/b> — бесплатный, локальный, встроен в PyTorch (<code>torch.utils.tensorboard<\/code>)<\/li><li><b>W&B<\/b> — облачный, удобен для сравнения экспериментов и командной работы, есть sweep для подбора гиперпараметров<\/li><\/ul><p>Продакшен-совет: логируйте не только скалярные метрики, но и гистограммы весов/градиентов — помогает быстро увидеть vanishing/exploding gradients или мёртвые ReLU-нейроны.<\/p>", "links": [{"title": "PyTorch TensorBoard integration docs", "url": "https://pytorch.org/docs/stable/tensorboard.html"}, {"title": "Weights & Biases docs", "url": "https://docs.wandb.ai/"}]}, {"title": "Распределённое обучение: DDP и Data Parallel", "level": "🔴 Senior", "explanation": "<p><code>DistributedDataParallel<\/code> (DDP) — стандартный способ обучать модели на нескольких GPU/машинах в PyTorch, значительно эффективнее устаревшего <code>DataParallel<\/code>.<\/p><ul><li><b>DataParallel<\/b> — один процесс, разбивает batch между GPU, узкое место на GPU0, не рекомендуется<\/li><li><b>DDP<\/b> — отдельный процесс на каждый GPU, градиенты синхронизируются через all-reduce, линейное масштабирование<\/li><li><b>FSDP<\/b> (Fully Sharded Data Parallel) — шардирует сами веса/оптимизатор между GPU для очень больших моделей<\/li><\/ul><pre><code>import torch.distributed as dist\nfrom torch.nn.parallel import DistributedDataParallel as DDP\n\ndist.init_process_group('nccl')\nmodel = DDP(model.to(rank), device_ids=[rank])\n<\/code><\/pre><p>Запуск: <code>torchrun --nproc_per_node=4 train.py<\/code>. Частая ошибка — не использовать <code>DistributedSampler<\/code>, из-за чего каждый процесс видит одинаковые данные вместо своего шарда.<\/p>", "links": [{"title": "PyTorch Distributed Data Parallel docs", "url": "https://pytorch.org/docs/stable/notes/ddp.html"}, {"title": "PyTorch FSDP tutorial", "url": "https://pytorch.org/tutorials/intermediate/FSDP_tutorial.html"}, {"title": "PyTorch distributed overview", "url": "https://pytorch.org/tutorials/beginner/dist_overview.html"}]}, {"title": "Подбор гиперпараметров (HPO)", "level": "🔴 Senior", "explanation": "<p>Ручной подбор LR, batch size, dropout и т.д. неэффективен при большом пространстве параметров. Используйте автоматизированные подходы.<\/p><ul><li><b>Grid Search<\/b> — перебор всех комбинаций, дорого при большом числе параметров<\/li><li><b>Random Search<\/b> — часто эффективнее grid при том же бюджете<\/li><li><b>Bayesian Optimization<\/b> (Optuna, Hyperopt) — строит суррогатную модель качества по параметрам<\/li><li><b>Hyperband/ASHA<\/b> — раннее прекращение неперспективных запусков<\/li><\/ul><pre><code>import optuna\ndef objective(trial):\n    lr = trial.suggest_float('lr', 1e-5, 1e-1, log=True)\n    model = build_model()\n    acc = train_and_eval(model, lr)\n    return acc\n\nstudy = optuna.create_study(direction='maximize')\nstudy.optimize(objective, n_trials=50)\n<\/code><\/pre><p>Совет: фиксируйте seed и логируйте все trial'ы в W&B sweeps — иначе результаты HPO невоспроизводимы.<\/p>", "links": [{"title": "Optuna documentation", "url": "https://optuna.readthedocs.io/en/stable/"}, {"title": "Random Search for Hyper-Parameter Optimization", "url": "https://jmlr.org/papers/v13/bergstra12a.html"}, {"title": "Weights & Biases Sweeps docs", "url": "https://docs.wandb.ai/guides/sweeps/"}]}, {"title": "Затухающие и взрывающиеся градиенты", "level": "🟡 Middle", "explanation": "<p>В глубоких сетях градиент при обратном распространении может экспоненциально уменьшаться (vanishing) или расти (exploding) с числом слоёв.<\/p><ul><li><b>Vanishing<\/b>: типично для sigmoid/tanh в глубоких сетях и длинных RNN — сеть перестаёт обучать ранние слои<\/li><li><b>Exploding<\/b>: типично для RNN, при большом LR или плохой инициализации — loss становится NaN<\/li><\/ul><table><tr><th>Проблема<\/th><th>Решение<\/th><\/tr><tr><td>Vanishing<\/td><td>ReLU/GELU, residual connections, BatchNorm, LSTM/GRU вместо vanilla RNN<\/td><\/tr><tr><td>Exploding<\/td><td>Gradient clipping, меньший LR, правильная инициализация (Xavier/Kaiming)<\/td><\/tr><\/table><pre><code>nn.init.kaiming_normal_(layer.weight, nonlinearity='relu')\n<\/code><\/pre><p>Диагностика: логируйте норму градиента по слоям — если она монотонно убывает к первым слоям, это vanishing gradient.<\/p>", "links": [{"title": "On the difficulty of training RNNs", "url": "https://arxiv.org/abs/1211.5063"}, {"title": "Deep Residual Learning (ResNet) paper", "url": "https://arxiv.org/abs/1512.03385"}, {"title": "PyTorch nn.init docs", "url": "https://pytorch.org/docs/stable/nn.init.html"}]}, {"title": "Инициализация весов", "level": "🟡 Middle", "explanation": "<p>Правильная инициализация весов критична для стабильного старта обучения глубоких сетей.<\/p><ul><li><b>Xavier/Glorot<\/b> — для сетей с sigmoid/tanh, сохраняет дисперсию активаций<\/li><li><b>Kaiming/He<\/b> — для ReLU-семейства, учитывает, что половина нейронов зануляется<\/li><li><b>Zero init<\/b> для bias, иногда для последнего слоя residual блока (по инициативе ResNet)<\/li><\/ul><pre><code>for m in model.modules():\n    if isinstance(m, nn.Linear):\n        nn.init.kaiming_normal_(m.weight, nonlinearity='relu')\n        nn.init.zeros_(m.bias)\n<\/code><\/pre><p>Большинство фреймворков (PyTorch) уже используют разумную инициализацию по умолчанию, но при кастомных архитектурах (например, очень глубокие сети без residual) плохая инициализация может привести к тому, что модель вообще не сдвинется с места за первые эпохи.<\/p>", "links": [{"title": "Understanding the difficulty of training deep feedforward networks (Xavier init)", "url": "https://proceedings.mlr.press/v9/glorot10a.html"}, {"title": "Delving Deep into Rectifiers (Kaiming init)", "url": "https://arxiv.org/abs/1502.01852"}, {"title": "PyTorch nn.init docs", "url": "https://pytorch.org/docs/stable/nn.init.html"}]}, {"title": "Чекпоинты и воспроизводимость обучения", "level": "🟢 Junior", "explanation": "<p>Сохранение состояния модели, оптимизатора и scheduler позволяет возобновлять обучение после сбоев и переиспользовать модели.<\/p><pre><code>torch.save({\n    'epoch': epoch,\n    'model_state': model.state_dict(),\n    'optimizer_state': optimizer.state_dict(),\n    'scheduler_state': scheduler.state_dict(),\n}, 'checkpoint.pt')\n\nckpt = torch.load('checkpoint.pt')\nmodel.load_state_dict(ckpt['model_state'])\n<\/code><\/pre><ul><li>Фиксируйте seed (<code>torch.manual_seed<\/code>, <code>numpy.random.seed<\/code>) для воспроизводимости<\/li><li>При многодневном обучении сохраняйте чекпоинты регулярно (каждые N шагов), а не только в конце<\/li><li>Версионируйте чекпоинты вместе с кодом и конфигом гиперпараметров (DVC, MLflow)<\/li><\/ul><p>Частая production-ошибка — потерять чекпоинт при падении спот-инстанса; настраивайте автосохранение в S3/бакет каждые несколько минут для длительных тренировок.<\/p>", "links": [{"title": "PyTorch Saving and Loading Models tutorial", "url": "https://pytorch.org/tutorials/beginner/saving_loading_models.html"}, {"title": "MLflow documentation", "url": "https://mlflow.org/docs/latest/index.html"}, {"title": "DVC documentation", "url": "https://dvc.org/doc"}]}, {"title": "Batch size и эффект масштаба", "level": "🔴 Senior", "explanation": "<p>Размер батча влияет на скорость сходимости, качество градиентных оценок и итоговую генерализацию модели.<\/p><ul><li>Маленький batch — шумные градиенты, лучше генерализация, но медленнее на GPU (недоиспользование параллелизма)<\/li><li>Большой batch — точные градиенты, быстрее эпоха, но риск застревания в острых минимумах (хуже generalization gap)<\/li><\/ul><p>Правило линейного масштабирования LR: при увеличении batch size в K раз, LR также увеличивают примерно в K раз (с warmup), иначе большой batch не даёт выигрыша в скорости обучения.<\/p><pre><code># эффективный batch = batch_size * accumulation_steps\nfor i, (x, y) in enumerate(loader):\n    loss = criterion(model(x), y) / accum_steps\n    loss.backward()\n    if (i + 1) % accum_steps == 0:\n        optimizer.step()\n        optimizer.zero_grad()\n<\/code><\/pre><p>Gradient accumulation позволяет эмулировать большой batch size при ограниченной GPU-памяти — стандартный приём при обучении LLM.<\/p>", "links": [{"title": "Accurate, Large Minibatch SGD paper", "url": "https://arxiv.org/abs/1706.02677"}, {"title": "On Large-Batch Training for Deep Learning (generalization gap)", "url": "https://arxiv.org/abs/1609.04836"}, {"title": "Hugging Face gradient accumulation guide", "url": "https://huggingface.co/docs/transformers/perf_train_gpu_one"}]}], "quiz": [{"q": "Почему AdamW предпочтительнее Adam при использовании weight decay?", "options": ["AdamW быстрее вычисляется на GPU", "AdamW корректно отделяет weight decay от адаптивного градиентного шага", "AdamW не требует learning rate", "AdamW работает только с трансформерами"], "answer": 1, "explain": "В Adam L2-регуляризация смешивается с адаптивным LR некорректно; AdamW применяет decay напрямую к весам, минуя эту проблему."}, {"q": "Зачем нужен warmup learning rate в начале обучения трансформеров?", "options": ["Чтобы ускорить загрузку данных", "Чтобы избежать нестабильности из-за больших градиентов на старте при случайной инициализации", "Чтобы уменьшить размер модели", "Warmup нужен только для CNN"], "answer": 1, "explain": "На старте веса случайны, и большой LR может привести к расхождению; постепенный разогрев стабилизирует ранние шаги обучения."}, {"q": "В чём ключевое отличие BatchNorm от LayerNorm?", "options": ["BatchNorm нормализует по признакам одного примера, LayerNorm — по batch", "BatchNorm нормализует по batch-измерению, LayerNorm — по признакам внутри одного примера", "Они математически идентичны", "LayerNorm применяется только к изображениям"], "answer": 1, "explain": "BatchNorm зависит от статистики по батчу и плохо работает при малом batch size, LayerNorm независим от размера батча и используется в трансформерах."}, {"q": "Что произойдёт, если забыть вызвать model.eval() перед инференсом модели с Dropout и BatchNorm?", "options": ["Ничего, поведение не изменится", "Модель будет работать быстрее", "Dropout продолжит зануление нейронов, а BatchNorm не будет использовать running statistics — предсказания станут недетерминированными", "Модель перестанет запускаться"], "answer": 2, "explain": "В train-режиме Dropout активен, а BatchNorm использует статистику текущего батча вместо накопленной — это искажает инференс."}, {"q": "Для чего используется gradient clipping?", "options": ["Для ускорения forward pass", "Для предотвращения взрыва градиентов и NaN-значений loss", "Для увеличения batch size", "Для замены оптимизатора"], "answer": 1, "explain": "Clipping ограничивает норму градиента, защищая от резких выбросов, которые могут разрушить обучение за один шаг."}, {"q": "Какую роль играет GradScaler в mixed precision обучении (fp16)?", "options": ["Уменьшает размер модели", "Масштабирует loss перед backward, чтобы избежать underflow маленьких градиентов в fp16", "Заменяет функцию активации", "Ускоряет загрузку датасета"], "answer": 1, "explain": "fp16 имеет узкий динамический диапазон, и маленькие градиенты могут обнулиться; GradScaler масштабирует loss вверх перед backward и обратно перед шагом оптимизатора."}, {"q": "Какая типичная ошибка возникает при использовании аугментаций данных?", "options": ["Применение аугментаций к обучающей выборке", "Применение аугментаций к валидационному/тестовому набору, искажающее метрики", "Использование библиотеки torchvision", "Слишком малое число эпох"], "answer": 1, "explain": "Валидация и тест должны отражать реальное распределение данных без искусственных искажений (кроме специальных случаев вроде TTA)."}, {"q": "Чем DistributedDataParallel (DDP) отличается от устаревшего DataParallel?", "options": ["DDP работает только на CPU", "DDP использует отдельный процесс на каждый GPU с синхронизацией градиентов через all-reduce, что даёт лучшее масштабирование", "DDP не поддерживает несколько GPU", "DataParallel быстрее DDP при любом числе GPU"], "answer": 1, "explain": "DataParallel создаёт узкое место на GPU0 и работает в одном процессе, тогда как DDP параллелит вычисления по отдельным процессам почти линейно."}, {"q": "Что делает gradient accumulation?", "options": ["Увеличивает физический размер GPU-памяти", "Эмулирует больший эффективный batch size, накапливая градиенты за несколько минибатчей перед шагом оптимизатора", "Заменяет BatchNorm", "Уменьшает число эпох обучения"], "answer": 1, "explain": "Accumulation позволяет тренироваться с большим эффективным batch size при ограниченной памяти GPU, суммируя градиенты нескольких forward/backward проходов."}, {"q": "Какой метод чаще всего используется для решения проблемы vanishing gradients в глубоких сетях?", "options": ["Увеличение batch size", "Residual connections, ReLU/GELU активации и BatchNorm", "Уменьшение количества слоёв до одного", "Отключение обратного распространения"], "answer": 1, "explain": "Residual connections создают прямой путь для градиента, а ReLU-подобные активации не насыщаются так, как sigmoid/tanh, что смягчает затухание градиентов."}], "id": 9, "pi": 2}, {"phase": "Phase 3 — Deep Learning", "section": "👁️ Computer Vision", "topics": [{"title": "Свёртки и CNN: как работает свёрточный слой", "level": "🟢 Junior", "explanation": "<p>Свёртка — это скользящее скалярное произведение фильтра (ядра) с локальным участком изображения. Ключевая идея CNN — <b>разделяемые веса<\/b> и <b>локальная связность<\/b>: один и тот же фильтр применяется по всему изображению, что даёт инвариантность к сдвигу и резко сокращает число параметров по сравнению с полносвязным слоем.<\/p><ul><li>Размер выхода: <code>out = (in + 2*pad - kernel) / stride + 1<\/code><\/li><li>Малые фильтры (3x3) стекируются вместо больших (5x5, 7x7) — тот же рецептивный охват, меньше параметров и больше нелинейностей.<\/li><li>Pooling (MaxPool) снижает разрешение и даёт небольшую инвариантность к сдвигу, но в современных архитектурах его часто заменяют strided-свёртками.<\/li><\/ul><pre><code>import torch.nn as nn\n\nblock = nn.Sequential(\n    nn.Conv2d(3, 64, kernel_size=3, padding=1),\n    nn.BatchNorm2d(64),\n    nn.ReLU(inplace=True),\n    nn.MaxPool2d(2)\n)<\/code><\/pre><p>Частая ошибка новичков — забыть про <code>padding<\/code>, из-за чего размер карты признаков «съедается» на каждом слое и в глубоких сетях можно дойти до нулевого размера. Также не забывайте <code>BatchNorm<\/code> перед активацией — это стандарт для стабильного обучения CNN.<\/p>", "links": [{"title": "CS231n: CNN for Visual Recognition", "url": "https://cs231n.github.io/convolutional-networks/"}, {"title": "PyTorch nn.Conv2d docs", "url": "https://pytorch.org/docs/stable/generated/torch.nn.Conv2d.html"}, {"title": "Convolutional Neural Network — Wikipedia", "url": "https://en.wikipedia.org/wiki/Convolutional_neural_network"}]}, {"title": "Классические архитектуры: ResNet, EfficientNet", "level": "🟢 Junior", "explanation": "<p>ResNet (2015) решил проблему деградации глубоких сетей с помощью <b>residual connections<\/b>: <code>y = F(x) + x<\/code>. Это позволяет градиенту течь напрямую через skip-connection, что делает возможным обучение сетей глубиной 50-150+ слоёв.<\/p><pre><code>class ResidualBlock(nn.Module):\n    def forward(self, x):\n        out = self.conv2(self.relu(self.conv1(x)))\n        return self.relu(out + self.shortcut(x))<\/code><\/pre><p>EfficientNet (2019) предложил <b>compound scaling<\/b> — одновременное и сбалансированное масштабирование глубины, ширины и разрешения входа по формуле с единым коэффициентом φ, вместо того чтобы масштабировать что-то одно. Результат — семейство B0-B7 с лучшим соотношением accuracy/FLOPs.<\/p><table><tr><th>Архитектура<\/th><th>Параметры<\/th><th>Когда использовать<\/th><\/tr><tr><td>ResNet-50<\/td><td>~25M<\/td><td>Универсальный baseline, много готовых чекпоинтов<\/td><\/tr><tr><td>EfficientNet-B0<\/td><td>~5M<\/td><td>Мобильные/edge устройства, ограниченный compute<\/td><\/tr><\/table><p>На практике: для нового проекта почти всегда начинайте с готового backbone из <code>timm<\/code>, а не пишите архитектуру с нуля.<\/p>", "links": [{"title": "Deep Residual Learning (ResNet paper)", "url": "https://arxiv.org/abs/1512.03385"}, {"title": "EfficientNet paper", "url": "https://arxiv.org/abs/1905.11946"}, {"title": "timm (PyTorch Image Models)", "url": "https://huggingface.co/docs/timm/index"}]}, {"title": "Transfer learning и fine-tuning", "level": "🟢 Junior", "explanation": "<p>Transfer learning — использование весов, предобученных на большом датасете (обычно ImageNet), для решения новой задачи с малым количеством данных. Два основных режима:<\/p><ul><li><b>Feature extraction<\/b> — замораживаем backbone, обучаем только новую голову.<\/li><li><b>Fine-tuning<\/b> — размораживаем часть или все слои и дообучаем с маленьким learning rate.<\/li><\/ul><pre><code>import timm\nmodel = timm.create_model('resnet50', pretrained=True, num_classes=10)\n\nfor param in model.parameters():\n    param.requires_grad = False\nfor param in model.fc.parameters():\n    param.requires_grad = True\n\n# discriminative learning rates\noptimizer = torch.optim.Adam([\n    {'params': model.layer4.parameters(), 'lr': 1e-4},\n    {'params': model.fc.parameters(), 'lr': 1e-3},\n])<\/code><\/pre><p>Типичная ошибка продакшена — забыть переключить <code>BatchNorm<\/code> в eval-режим при заморозке (иначе running stats продолжают обновляться на маленьком батче и «плывут»). Также при малом датасете (&lt;1000 изображений на класс) не размораживайте весь backbone сразу — начните с головы, затем постепенно open-up слои (gradual unfreezing).<\/p>", "links": [{"title": "PyTorch Transfer Learning Tutorial", "url": "https://pytorch.org/tutorials/beginner/transfer_learning_tutorial.html"}, {"title": "timm docs", "url": "https://huggingface.co/docs/timm/index"}, {"title": "CS231n: Transfer Learning", "url": "https://cs231n.github.io/transfer-learning/"}]}, {"title": "Классификация изображений: пайплайн end-to-end", "level": "🟢 Junior", "explanation": "<p>Стандартный пайплайн: загрузка данных → аугментации → forward/backward → метрики → сохранение чекпоинта. Ключевое — правильно разделить train/val/test и не допустить утечки данных (например, дубликаты изображений в разных сплитах).<\/p><pre><code>from torch.utils.data import DataLoader\nfrom torchvision import datasets, transforms\n\ntransform = transforms.Compose([\n    transforms.Resize((224, 224)),\n    transforms.ToTensor(),\n    transforms.Normalize(mean=[0.485,0.456,0.406], std=[0.229,0.224,0.225])\n])\n\ntrain_ds = datasets.ImageFolder('data/train', transform=transform)\nloader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)<\/code><\/pre><p>Метрики: accuracy подходит для сбалансированных данных, но при дисбалансе классов используйте <code>F1<\/code>, <code>precision/recall<\/code> или <code>balanced accuracy<\/code>. Всегда стройте confusion matrix — она быстро покажет, какие классы система систематически путает.<\/p><p>Совет из продакшена: сохраняйте не только веса лучшей модели по val-loss, но и по целевой бизнес-метрике — это разные вещи, и часто лучшая по loss модель не оптимальна для реального use-case.<\/p>", "links": [{"title": "PyTorch torchvision.datasets docs", "url": "https://pytorch.org/vision/stable/datasets.html"}, {"title": "scikit-learn: Model evaluation", "url": "https://scikit-learn.org/stable/modules/model_evaluation.html"}, {"title": "PyTorch DataLoader docs", "url": "https://pytorch.org/docs/stable/data.html"}]}, {"title": "Детекция объектов: YOLO и семейство single-stage детекторов", "level": "🟡 Middle", "explanation": "<p>YOLO (You Only Look Once) решает детекцию как единую регрессионную задачу: сетка предсказывает bounding box'ы, confidence и классы за один проход, в отличие от двухстадийных детекторов (Faster R-CNN), где сначала генерируются region proposals.<\/p><ul><li><b>Anchor boxes<\/b> — заранее заданные формы боксов-кандидатов, относительно которых предсказываются смещения.<\/li><li><b>NMS (Non-Max Suppression)<\/b> — убирает дублирующиеся боксы по IoU-порогу.<\/li><li>Метрика качества — <code>mAP@0.5<\/code> или <code>mAP@0.5:0.95<\/code> (COCO-style).<\/li><\/ul><pre><code>from ultralytics import YOLO\n\nmodel = YOLO('yolov8n.pt')\nmodel.train(data='dataset.yaml', epochs=50, imgsz=640)\nresults = model.predict('image.jpg', conf=0.25)<\/code><\/pre><p>Частые продакшн-проблемы: маленькие объекты плохо детектируются на низком разрешении входа — увеличивайте <code>imgsz<\/code> или используйте FPN-архитектуры с multi-scale features. Также следите за балансом классов в разметке — редкие классы часто получают низкий recall, помогает focal loss или oversampling.<\/p>", "links": [{"title": "Ultralytics YOLO docs", "url": "https://docs.ultralytics.com/"}, {"title": "You Only Look Once (YOLO paper)", "url": "https://arxiv.org/abs/1506.02640"}, {"title": "Faster R-CNN paper", "url": "https://arxiv.org/abs/1506.01497"}]}, {"title": "Семантическая и инстанс-сегментация", "level": "🟡 Middle", "explanation": "<p>Семантическая сегментация присваивает класс каждому пикселю (U-Net, DeepLab), инстанс-сегментация дополнительно различает отдельные объекты одного класса (Mask R-CNN, YOLOv8-seg).<\/p><p>U-Net — классическая encoder-decoder архитектура со skip-connections между симметричными уровнями, которые передают детализированную пространственную информацию из encoder напрямую в decoder, компенсируя потерю деталей при downsampling.<\/p><pre><code>import segmentation_models_pytorch as smp\n\nmodel = smp.Unet(\n    encoder_name='resnet34',\n    encoder_weights='imagenet',\n    in_channels=3,\n    classes=5\n)\nloss_fn = smp.losses.DiceLoss(mode='multiclass')<\/code><\/pre><p>Метрика — <b>IoU (Jaccard)<\/b> и <b>Dice coefficient<\/b>, а не accuracy: при сильном дисбалансе фон/объект (например, медицинские снимки) accuracy будет вводящей в заблуждение — модель, предсказывающая только фон, получит высокий accuracy, но нулевой IoU по целевому классу. Комбинируйте <code>Dice + CrossEntropy<\/code> loss для стабильного обучения.<\/p>", "links": [{"title": "U-Net paper", "url": "https://arxiv.org/abs/1505.04597"}, {"title": "Mask R-CNN paper", "url": "https://arxiv.org/abs/1703.06870"}, {"title": "segmentation_models.pytorch docs", "url": "https://smp.readthedocs.io/"}]}, {"title": "Vision Transformers (ViT)", "level": "🔴 Senior", "explanation": "<p>ViT (2020) рассматривает изображение как последовательность патчей (например, 16x16 пикселей), линейно проецирует их в эмбеддинги и подаёт в стандартный Transformer encoder — без свёрток вообще.<\/p><ul><li>Patch embedding + позиционные эмбеддинги (нет встроенной трансляционной инвариантности, как у CNN — модель должна выучить это сама).<\/li><li>Требует <b>значительно больше данных<\/b> для обучения с нуля, чем CNN, из-за отсутствия indutive bias; на маленьких датасетах ViT проигрывает CNN без предобучения.<\/li><li>Swin Transformer вводит иерархию и локальные окна внимания — ближе к CNN по духу, эффективнее по compute.<\/li><\/ul><pre><code>import timm\nmodel = timm.create_model('vit_base_patch16_224', pretrained=True, num_classes=100)<\/code><\/pre><p>На практике: если у вас датасет &lt;100k изображений, предпочитайте предобученный ViT или гибрид (ConvNeXt), а не обучение ViT с нуля. Также ViT более чувствителен к качеству аугментаций — стандартный рецепт включает MixUp, CutMix, RandAugment и Stochastic Depth.<\/p>", "links": [{"title": "An Image is Worth 16x16 Words (ViT paper)", "url": "https://arxiv.org/abs/2010.11929"}, {"title": "Swin Transformer paper", "url": "https://arxiv.org/abs/2103.14030"}, {"title": "timm docs (ViT models)", "url": "https://huggingface.co/docs/timm/index"}]}, {"title": "Аугментации изображений: albumentations", "level": "🟡 Middle", "explanation": "<p>Аугментации искусственно увеличивают разнообразие обучающих данных и снижают переобучение. Библиотека <code>albumentations<\/code> быстрее torchvision (использует OpenCV) и умеет синхронно трансформировать изображение, маски, боксы и ключевые точки.<\/p><pre><code>import albumentations as A\nfrom albumentations.pytorch import ToTensorV2\n\ntransform = A.Compose([\n    A.RandomResizedCrop(224, 224, scale=(0.8, 1.0)),\n    A.HorizontalFlip(p=0.5),\n    A.ColorJitter(brightness=0.2, contrast=0.2, p=0.5),\n    A.GaussNoise(p=0.2),\n    A.Normalize(),\n    ToTensorV2()\n], bbox_params=A.BboxParams(format='pascal_voc', label_fields=['labels']))<\/code><\/pre><p>Правило продакшена: аугментации должны отражать реальную вариативность продакшн-данных, а не произвольный набор. Например, вертикальный флип уместен для спутниковых снимков, но бессмысленен и вреден для фото людей. Тестовое время аугментаций (TTA — усреднение предсказаний по нескольким аугментированным версиям входа) часто даёт +0.5-1% accuracy почти бесплатно.<\/p>", "links": [{"title": "Albumentations documentation", "url": "https://albumentations.ai/docs/"}, {"title": "RandAugment paper", "url": "https://arxiv.org/abs/1909.13719"}, {"title": "torchvision.transforms docs", "url": "https://pytorch.org/vision/stable/transforms.html"}]}, {"title": "CLIP и мультимодальные модели", "level": "🔴 Senior", "explanation": "<p>CLIP (Contrastive Language-Image Pretraining) обучается на парах (изображение, текст) с помощью contrastive loss: эмбеддинги совпадающих пар сближаются, несовпадающих — отдаляются, в общем векторном пространстве.<\/p><pre><code>import clip\nimport torch\n\nmodel, preprocess = clip.load('ViT-B/32')\nimage = preprocess(pil_image).unsqueeze(0)\ntext = clip.tokenize(['a photo of a cat', 'a photo of a dog'])\n\nwith torch.no_grad():\n    image_features = model.encode_image(image)\n    text_features = model.encode_text(text)\n    logits = (image_features @ text_features.T).softmax(dim=-1)<\/code><\/pre><p>Ключевое применение — <b>zero-shot классификация<\/b> без дообучения: достаточно сформулировать классы текстом. CLIP также лежит в основе image search (semantic similarity через векторные БД) и как text encoder внутри диффузионных моделей (Stable Diffusion).<\/p><p>Ограничение: CLIP плохо справляется с подсчётом объектов, пространственными отношениями и мелкими деталями — не полагайтесь на него в задачах, требующих точной геометрии.<\/p>", "links": [{"title": "CLIP paper", "url": "https://arxiv.org/abs/2103.00020"}, {"title": "OpenAI CLIP GitHub", "url": "https://github.com/openai/CLIP"}, {"title": "Hugging Face CLIP docs", "url": "https://huggingface.co/docs/transformers/model_doc/clip"}]}, {"title": "Генерация изображений: диффузионные модели (основы)", "level": "🔴 Senior", "explanation": "<p>Диффузионные модели генерируют изображение через постепенное <b>устранение шума<\/b>: forward process добавляет гауссов шум к изображению за T шагов, а нейросеть (обычно U-Net) обучается предсказывать этот шум на reverse process, шаг за шагом восстанавливая изображение из чистого шума.<\/p><ul><li><b>Latent Diffusion (Stable Diffusion)<\/b> работает не в пиксельном пространстве, а в сжатом латентном (через VAE-encoder), что резко снижает вычислительные затраты.<\/li><li>Text-conditioning реализуется через cross-attention с текстовыми эмбеддингами (обычно из CLIP text encoder).<\/li><li><b>Classifier-free guidance<\/b> — техника усиления соответствия промпту за счёт интерполяции между условной и безусловной генерацией.<\/li><\/ul><pre><code>from diffusers import StableDiffusionPipeline\nimport torch\n\npipe = StableDiffusionPipeline.from_pretrained(\n    'runwayml/stable-diffusion-v1-5', torch_dtype=torch.float16\n).to('cuda')\nimage = pipe('a cyberpunk city at night', guidance_scale=7.5).images[0]<\/code><\/pre><p>Продакшн-нюанс: инференс диффузии дорог (десятки шагов denoising), поэтому в проде используют ускоренные семплеры (DPM-Solver++) и дистиллированные модели (LCM, Turbo) для near-realtime генерации.<\/p>", "links": [{"title": "Denoising Diffusion Probabilistic Models paper", "url": "https://arxiv.org/abs/2006.11239"}, {"title": "High-Resolution Image Synthesis (Latent Diffusion paper)", "url": "https://arxiv.org/abs/2112.10752"}, {"title": "Hugging Face Diffusers docs", "url": "https://huggingface.co/docs/diffusers/index"}]}, {"title": "OCR: распознавание текста на изображениях", "level": "🟡 Middle", "explanation": "<p>Современный OCR-пайплайн обычно состоит из двух этапов: <b>text detection<\/b> (найти области с текстом, часто через сегментацию/боксы) и <b>text recognition<\/b> (распознать символы внутри найденной области, часто через CRNN + CTC loss или Transformer-decoder).<\/p><pre><code>import easyocr\n\nreader = easyocr.Reader(['ru', 'en'])\nresults = reader.readtext('document.jpg')\nfor bbox, text, confidence in results:\n    print(text, confidence)<\/code><\/pre><p>Готовые решения: <code>Tesseract<\/code> (классика, слабее на сложных сценах), <code>EasyOCR<\/code>/<code>PaddleOCR<\/code> (deep learning, лучше на естественных сценах), облачные API (Google Vision, Yandex Vision) для продакшена без своей инфраструктуры.<\/p><table><tr><th>Задача<\/th><th>Инструмент<\/th><\/tr><tr><td>Сканы документов<\/td><td>Tesseract + preprocessing (deskew, binarization)<\/td><\/tr><tr><td>Фото в дикой природе (вывески, чеки)<\/td><td>PaddleOCR / EasyOCR<\/td><\/tr><\/table><p>Совет: качество OCR сильно зависит от препроцессинга — контраст, выравнивание угла наклона (deskew) и удаление шума часто дают больше прироста, чем смена модели.<\/p>", "links": [{"title": "EasyOCR GitHub", "url": "https://github.com/JaidedAI/EasyOCR"}, {"title": "PaddleOCR GitHub", "url": "https://github.com/PaddlePaddle/PaddleOCR"}, {"title": "Tesseract OCR docs", "url": "https://tesseract-ocr.github.io/"}]}, {"title": "Деплой CV-моделей: ONNX, TensorRT, квантизация", "level": "🔴 Senior", "explanation": "<p>Для продакшн-инференса PyTorch-модель обычно конвертируют в оптимизированный формат: <b>ONNX<\/b> для кроссплатформенности, <b>TensorRT<\/b> для максимальной скорости на NVIDIA GPU, <b>TFLite/CoreML<\/b> для мобильных устройств.<\/p><pre><code>import torch\n\ndummy_input = torch.randn(1, 3, 224, 224)\ntorch.onnx.export(\n    model, dummy_input, 'model.onnx',\n    input_names=['input'], output_names=['output'],\n    dynamic_axes={'input': {0: 'batch'}}\n)\n\n# инференс через onnxruntime\nimport onnxruntime as ort\nsession = ort.InferenceSession('model.onnx', providers=['CUDAExecutionProvider'])\noutput = session.run(None, {'input': dummy_input.numpy()})<\/code><\/pre><p>Квантизация (INT8 вместо FP32) даёт 2-4x ускорение и снижение памяти почти без потери точности, если сделана правильно (post-training static quantization с калибровочным датасетом, а не naive round). Динамический батчинг и warmup GPU перед замером latency обязательны — иначе бенчмарк соврёт.<\/p><p>Частая ошибка: тестировать latency модели без учёта preprocessing/postprocessing (resize, NMS) — в реальном сервисе они нередко занимают больше времени, чем сам forward pass.<\/p>", "links": [{"title": "ONNX documentation", "url": "https://onnx.ai/onnx/"}, {"title": "PyTorch ONNX export docs", "url": "https://pytorch.org/docs/stable/onnx.html"}, {"title": "NVIDIA TensorRT docs", "url": "https://docs.nvidia.com/deeplearning/tensorrt/"}]}, {"title": "Метрики и лоссы в CV: IoU, mAP, focal loss", "level": "🟡 Middle", "explanation": "<p>Правильный выбор метрики и loss критичен для CV-задач с несбалансированными данными.<\/p><ul><li><b>IoU (Intersection over Union)<\/b> — пересечение боксов/масок делённое на объединение; основа для NMS и метрик детекции/сегментации.<\/li><li><b>mAP<\/b> — усреднённая precision по всем классам и уровням IoU-порога, стандарт для сравнения детекторов (COCO benchmark).<\/li><li><b>Focal Loss<\/b> — модификация cross-entropy, которая понижает вес «лёгких» примеров и фокусирует обучение на сложных, решая проблему дисбаланса foreground/background в детекции.<\/li><\/ul><pre><code>def focal_loss(pred, target, gamma=2.0, alpha=0.25):\n    ce = F.binary_cross_entropy_with_logits(pred, target, reduction='none')\n    p_t = torch.exp(-ce)\n    loss = alpha * (1 - p_t) ** gamma * ce\n    return loss.mean()<\/code><\/pre><p>Практика: перед выбором метрики всегда спрашивайте, что важнее бизнесу — recall (не пропустить дефект на конвейере) или precision (не заваливать оператора ложными тревогами), и подбирайте threshold по PR-кривой, а не используйте дефолтные 0.5.<\/p>", "links": [{"title": "Focal Loss paper (RetinaNet)", "url": "https://arxiv.org/abs/1708.02002"}, {"title": "COCO evaluation metrics", "url": "https://cocodataset.org/#detection-eval"}, {"title": "scikit-learn: Model evaluation", "url": "https://scikit-learn.org/stable/modules/model_evaluation.html"}]}, {"title": "Работа с несбалансированными и малыми датасетами в CV", "level": "🟡 Middle", "explanation": "<p>Реальные CV-датасеты редко бывают идеально сбалансированными и большими. Основные стратегии:<\/p><ul><li><b>Oversampling/undersampling<\/b> редких/частых классов через <code>WeightedRandomSampler<\/code>.<\/li><li><b>Синтетические данные<\/b>: копипаст-аугментации (Copy-Paste для сегментации), генерация через диффузионные модели для редких классов.<\/li><li><b>Few-shot / self-supervised предобучение<\/b> (SimCLR, DINO) когда размеченных данных мало, но много неразмеченных.<\/li><\/ul><pre><code>from torch.utils.data import WeightedRandomSampler\n\nclass_counts = [500, 50, 20]\nweights = [1.0 / class_counts[label] for label in labels]\nsampler = WeightedRandomSampler(weights, num_samples=len(weights))\nloader = DataLoader(dataset, batch_size=32, sampler=sampler)<\/code><\/pre><p>Важно: активно валидируйте на репрезентативном hold-out наборе, отражающем реальное распределение классов в продакшене — иначе oversampling редких классов может создать иллюзию хорошего качества, которая не подтвердится в проде.<\/p>", "links": [{"title": "PyTorch WeightedRandomSampler docs", "url": "https://pytorch.org/docs/stable/data.html#torch.utils.data.WeightedRandomSampler"}, {"title": "SimCLR paper", "url": "https://arxiv.org/abs/2002.05709"}, {"title": "DINO paper", "url": "https://arxiv.org/abs/2104.14294"}]}], "quiz": [{"q": "Зачем в CNN используют skip-connections (как в ResNet)?", "options": ["Чтобы уменьшить размер изображения быстрее", "Чтобы градиент мог течь напрямую через блоки, облегчая обучение глубоких сетей", "Чтобы заменить BatchNorm", "Чтобы ускорить инференс на CPU"], "answer": 1, "explain": "Residual connections решают проблему затухания градиента и деградации точности в очень глубоких сетях."}, {"q": "Что делает compound scaling в EfficientNet?", "options": ["Масштабирует только количество слоёв", "Одновременно и сбалансированно масштабирует глубину, ширину и разрешение входа", "Заменяет свёртки на attention", "Уменьшает batch size во время обучения"], "answer": 1, "explain": "Compound scaling использует единый коэффициент для согласованного увеличения всех трёх измерений сети."}, {"q": "В чём принципиальное отличие fine-tuning от feature extraction при transfer learning?", "options": ["Fine-tuning не использует предобученные веса вовсе", "При fine-tuning дообучаются (размораживаются) веса backbone, а не только новая голова", "Feature extraction требует больше данных", "Разницы нет, это синонимы"], "answer": 1, "explain": "Feature extraction замораживает backbone и обучает только голову; fine-tuning дообучает часть или весь backbone с малым LR."}, {"q": "Для чего в детекции объектов применяется NMS (Non-Max Suppression)?", "options": ["Для нормализации входного изображения", "Для увеличения количества anchor boxes", "Для удаления дублирующихся боксов с высоким IoU, оставляя лучший по confidence", "Для аугментации данных"], "answer": 2, "explain": "NMS убирает избыточные перекрывающиеся предсказания одного и того же объекта."}, {"q": "Почему accuracy — плохая метрика для сегментации при сильном дисбалансе фон/объект?", "options": ["Accuracy вообще нельзя посчитать для сегментации", "Модель, предсказывающая только фон, может получить высокий accuracy при нулевом качестве по целевому классу", "Accuracy требует GPU для расчёта", "Accuracy применима только к детекции"], "answer": 1, "explain": "При дисбалансе классов IoU/Dice гораздо информативнее accuracy, которая маскирует плохую работу по редкому классу."}, {"q": "Чем ViT принципиально отличается от CNN в обработке изображения?", "options": ["ViT использует только пулинг, без свёрток и внимания", "ViT делит изображение на патчи и обрабатывает их как последовательность через self-attention, без свёрток", "ViT работает только с чёрно-белыми изображениями", "ViT не требует предобучения на больших датасетах"], "answer": 1, "explain": "ViT рассматривает патчи изображения как токены последовательности и применяет стандартный Transformer encoder."}, {"q": "Что оптимизирует CLIP при обучении на парах изображение-текст?", "options": ["Contrastive loss, сближающий эмбеддинги совпадающих пар и отдаляющий несовпадающие", "Cross-entropy loss на классах ImageNet", "Reconstruction loss как в автоэнкодере", "Focal loss для детекции"], "answer": 0, "explain": "CLIP учится общему эмбеддинг-пространству через contrastive объектив, что даёт возможность zero-shot классификации."}, {"q": "Что делает Latent Diffusion (Stable Diffusion) эффективнее классической пиксельной диффузии?", "options": ["Использует меньше шагов denoising всегда", "Работает в сжатом латентном пространстве через VAE, а не напрямую в пикселях", "Не использует U-Net", "Обучается без текстовых промптов"], "answer": 1, "explain": "Работа в латентном пространстве резко снижает вычислительные затраты по сравнению с пиксельной диффузией."}, {"q": "Почему квантизация модели (FP32 → INT8) полезна для деплоя CV-моделей?", "options": ["Она всегда повышает точность модели", "Она даёт ускорение и снижение потребления памяти почти без потери точности при правильной калибровке", "Она заменяет необходимость в GPU", "Она автоматически увеличивает batch size"], "answer": 1, "explain": "Post-training static quantization с калибровочным датасетом даёт 2-4x ускорение при минимальной потере accuracy."}, {"q": "Зачем нужен Focal Loss в задачах детекции объектов?", "options": ["Чтобы ускорить сходимость на сбалансированных данных", "Чтобы полностью заменить NMS", "Чтобы снизить вес легко классифицируемых примеров и сфокусировать обучение на сложных, решая дисбаланс foreground/background", "Чтобы уменьшить размер модели"], "answer": 2, "explain": "Focal Loss модифицирует cross-entropy, понижая вклад лёгких примеров, что помогает при сильном дисбалансе классов."}], "id": 10, "pi": 2}, {"phase": "Phase 3 — Deep Learning", "section": "💬 NLP и трансформеры", "topics": [{"title": "Токенизация: от слов до BPE", "level": "🟢 Junior", "explanation": "<p>Токенизация — первый шаг любого NLP-пайплайна: превращение текста в последовательность чисел. Наивная токенизация по словам плохо работает из-за огромного словаря и OOV (out-of-vocabulary) слов. Современные модели используют <b>subword<\/b>-токенизацию: Byte Pair Encoding (BPE), WordPiece, SentencePiece/Unigram.<\/p><p>BPE строит словарь итеративно: начинает с символов и объединяет самые частые пары в новый токен, пока не достигнет нужного размера словаря (обычно 30-50k).<\/p><pre><code>from tokenizers import ByteLevelBPETokenizer\ntok = ByteLevelBPETokenizer()\ntok.train(files=['corpus.txt'], vocab_size=30000, min_frequency=2)\nids = tok.encode('Привет, мир!').ids<\/code><\/pre><p>Типичные ошибки продакшена:<\/p><ul><li>Несовпадение токенизатора обучения и инференса (разные версии → тихий деградейшн качества)<\/li><li>Игнорирование спецтокенов [CLS], [SEP], [PAD] при подготовке батчей<\/li><li>Обрезка длинных текстов без учёта, что важная информация в конце<\/li><\/ul><p>Совет: всегда сохраняйте токенизатор вместе с весами модели (<code>tokenizer.save_pretrained()<\/code>), а не полагайтесь на «тот же самый файл на сервере».<\/p>", "links": [{"title": "HuggingFace Tokenizers docs", "url": "https://huggingface.co/docs/tokenizers/index"}, {"title": "BPE — Wikipedia", "url": "https://en.wikipedia.org/wiki/Byte_pair_encoding"}, {"title": "SentencePiece GitHub", "url": "https://github.com/google/sentencepiece"}]}, {"title": "Word2Vec и статические эмбеддинги", "level": "🟢 Junior", "explanation": "<p>Word2Vec (Mikolov, 2013) — первая массово успешная идея: представить слово вектором так, чтобы похожие по контексту слова были близки в векторном пространстве. Два варианта архитектуры: <b>CBOW<\/b> (предсказать слово по контексту) и <b>Skip-gram<\/b> (предсказать контекст по слову).<\/p><pre><code>from gensim.models import Word2Vec\nsentences = [['король', 'правит', 'страной'], ['королева', 'правит', 'страной']]\nmodel = Word2Vec(sentences, vector_size=100, window=5, min_count=1, sg=1)\nmodel.wv.most_similar('король')<\/code><\/pre><p>Классический пример арифметики эмбеддингов: <code>king - man + woman ≈ queen<\/code>. Но у word2vec есть фундаментальное ограничение — <b>один вектор на слово независимо от контекста<\/b>: «замок» (крепость) и «замок» (на двери) получают одинаковое представление.<\/p><table><tr><th>Метод<\/th><th>Контекстность<\/th><th>Год<\/th><\/tr><tr><td>Word2Vec/GloVe<\/td><td>Нет<\/td><td>2013-2014<\/td><\/tr><tr><td>ELMo<\/td><td>Частично (BiLSTM)<\/td><td>2018<\/td><\/tr><tr><td>BERT-embeddings<\/td><td>Полная<\/td><td>2018+<\/td><\/tr><\/table><p>На практике сегодня word2vec используют редко для NLP-задач, но идея остаётся базой для понимания эмбеддингов рекомендательных систем и графов.<\/p>", "links": [{"title": "Word2Vec — Wikipedia", "url": "https://en.wikipedia.org/wiki/Word2vec"}, {"title": "Gensim Word2Vec docs", "url": "https://radimrehurek.com/gensim/models/word2vec.html"}, {"title": "Distributed Representations of Words and Phrases (arXiv)", "url": "https://arxiv.org/abs/1310.4546"}]}, {"title": "RNN и LSTM: последовательное моделирование", "level": "🟢 Junior", "explanation": "<p>Рекуррентные сети (RNN) обрабатывают последовательность шаг за шагом, храня скрытое состояние <code>h_t<\/code>. Проблема ванильных RNN — <b>затухающий/взрывающийся градиент<\/b>: при обратном распространении через много шагов градиент умножается много раз и либо исчезает, либо взрывается.<\/p><p>LSTM (Long Short-Term Memory) решает это с помощью гейтов (forget, input, output) и отдельной ячейки памяти <code>c_t<\/code>, которая передаётся почти без изменений — аналог skip-connection во времени.<\/p><pre><code>import torch.nn as nn\nlstm = nn.LSTM(input_size=300, hidden_size=256, num_layers=2, bidirectional=True, batch_first=True)\noutput, (h_n, c_n) = lstm(embedded_batch)<\/code><\/pre><ul><li>GRU — упрощённая версия LSTM с меньшим числом параметров, часто сравнима по качеству<\/li><li>Основная беда: последовательная обработка не параллелится на GPU → медленное обучение на длинных текстах<\/li><li>Именно эта проблема и отсутствие прямого доступа к дальним токенам подтолкнули к изобретению attention и Transformer<\/li><\/ul><p>Сегодня RNN/LSTM почти не используют для NLP на старте новых проектов, но знание архитектуры важно для понимания истории и для задач временных рядов, где они всё ещё конкурентоспособны.<\/p>", "links": [{"title": "Understanding LSTM Networks (colah's blog)", "url": "https://colah.github.io/posts/2015-08-Understanding-LSTMs/"}, {"title": "PyTorch nn.LSTM docs", "url": "https://pytorch.org/docs/stable/generated/torch.nn.LSTM.html"}, {"title": "Long Short-Term Memory — Wikipedia", "url": "https://en.wikipedia.org/wiki/Long_short-term_memory"}]}, {"title": "Механизм внимания (Attention)", "level": "🟡 Middle", "explanation": "<p>Attention позволяет модели «смотреть» на все токены входа одновременно и взвешенно комбинировать их, вместо того чтобы сжимать всю информацию в одно скрытое состояние, как в RNN. Ключевая формула — <b>scaled dot-product attention<\/b>:<\/p><pre><code>Attention(Q, K, V) = softmax(QK^T / sqrt(d_k)) V<\/code><\/pre><p>Q (query), K (key), V (value) — линейные проекции входа. Деление на sqrt(d_k) нужно для стабилизации градиентов при больших размерностях (иначе softmax уходит в насыщение).<\/p><pre><code>import torch, torch.nn.functional as F\ndef attention(Q, K, V):\n    scores = Q @ K.transpose(-2, -1) / (Q.size(-1) ** 0.5)\n    weights = F.softmax(scores, dim=-1)\n    return weights @ V<\/code><\/pre><p>Изначально attention добавляли поверх RNN (Bahdanau, 2014) для машинного перевода — модель училась выравнивать слова разных языков. Прорыв случился, когда авторы Transformer показали, что <b>attention сам по себе достаточен<\/b>, без рекуррентности вообще.<\/p><p>Типичная ошибка на собеседовании — не суметь объяснить, зачем нужна маскировка (causal mask) в декодере: она запрещает токену «видеть» будущие позиции при обучении генеративных моделей.<\/p>", "links": [{"title": "Neural Machine Translation by Jointly Learning to Align and Translate (arXiv)", "url": "https://arxiv.org/abs/1409.0473"}, {"title": "Attention Is All You Need (arXiv)", "url": "https://arxiv.org/abs/1706.03762"}, {"title": "The Illustrated Transformer", "url": "https://jalammar.github.io/illustrated-transformer/"}]}, {"title": "Архитектура Transformer", "level": "🟡 Middle", "explanation": "<p>Статья «Attention is All You Need» (2017) представила архитектуру, полностью построенную на attention, без RNN/CNN. Ключевые компоненты:<\/p><ul><li><b>Multi-Head Attention<\/b> — несколько параллельных attention-голов, каждая учится своим паттернам (синтаксис, кореференция и т.д.)<\/li><li><b>Positional Encoding<\/b> — так как attention не знает порядок токенов, позицию добавляют явно (синус/косинус или обучаемые эмбеддинги)<\/li><li><b>Feed-Forward блок<\/b> — полносвязная сеть, применяется к каждой позиции независимо<\/li><li><b>Residual connections + LayerNorm<\/b> — критичны для обучения глубоких стеков (12-96+ слоёв)<\/li><\/ul><pre><code>import torch.nn as nn\nencoder_layer = nn.TransformerEncoderLayer(d_model=512, nhead=8, dim_feedforward=2048)\nencoder = nn.TransformerEncoder(encoder_layer, num_layers=6)\nout = encoder(src)  # src: (seq_len, batch, d_model)<\/code><\/pre><p>Различают три схемы: <b>encoder-only<\/b> (BERT — понимание), <b>decoder-only<\/b> (GPT — генерация), <b>encoder-decoder<\/b> (T5, оригинальный Transformer — seq2seq задачи типа перевода).<\/p><p>Практический совет: не пишите Transformer с нуля в продакшене — используйте HuggingFace или PyTorch-реализации, а свои силы тратьте на данные и fine-tuning.<\/p>", "links": [{"title": "Attention Is All You Need (arXiv)", "url": "https://arxiv.org/abs/1706.03762"}, {"title": "PyTorch nn.TransformerEncoder docs", "url": "https://pytorch.org/docs/stable/generated/torch.nn.TransformerEncoder.html"}, {"title": "The Illustrated Transformer", "url": "https://jalammar.github.io/illustrated-transformer/"}, {"title": "HuggingFace Transformers docs", "url": "https://huggingface.co/docs/transformers/index"}]}, {"title": "BERT и encoder-модели", "level": "🟡 Middle", "explanation": "<p>BERT (Bidirectional Encoder Representations from Transformers, 2018) — encoder-only модель, обученная на двух задачах: <b>Masked Language Modeling<\/b> (предсказать замаскированные токены, видя контекст с обеих сторон) и <b>Next Sentence Prediction<\/b>.<\/p><p>Двунаправленность — главное отличие от GPT: BERT видит весь текст сразу, поэтому отлично подходит для задач <i>понимания<\/i> (классификация, NER, QA), но не для генерации текста слева направо.<\/p><pre><code>from transformers import BertTokenizer, BertModel\ntok = BertTokenizer.from_pretrained('bert-base-uncased')\nmodel = BertModel.from_pretrained('bert-base-uncased')\ninputs = tok('Hello world', return_tensors='pt')\nout = model(**inputs)\ncls_embedding = out.last_hidden_state[:, 0, :]  # представление [CLS]<\/code><\/pre><p>Семейство моделей выросло: RoBERTa (улучшенное обучение), DistilBERT (дистилляция, в 2 раза быстрее), DeBERTa (disentangled attention), ELECTRA (эффективнее pretraining через replaced-token-detection).<\/p><p>Частая ошибка — использовать [CLS]-эмбеддинг «как есть» для similarity-задач: без специального дообучения (Sentence-BERT) эти вектора плохо разделяют смысл предложений по косинусной близости.<\/p>", "links": [{"title": "BERT paper (arXiv)", "url": "https://arxiv.org/abs/1810.04805"}, {"title": "HuggingFace BERT docs", "url": "https://huggingface.co/docs/transformers/model_doc/bert"}, {"title": "Sentence-BERT paper (arXiv)", "url": "https://arxiv.org/abs/1908.10084"}]}, {"title": "GPT и decoder-модели", "level": "🟡 Middle", "explanation": "<p>GPT (Generative Pre-trained Transformer) — decoder-only архитектура с <b>causal (autoregressive) attention<\/b>: каждый токен видит только предыдущие токены. Обучается на простой задаче — предсказать следующий токен (next-token prediction), что оказалось невероятно масштабируемо.<\/p><pre><code>from transformers import GPT2LMHeadModel, GPT2Tokenizer\ntok = GPT2Tokenizer.from_pretrained('gpt2')\nmodel = GPT2LMHeadModel.from_pretrained('gpt2')\ninput_ids = tok.encode('The future of AI is', return_tensors='pt')\noutput = model.generate(input_ids, max_length=30, do_sample=True, temperature=0.8, top_p=0.9)\nprint(tok.decode(output[0]))<\/code><\/pre><p>Ключевые параметры генерации, которые нужно понимать в продакшене:<\/p><ul><li><code>temperature<\/code> — сглаживание/заострение распределения (низкая = детерминированнее)<\/li><li><code>top_k<\/code> / <code>top_p<\/code> (nucleus sampling) — ограничение пространства кандидатов токенов<\/li><li><code>repetition_penalty<\/code> — борьба с зацикливанием на повторах<\/li><\/ul><p>GPT-3/4, LLaMA, Mistral — все decoder-only. Масштабирование (scaling laws Kaplan/Chinchilla) показало, что качество предсказуемо растёт с размером модели, данных и compute — это и породило гонку LLM.<\/p>", "links": [{"title": "HuggingFace GPT-2 docs", "url": "https://huggingface.co/docs/transformers/model_doc/gpt2"}, {"title": "Language Models are Few-Shot Learners (GPT-3 paper, arXiv)", "url": "https://arxiv.org/abs/2005.14165"}, {"title": "Scaling Laws for Neural Language Models (arXiv)", "url": "https://arxiv.org/abs/2001.08361"}, {"title": "Andrej Karpathy — Let's build GPT (YouTube)", "url": "https://www.youtube.com/watch?v=kCc8FmEb1nY"}]}, {"title": "HuggingFace transformers: экосистема", "level": "🟢 Junior", "explanation": "<p>Библиотека <code>transformers<\/code> — де-факто стандарт для работы с предобученными NLP/LLM моделями. Единый API: <code>AutoTokenizer<\/code> + <code>AutoModel<\/code> подхватывают правильный класс по имени модели с Hugging Face Hub.<\/p><pre><code>from transformers import pipeline\nclassifier = pipeline('sentiment-analysis', model='distilbert-base-uncased-finetuned-sst-2-english')\nresult = classifier('This library saves so much time!')\n# [{'label': 'POSITIVE', 'score': 0.9998}]<\/code><\/pre><p>Экосистема включает: <code>datasets<\/code> (загрузка/обработка датасетов), <code>tokenizers<\/code> (быстрая токенизация на Rust), <code>accelerate<\/code> (мультиGPU/mixed precision без боли), <code>peft<\/code> (LoRA и другие эффективные методы fine-tuning), <code>trl<\/code> (RLHF/DPO для LLM).<\/p><ul><li>Совет: используйте <code>pipeline()<\/code> для быстрого прототипа, но для продакшена берите модель/токенизатор напрямую — больше контроля над батчингом и латентностью<\/li><li>Ошибка новичков: скачивать модель заново при каждом старте контейнера — кэшируйте веса в volume или встраивайте в образ<\/li><li>Проверяйте лицензию модели (не все permissive для коммерческого использования)<\/li><\/ul>", "links": [{"title": "HuggingFace Transformers docs", "url": "https://huggingface.co/docs/transformers/index"}, {"title": "HuggingFace Datasets docs", "url": "https://huggingface.co/docs/datasets/index"}, {"title": "HuggingFace Accelerate docs", "url": "https://huggingface.co/docs/accelerate/index"}, {"title": "HuggingFace PEFT docs", "url": "https://huggingface.co/docs/peft/index"}]}, {"title": "Fine-tuning на своих данных", "level": "🟡 Middle", "explanation": "<p>Fine-tuning — дообучение предобученной модели на целевой задаче. Полный fine-tuning (все веса) требует много памяти GPU для больших моделей, поэтому на практике часто используют <b>parameter-efficient<\/b> методы: LoRA, adapters, prefix-tuning.<\/p><pre><code>from transformers import Trainer, TrainingArguments, AutoModelForSequenceClassification\nmodel = AutoModelForSequenceClassification.from_pretrained('bert-base-uncased', num_labels=3)\nargs = TrainingArguments(\n    output_dir='./out', per_device_train_batch_size=16,\n    num_train_epochs=3, learning_rate=2e-5, evaluation_strategy='epoch')\ntrainer = Trainer(model=model, args=args, train_dataset=train_ds, eval_dataset=val_ds)\ntrainer.train()<\/code><\/pre><p>LoRA (Low-Rank Adaptation) замораживает исходные веса и добавляет обучаемые низкоранговые матрицы — обучается 0.1-1% параметров с почти тем же качеством:<\/p><pre><code>from peft import LoraConfig, get_peft_model\nconfig = LoraConfig(r=8, lora_alpha=16, target_modules=['q_proj', 'v_proj'], lora_dropout=0.05)\nmodel = get_peft_model(model, config)<\/code><\/pre><p>Практические грабли: слишком высокий learning rate «ломает» предобученные знания (catastrophic forgetting); маленький датасет — переобучение за 1-2 эпохи, обязательно следите за eval loss и делайте early stopping.<\/p>", "links": [{"title": "HuggingFace Fine-tuning guide", "url": "https://huggingface.co/docs/transformers/training"}, {"title": "LoRA paper (arXiv)", "url": "https://arxiv.org/abs/2106.09685"}, {"title": "HuggingFace PEFT docs", "url": "https://huggingface.co/docs/peft/index"}]}, {"title": "Классификация текста", "level": "🟢 Junior", "explanation": "<p>Классическая задача: присвоить тексту одну или несколько меток (спам/не спам, тональность, тема). Пайплайн: токенизация → энкодер (BERT-подобный) → [CLS]-представление → linear-классификатор → softmax/sigmoid.<\/p><pre><code>from transformers import AutoTokenizer, AutoModelForSequenceClassification\nimport torch\ntok = AutoTokenizer.from_pretrained('distilbert-base-uncased')\nmodel = AutoModelForSequenceClassification.from_pretrained('distilbert-base-uncased', num_labels=2)\ninputs = tok('Great product, highly recommend!', return_tensors='pt', truncation=True, padding=True)\nlogits = model(**inputs).logits\nprobs = torch.softmax(logits, dim=-1)<\/code><\/pre><p>Для многометочной (multi-label) классификации используют <code>BCEWithLogitsLoss<\/code> вместо <code>CrossEntropyLoss<\/code> и sigmoid вместо softmax на выходе.<\/p><ul><li>Дисбаланс классов — частая проблема: используйте <code>class_weight<\/code>, focal loss или oversampling редкого класса<\/li><li>Метрики: accuracy обманчива при дисбалансе — смотрите F1, precision/recall, confusion matrix<\/li><li>Для простых задач с малым датасетом иногда классический TF-IDF + LogisticRegression обгоняет BERT по скорости внедрения без просадки качества<\/li><\/ul>", "links": [{"title": "HuggingFace Text Classification guide", "url": "https://huggingface.co/docs/transformers/tasks/sequence_classification"}, {"title": "scikit-learn Text Feature Extraction (TF-IDF)", "url": "https://scikit-learn.org/stable/modules/feature_extraction.html#text-feature-extraction"}, {"title": "scikit-learn LogisticRegression docs", "url": "https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html"}]}, {"title": "Named Entity Recognition (NER)", "level": "🟡 Middle", "explanation": "<p>NER — задача разметки токенов по типам сущностей (персона, организация, локация, дата и т.д.). Стандартная схема разметки — <b>BIO<\/b> (Begin/Inside/Outside): <code>B-PER<\/code>, <code>I-PER<\/code>, <code>O<\/code>.<\/p><pre><code>from transformers import pipeline\nner = pipeline('ner', model='dslim/bert-base-NER', aggregation_strategy='simple')\nresult = ner('Илон Маск работает в SpaceX в Калифорнии')\n# [{'entity_group': 'PER', 'word': 'Илон Маск', ...}, {'entity_group': 'ORG', ...}]<\/code><\/pre><p>Ключевая техническая сложность — выравнивание токенов subword-токенизатора с исходными словами и метками: одно слово может разбиться на несколько токенов, и нужно решить, какому токену присвоить метку (обычно первому, остальные — <code>-100<\/code>, игнорируются в loss).<\/p><table><tr><th>Метрика<\/th><th>Что измеряет<\/th><\/tr><tr><td>Entity-level F1<\/td><td>Точное совпадение всей сущности целиком<\/td><\/tr><tr><td>Token-level F1<\/td><td>По отдельным токенам (менее строго)<\/td><\/tr><\/table><p>Библиотека <code>seqeval<\/code> — стандарт для правильного entity-level подсчёта метрик. Частая ошибка — считать accuracy по токенам, что сильно завышает результат из-за преобладания класса O.<\/p>", "links": [{"title": "HuggingFace Token Classification guide", "url": "https://huggingface.co/docs/transformers/tasks/token_classification"}, {"title": "seqeval GitHub", "url": "https://github.com/chakki-works/seqeval"}, {"title": "Named-entity recognition — Wikipedia", "url": "https://en.wikipedia.org/wiki/Named-entity_recognition"}]}, {"title": "Sentence embeddings и семантический поиск", "level": "🟡 Middle", "explanation": "<p>Sentence embeddings превращают целое предложение/абзац в один вектор фиксированной размерности так, чтобы косинусное расстояние отражало семантическую близость. Обычный BERT для этого плохо подходит без дообучения — используют <b>Sentence-BERT (SBERT)<\/b>, обученный на парах предложений через siamese-сеть с triplet/contrastive loss.<\/p><pre><code>from sentence_transformers import SentenceTransformer, util\nmodel = SentenceTransformer('all-MiniLM-L6-v2')\nemb1 = model.encode('Как приготовить пасту?')\nemb2 = model.encode('Рецепт пасты карбонара')\nsimilarity = util.cos_sim(emb1, emb2)<\/code><\/pre><p>Это основа для <b>RAG (Retrieval-Augmented Generation)<\/b>: документы разбиваются на чанки, кодируются в эмбеддинги, сохраняются в векторную БД (FAISS, Qdrant, pgvector), а при запросе находится top-k ближайших чанков для контекста LLM.<\/p><ul><li>Выбирайте размер чанка осознанно: слишком крупный — размывает релевантность, слишком мелкий — теряет контекст<\/li><li>Для доменных данных (медицина, юриспруденция) общие эмбеддинги работают хуже — рассмотрите fine-tuning или доменные модели<\/li><li>Гибридный поиск (BM25 + dense embeddings) часто надёжнее чистого semantic search<\/li><\/ul>", "links": [{"title": "Sentence-Transformers docs", "url": "https://www.sbert.net/"}, {"title": "Sentence-BERT paper (arXiv)", "url": "https://arxiv.org/abs/1908.10084"}, {"title": "FAISS GitHub", "url": "https://github.com/facebookresearch/faiss"}, {"title": "Retrieval-Augmented Generation paper (arXiv)", "url": "https://arxiv.org/abs/2005.11401"}]}, {"title": "Оценка NLP-моделей", "level": "🔴 Senior", "explanation": "<p>Выбор метрики критичен и сильно зависит от задачи. Для генерации текста нет единой «правильной» метрики — automated метрики лишь приближение к человеческой оценке.<\/p><table><tr><th>Задача<\/th><th>Метрики<\/th><\/tr><tr><td>Классификация<\/td><td>Accuracy, F1, ROC-AUC<\/td><\/tr><tr><td>NER<\/td><td>Entity-level F1 (seqeval)<\/td><\/tr><tr><td>Машинный перевод<\/td><td>BLEU, chrF, COMET<\/td><\/tr><tr><td>Суммаризация<\/td><td>ROUGE-1/2/L, BERTScore<\/td><\/tr><tr><td>Генерация LLM<\/td><td>Human eval, LLM-as-judge, MMLU/HellaSwag для general ability<\/td><\/tr><\/table><pre><code>from rouge_score import rouge_scorer\nscorer = rouge_scorer.RougeScorer(['rouge1', 'rougeL'], use_stemmer=True)\nscores = scorer.score('reference text', 'generated text')<\/code><\/pre><p>BLEU/ROUGE считают n-граммное перекрытие и плохо ловят перефразирование — BERTScore (на эмбеддингах) точнее коррелирует с человеческой оценкой. Для чат-ботов и LLM всё чаще используют <b>LLM-as-judge<\/b> (более мощная модель оценивает ответ по рубрике), но это чревато систематическими смещениями (bias к более длинным ответам, к своему же стилю).<\/p><p>Продакшн-совет: всегда держите human-in-the-loop выборку для калибровки автоматических метрик, иначе легко оптимизировать модель под метрику, а не под реальное качество (метрика Гудхарта).<\/p>", "links": [{"title": "HuggingFace Evaluate library docs", "url": "https://huggingface.co/docs/evaluate/index"}, {"title": "BERTScore paper (arXiv)", "url": "https://arxiv.org/abs/1904.09675"}, {"title": "ROUGE paper (ACL Anthology)", "url": "https://aclanthology.org/W04-1013/"}]}, {"title": "Проблемы генеративных моделей: галлюцинации и bias", "level": "🔴 Senior", "explanation": "<p>Галлюцинации — генерация уверенно звучащих, но фактически неверных утверждений. Причина фундаментальна: LLM обучены предсказывать вероятное продолжение текста, а не проверять истинность. Смягчить, но не полностью убрать, помогают:<\/p><ul><li><b>RAG<\/b> — подмешивание проверенных фактов в контекст<\/li><li><b>Grounding<\/b> — требование цитировать источник для каждого утверждения<\/li><li><b>Constrained decoding<\/b> — ограничение генерации допустимой грамматикой/схемой (для structured output)<\/li><li>Fine-tuning на инструкциях с явным отказом отвечать при неуверенности («I don't know»)<\/li><\/ul><pre><code># пример structured output с ограничением схемы\nfrom pydantic import BaseModel\nclass Answer(BaseModel):\n    fact: str\n    confidence: float\n\nresponse = client.chat.completions.create(\n    model='...', response_format=Answer, messages=[...])<\/code><\/pre><p>Bias — модель наследует предвзятости обучающего корпуса (гендерные, расовые, культурные стереотипы). В продакшене это не абстрактная этика, а юридический и репутационный риск.<\/p><p>Практика: для критичных доменов (медицина, финансы, юриспруденция) никогда не полагайтесь на голый LLM-вывод без верификации — стройте pipeline с явными проверками, логированием и human review для edge cases, и регулярно прогоняйте red-teaming тесты на известных паттернах галлюцинаций.<\/p>", "links": [{"title": "Survey of Hallucination in Natural Language Generation (arXiv)", "url": "https://arxiv.org/abs/2202.03629"}, {"title": "Retrieval-Augmented Generation paper (arXiv)", "url": "https://arxiv.org/abs/2005.11401"}, {"title": "Anthropic Docs — Reducing hallucinations", "url": "https://docs.anthropic.com/en/docs/test-and-evaluate/strengthen-guardrails/reduce-hallucinations"}]}], "quiz": [{"q": "Почему BPE-токенизация лучше пословной для больших языковых моделей?", "options": ["Она быстрее по вычислениям", "Решает проблему OOV-слов и сокращает словарь за счёт субслов", "Она не требует обучения на корпусе", "Работает только с английским языком"], "answer": 1, "explain": "BPE разбивает редкие слова на известные подслова, избегая проблемы неизвестных слов при разумном размере словаря."}, {"q": "Главное ограничение статических эмбеддингов вроде Word2Vec?", "options": ["Слишком большой размер векторов", "Один вектор на слово независимо от контекста", "Не поддерживают арифметику векторов", "Требуют GPU для инференса"], "answer": 1, "explain": "Word2Vec даёт одинаковый вектор для слова во всех контекстах, не различая, например, разные значения омонимов."}, {"q": "Какую проблему LSTM решает по сравнению с ванильной RNN?", "options": ["Ускоряет параллельное обучение на GPU", "Затухающий/взрывающийся градиент через гейты и ячейку памяти", "Убирает необходимость в backpropagation", "Позволяет обрабатывать изображения"], "answer": 1, "explain": "Гейты LSTM и отдельная память ячейки позволяют градиенту течь через много шагов без затухания."}, {"q": "Зачем в формуле attention делят QK^T на sqrt(d_k)?", "options": ["Для ускорения вычислений", "Для стабилизации softmax при больших размерностях, избегая насыщения градиентов", "Чтобы уменьшить число параметров", "Это чисто историческая условность без эффекта"], "answer": 1, "explain": "Без масштабирования при больших d_k значения scores становятся очень большими, softmax насыщается, градиенты почти исчезают."}, {"q": "В чём принципиальное архитектурное отличие BERT от GPT?", "options": ["BERT decoder-only, GPT encoder-only", "BERT двунаправленный encoder, GPT — causal (однонаправленный) decoder", "BERT не использует attention", "GPT не может быть дообучен"], "answer": 1, "explain": "BERT видит весь контекст сразу (masked LM), GPT генерирует слева направо, видя только предыдущие токены."}, {"q": "Что делает LoRA при fine-tuning больших моделей?", "options": ["Полностью переобучает все веса модели", "Добавляет обучаемые низкоранговые матрицы, замораживая исходные веса", "Заменяет attention на свёртки", "Уменьшает размер словаря токенизатора"], "answer": 1, "explain": "LoRA обучает лишь малую долю параметров через низкоранговые адаптеры, экономя память и время при сравнимом качестве."}, {"q": "Какая метрика корректно оценивает NER-модель на уровне целых сущностей?", "options": ["Token-level accuracy", "Entity-level F1 (например, через seqeval)", "BLEU", "Perplexity"], "answer": 1, "explain": "Entity-level F1 требует точного совпадения границ и типа всей сущности, в отличие от завышающего результат token-level accuracy."}, {"q": "Зачем нужны sentence embeddings (SBERT) в RAG-системах?", "options": ["Для генерации итогового текста ответа", "Для кодирования запроса и документов в вектора и поиска семантически близких чанков", "Для токенизации текста", "Для подсчёта BLEU-метрики"], "answer": 1, "explain": "SBERT-эмбеддинги позволяют находить релевантные фрагменты документов по косинусной близости векторов для последующей подачи в LLM."}, {"q": "Что из перечисленного лучше всего помогает снизить галлюцинации LLM?", "options": ["Увеличение temperature при генерации", "RAG с подмешиванием проверенных фактов и grounding с цитированием источников", "Использование только greedy decoding", "Уменьшение размера контекстного окна"], "answer": 1, "explain": "RAG и grounding дают модели проверяемые факты и требование ссылаться на них, снижая уверенную генерацию неверных утверждений."}, {"q": "Почему BLEU/ROUGE плохо подходят для оценки качественного перефразирования при суммаризации?", "options": ["Они слишком медленно считаются", "Это n-граммные метрики, не учитывающие семантическую эквивалентность разных формулировок", "Они требуют GPU", "Они применимы только к классификации"], "answer": 1, "explain": "BLEU/ROUGE основаны на точном совпадении n-грамм, поэтому корректный перефразированный текст может получить низкий балл, хотя смысл сохранён; BERTScore лучше улавливает семантику."}], "id": 11, "pi": 2}, {"phase": "Phase 4 — LLM & GenAI", "section": "🤖 LLM: устройство и дообучение", "topics": [{"title": "Как обучают LLM: pretraining", "level": "🟢 Junior", "explanation": "<p>Pretraining — этап, на котором модель учится предсказывать следующий токен на огромном корпусе текста (триллионы токенов). Это self-supervised обучение: разметка не нужна, лейблом служит сам следующий токен.<\/p><ul><li>Задача — <code>next token prediction<\/code> (causal LM)<\/li><li>Данные: Common Crawl, книги, код, Wikipedia, отфильтрованные и дедуплицированные<\/li><li>Стоимость — миллионы долларов на GPU-кластерах для моделей 7B+<\/li><\/ul><p>Типичная ошибка новичков — путать pretraining с fine-tuning: pretraining даёт модели общие знания языка и мира, но она ещё не умеет следовать инструкциям.<\/p><pre><code># Псевдокод функции потерь pretraining\nloss = cross_entropy(model(tokens[:-1]), tokens[1:])\n<\/code><\/pre><p>Совет: если вы не Google/Meta — pretraining с нуля вам не нужен, берите открытые веса (Llama, Qwen, Mistral) и дообучайте.<\/p>", "links": [{"title": "GPT-3 Paper (arXiv)", "url": "https://arxiv.org/abs/2005.14165"}, {"title": "Hugging Face: Causal Language Modeling", "url": "https://huggingface.co/docs/transformers/tasks/language_modeling"}, {"title": "Karpathy: Let's build GPT (YouTube)", "url": "https://www.youtube.com/watch?v=kCc8FmEb1nY"}]}, {"title": "SFT (Supervised Fine-Tuning)", "level": "🟢 Junior", "explanation": "<p>SFT — обучение предобученной модели на парах (инструкция, желаемый ответ), чтобы она стала «чат-моделью», а не просто генератором текста.<\/p><ul><li>Датасет: тысячи-десятки тысяч качественных примеров диалогов<\/li><li>Формат обычно chat template с ролями <code>system/user/assistant<\/code><\/li><\/ul><table><tr><th>Этап<\/th><th>Что даёт<\/th><\/tr><tr><td>Pretraining<\/td><td>Знания языка и мира<\/td><\/tr><tr><td>SFT<\/td><td>Умение следовать инструкциям<\/td><\/tr><tr><td>RLHF<\/td><td>Соответствие человеческим предпочтениям<\/td><\/tr><\/table><pre><code>{\"messages\": [\n  {\"role\": \"user\", \"content\": \"Объясни рекурсию\"},\n  {\"role\": \"assistant\", \"content\": \"Рекурсия — это...\"}\n]}\n<\/code><\/pre><p>Частая ошибка в продакшене — переобучение (overfitting) на маленьком SFT-датасете: модель начинает дословно повторять примеры. Используйте early stopping и валидационный сплит.<\/p>", "links": [{"title": "InstructGPT Paper (arXiv)", "url": "https://arxiv.org/abs/2203.02155"}, {"title": "Hugging Face TRL: SFTTrainer", "url": "https://huggingface.co/docs/trl/sft_trainer"}, {"title": "Hugging Face Chat Templates", "url": "https://huggingface.co/docs/transformers/chat_templating"}]}, {"title": "RLHF и альтернативы (DPO, RLAIF)", "level": "🟡 Middle", "explanation": "<p>RLHF (Reinforcement Learning from Human Feedback) выравнивает модель по предпочтениям людей: обучают reward-модель на парах «ответ A лучше B», затем через PPO дообучают LLM максимизировать reward.<\/p><ul><li>Дорого и нестабильно (PPO сложен в тюнинге)<\/li><li>А
