q": "Какой первый шаг при отладке 'RAG выдаёт плохие ответы'?", "options": ["Сразу менять промпт генерации", "Проверить, находит ли retrieval вообще нужные документы (Recall@k), отдельно от генерации", "Увеличить температуру LLM", "Сменить провайдера LLM"], "answer": 1, "explain": "Если ретривер не находит нужные документы, никакой промпт-инжиниринг генерации не поможет — сначала нужно чинить retrieval."}], "id": 14, "pi": 3}, {"phase": "Phase 4 — LLM & GenAI", "section": "🕹️ AI-агенты и AI в разработке", "topics": [{"title": "Что такое AI-агент: цикл LLM + инструменты", "level": "🟢 Junior", "explanation": "<p>Агент — это не «умная модель сама по себе», а <b>цикл<\/b>: LLM получает задачу, решает что делать, вызывает инструмент, получает результат, повторяет, пока не сочтёт задачу решённой. Классическая схема — <code>observe → think → act → observe...<\/code>.<\/p><ul><li>LLM — «мозг», принимает решения на основе текста<\/li><li>Tools — функции, дающие доступ к внешнему миру (поиск, код, БД, файлы)<\/li><li>Orchestrator — код, который вызывает LLM в цикле и передаёт результаты инструментов обратно<\/li><\/ul><pre><code>while not done:\n    response = llm.call(messages, tools=tools)\n    if response.tool_calls:\n        for call in response.tool_calls:\n            result = execute_tool(call)\n            messages.append(tool_result(call, result))\n    else:\n        done = True\n        final_answer = response.content<\/code><\/pre><p>Типичная ошибка новичков — путать «агента» с «чат-ботом с системным промптом». Ключевое отличие агента — способность <b>самостоятельно решать<\/b>, какой инструмент вызвать и когда остановиться, а не следовать жёсткому скрипту.<\/p><p>Совет из продакшена: всегда ограничивайте число итераций цикла (<code>max_steps<\/code>), иначе агент может зациклиться и сжечь бюджет на токены.<\/p>", "quiz_ref": true, "links": [{"title": "Anthropic: Building effective agents", "url": "https://www.anthropic.com/research/building-effective-agents"}, {"title": "Anthropic Tool Use docs", "url": "https://docs.anthropic.com/en/docs/build-with-claude/tool-use"}, {"title": "ReAct paper (arXiv)", "url": "https://arxiv.org/abs/2210.03629"}]}, {"title": "Проектирование инструментов (tools) для агента", "level": "🟢 Junior", "explanation": "<p>Качество агента на 80% определяется качеством описания инструментов, а не самой моделью. LLM выбирает инструмент по его имени, описанию и схеме параметров.<\/p><ul><li>Название должно быть однозначным: <code>search_web<\/code>, а не <code>do_stuff<\/code><\/li><li>Описание — что делает функция, когда её использовать, какие есть ограничения<\/li><li>Параметры — строгая JSON Schema с типами и примерами<\/li><li>Возвращаемое значение — компактное, структурированное (JSON), без «простыней» текста<\/li><\/ul><pre><code>{\n  \"name\": \"get_weather\",\n  \"description\": \"Возвращает текущую погоду по названию города. Используй, когда пользователь спрашивает про погоду.\",\n  \"parameters\": {\n    \"type\": \"object\",\n    \"properties\": {\n      \"city\": {\"type\": \"string\", \"description\": \"Название города, например Moscow\"}\n    },\n    \"required\": [\"city\"]\n  }\n}<\/code><\/pre><p>Типичная ошибка — делать один «супер-инструмент» с 20 опциональными параметрами. Модель путается и вызывает его неправильно. Лучше несколько узких инструментов, чем один универсальный.<\/p><p>Совет: логируйте все вызовы инструментов в проде — это лучший источник данных для отладки и улучшения промптов.<\/p>", "quiz_ref": true, "links": [{"title": "Anthropic Tool Use docs", "url": "https://docs.anthropic.com/en/docs/build-with-claude/tool-use"}, {"title": "OpenAI Function calling guide", "url": "https://platform.openai.com/docs/guides/function-calling"}, {"title": "JSON Schema", "url": "https://json-schema.org/"}]}, {"title": "ReAct: рассуждение + действие", "level": "🟢 Junior", "explanation": "<p><b>ReAct<\/b> (Reasoning + Acting) — паттерн, где модель чередует явные размышления (<i>Thought<\/i>) и действия (<i>Action<\/i>), наблюдая результат (<i>Observation<\/i>) перед следующим шагом.<\/p><pre><code>Thought: нужно узнать курс доллара\nAction: search(\"курс доллара сегодня\")\nObservation: 1 USD = 92.3 RUB\nThought: теперь могу посчитать\nAction: calculator(\"100 * 92.3\")\nObservation: 9230\nThought: у меня есть ответ\nFinal Answer: 9230 рублей<\/code><\/pre><p>Промежуточные «Thought» шаги повышают качество за счёт того, что модель explicitly проговаривает план, прежде чем действовать — это снижает число импульсивных неверных вызовов инструментов.<\/p><ul><li>Плюс: прозрачность и объяснимость решений<\/li><li>Минус: больше токенов и латентности на каждый шаг<\/li><\/ul><p>В современных API (function calling / tool use) reasoning часто скрыт внутри модели (как в расширенном thinking), но принцип тот же: думать перед действием. Частая ошибка — не логировать Thought-шаги, из-за чего невозможно понять, почему агент принял неверное решение.<\/p>", "quiz_ref": true, "links": [{"title": "ReAct paper (arXiv)", "url": "https://arxiv.org/abs/2210.03629"}, {"title": "Anthropic: Building effective agents", "url": "https://www.anthropic.com/research/building-effective-agents"}, {"title": "LangChain ReAct agent docs", "url": "https://python.langchain.com/docs/modules/agents/agent_types/react"}]}, {"title": "Планирование задач агентом (task decomposition)", "level": "🟡 Middle", "explanation": "<p>Для сложных задач одного цикла ReAct недостаточно — нужен явный этап <b>планирования<\/b>: разбить цель на подзадачи, определить порядок и зависимости.<\/p><ul><li><b>Plan-and-Execute<\/b>: сначала LLM строит весь план списком шагов, затем исполнитель выполняет их по очереди<\/li><li><b>Динамическое перепланирование<\/b>: если шаг провалился или изменились условия, план пересобирается<\/li><li><b>Декомпозиция через подагентов<\/b>: сложная задача делится на подзадачи, каждая решается отдельным вызовом агента<\/li><\/ul><pre><code># Пример плана, сгенерированного LLM\n[\n  \"1. Найти актуальные цены конкурентов\",\n  \"2. Собрать данные о наших ценах из БД\",\n  \"3. Сравнить и найти отклонения > 10%\",\n  \"4. Сформировать отчёт в markdown\"\n]<\/code><\/pre><p>Типичная ошибка — доверять плану LLM вслепую и выполнять его без валидации промежуточных результатов. В проде добавляйте checkpoint'ы: после каждого шага проверяйте, что результат разумен, прежде чем переходить дальше.<\/p><p>Совет: для задач с чёткой структурой (ETL, отчёты) часто выгоднее написать детерминированный pipeline и вызывать LLM только на нужных шагах, а не отдавать всё планирование модели.<\/p>", "quiz_ref": true, "links": [{"title": "Anthropic: Building effective agents", "url": "https://www.anthropic.com/research/building-effective-agents"}, {"title": "Plan-and-Solve Prompting paper (arXiv)", "url": "https://arxiv.org/abs/2305.04091"}, {"title": "LangGraph docs", "url": "https://langchain-ai.github.io/langgraph/"}]}, {"title": "Multi-agent системы: роли и координация", "level": "🟡 Middle", "explanation": "<p>Вместо одного «универсального» агента часто эффективнее собрать команду специализированных агентов, каждый со своей ролью и набором инструментов.<\/p><table><tr><th>Паттерн<\/th><th>Описание<\/th><\/tr><tr><td>Supervisor / Orchestrator<\/td><td>Главный агент делегирует подзадачи другим и собирает результат<\/td><\/tr><tr><td>Pipeline<\/td><td>Агенты работают последовательно, как конвейер (researcher → writer → editor)<\/td><\/tr><tr><td>Debate / Critic<\/td><td>Один агент генерирует, другой критикует — повышает качество финального ответа<\/td><\/tr><\/table><pre><code>supervisor_prompt = \"\"\"\nТы координатор. Разбей задачу и делегируй:\n- researcher: сбор фактов\n- coder: написание кода\n- reviewer: проверка кода\nВерни JSON с назначениями.\n\"\"\"<\/code><\/pre><p>Библиотеки: LangGraph, CrewAI, AutoGen, OpenAI Swarm/Agents SDK. Частая ошибка — плодить агентов там, где хватило бы одного с хорошим промптом: multi-agent增 добавляет латентность, стоимость и точки отказа (ошибка на одном шаге каскадируется).<\/p><p>Совет: начинайте с одного агента, переходите на multi-agent только когда есть чёткое разделение ответственности и данные показывают, что один агент «путается».<\/p>", "quiz_ref": true, "links": [{"title": "LangGraph docs", "url": "https://langchain-ai.github.io/langgraph/"}, {"title": "CrewAI docs", "url": "https://docs.crewai.com/"}, {"title": "Microsoft AutoGen docs", "url": "https://microsoft.github.io/autogen/"}, {"title": "OpenAI Agents SDK", "url": "https://openai.github.io/openai-agents-python/"}]}, {"title": "MCP (Model Context Protocol)", "level": "🟡 Middle", "explanation": "<p><b>MCP<\/b> — открытый протокол от Anthropic для стандартизации связи между LLM-приложениями и внешними источниками данных/инструментами. Идея: один универсальный интерфейс вместо кастомной интеграции под каждый агент.<\/p><ul><li><b>MCP Server<\/b> — предоставляет ресурсы (файлы, БД), инструменты (функции) и промпты<\/li><li><b>MCP Client<\/b> — приложение (например, Claude Desktop, Claude Code), которое подключается к серверам<\/li><li>Транспорт: stdio (локально) или HTTP/SSE (удалённо)<\/li><\/ul><pre><code># Минимальный MCP-сервер на Python (mcp SDK)\nfrom mcp.server.fastmcp import FastMCP\n\nmcp = FastMCP(\"demo\")\n\n@mcp.tool()\ndef get_issue(issue_id: str) -> str:\n    \"\"\"Возвращает описание задачи по ID\"\"\"\n    return fetch_from_jira(issue_id)\n\nmcp.run()<\/code><\/pre><p>Плюс MCP — переиспользуемость: написал сервер для Jira один раз, подключил к любому MCP-совместимому клиенту (Claude Code, Cursor и др.), не переписывая интеграцию под каждый инструмент.<\/p><p>Типичная ошибка — открывать MCP-сервер с чрезмерными правами (например, полный доступ к файловой системе) без ограничений. Всегда ограничивайте scope и добавляйте подтверждение для деструктивных операций.<\/p>", "quiz_ref": true, "links": [{"title": "Model Context Protocol — официальный сайт", "url": "https://modelcontextprotocol.io/"}, {"title": "MCP спецификация", "url": "https://spec.modelcontextprotocol.io/"}, {"title": "MCP на GitHub", "url": "https://github.com/modelcontextprotocol"}, {"title": "Anthropic docs: MCP", "url": "https://docs.anthropic.com/en/docs/agents-and-tools/mcp"}]}, {"title": "Память агентов: краткосрочная и долгосрочная", "level": "🟡 Middle", "explanation": "<p>LLM не имеет памяти между вызовами — всё «состояние» агента нужно явно передавать в контексте или хранить внешне.<\/p><ul><li><b>Краткосрочная память<\/b> — история сообщений в текущей сессии (context window)<\/li><li><b>Долгосрочная память<\/b> — факты о пользователе/проекте, сохранённые во внешнем хранилище (векторная БД, key-value, файл)<\/li><li><b>Эпизодическая память<\/b> — записи о прошлых успешных/неуспешных действиях для обучения на опыте<\/li><\/ul><pre><code># Простая долгосрочная память через векторный поиск\nmemory.add(\"Пользователь предпочитает Python, не JS\")\n...\nrelevant = memory.search(query=\"на каком языке писать код?\", top_k=3)\nprompt = build_prompt(context=relevant, query=query)<\/code><\/pre><p>Проблема роста контекста: если просто накапливать всю историю, вы упрётесь в лимит токенов и рост стоимости/латентности. Решения — суммаризация старых сообщений, скользящее окно, извлечение только релевантных фрагментов (RAG-подход к памяти).<\/p><p>Частая ошибка — хранить в памяти «сырые» логи без структурирования, из-за чего поиск релевантных фактов работает плохо. Извлекайте факты в структурированном виде (например, JSON с ключевыми атрибутами).<\/p>", "quiz_ref": true, "links": [{"title": "LangChain Memory docs", "url": "https://python.langchain.com/docs/modules/memory/"}, {"title": "Anthropic: Building effective agents", "url": "https://www.anthropic.com/research/building-effective-agents"}, {"title": "Pinecone: vector databases guide", "url": "https://www.pinecone.io/learn/vector-database/"}]}, {"title": "Оценка (evaluation) агентов", "level": "🔴 Senior", "explanation": "<p>Оценивать агентов сложнее, чем обычные LLM-ответы, потому что важен не только финальный ответ, но и <b>траектория<\/b> — последовательность действий.<\/p><ul><li><b>Task success rate<\/b> — доля задач, доведённых до правильного результата<\/li><li><b>Trajectory evaluation<\/b> — проверка, что путь к решению был разумным (не «случайно повезло»)<\/li><li><b>LLM-as-judge<\/b> — другая LLM оценивает качество ответа по рубрике<\/li><li><b>Cost / latency per task<\/b> — критично для продакшена, не только качество<\/li><\/ul><pre><code># Пример метрики trajectory match\ndef eval_trajectory(actual_calls, expected_calls):\n    correct = sum(1 for a, e in zip(actual_calls, expected_calls) if a.tool == e.tool)\n    return correct / len(expected_calls)<\/code><\/pre><table><tr><th>Метод<\/th><th>Когда использовать<\/th><\/tr><tr><td>Golden dataset + exact match<\/td><td>Детерминированные задачи (API-вызовы)<\/td><\/tr><tr><td>LLM-judge с рубрикой<\/td><td>Открытые задачи (написание текста, код-ревью)<\/td><\/tr><tr><td>Human-in-the-loop<\/td><td>Высокий риск ошибки (финансы, медицина)<\/td><\/tr><\/table><p>Типичная ошибка — оценивать агента только на «счастливых путях». Обязательно тестируйте edge cases: недоступный инструмент, неоднозначный запрос, противоречивые данные. Используйте фреймворки типа <code>promptfoo<\/code>, <code>langsmith<\/code>, <code>braintrust<\/code> для регрессионного тестирования промптов и агентов.<\/p>", "quiz_ref": true, "links": [{"title": "LangSmith docs", "url": "https://docs.smith.langchain.com/"}, {"title": "promptfoo docs", "url": "https://www.promptfoo.dev/docs/intro/"}, {"title": "Braintrust docs", "url": "https://www.braintrust.dev/docs"}]}, {"title": "AI-ассистенты для кода: Copilot, Cursor, Claude Code", "level": "🟢 Junior", "explanation": "<p>AI-кодинг-ассистенты делятся по глубине интеграции и уровню автономности:<\/p><table><tr><th>Инструмент<\/th><th>Модель работы<\/th><\/tr><tr><td>GitHub Copilot<\/td><td>Автодополнение в реальном времени, inline suggestions<\/td><\/tr><tr><td>Cursor<\/td><td>IDE с чатом, multi-file edits, композитные изменения<\/td><\/tr><tr><td>Claude Code<\/td><td>Агентный CLI: читает кодовую базу, выполняет команды, запускает тесты, коммитит<\/td><\/tr><\/table><p>Разница принципиальна: автодополнение (Copilot) реагирует на то, что вы уже печатаете, а агентные инструменты (Claude Code) самостоятельно исследуют репозиторий, запускают команды и итеративно проверяют результат.<\/p><pre><code># Типичный агентный цикл в Claude Code\n1. Прочитать релевантные файлы (Grep/Glob/Read)\n2. Внести изменения (Edit/Write)\n3. Запустить тесты (Bash)\n4. Если тесты упали — проанализировать и исправить\n5. Повторить до зелёных тестов<\/code><\/pre><p>Частая ошибка новичков — слепо принимать все предложения ассистента без чтения диффа. Всегда проверяйте сгенерированный код перед коммитом, особенно логику работы с деньгами, безопасностью и данными пользователей.<\/p>", "quiz_ref": true, "links": [{"title": "GitHub Copilot docs", "url": "https://docs.github.com/en/copilot"}, {"title": "Cursor docs", "url": "https://docs.cursor.com/"}, {"title": "Claude Code docs", "url": "https://docs.anthropic.com/en/docs/claude-code"}]}, {"title": "Эффективная работа с AI при разработке (промптинг для кода)", "level": "🟢 Junior", "explanation": "<p>Качество результата ассистента напрямую зависит от качества контекста и постановки задачи.<\/p><ul><li>Указывайте конкретные файлы/функции, а не «почини баг где-то там»<\/li><li>Давайте контекст: стек, конвенции проекта, ограничения (например, «не менять публичный API»)<\/li><li>Просите план перед реализацией для сложных задач — легче поймать ошибку в плане, чем в готовом коде<\/li><li>Разбивайте большие задачи на маленькие итерации с проверкой на каждом шаге<\/li><\/ul><pre><code>Плохой промпт:\n\"Сделай форму регистрации\"\n\nХороший промпт:\n\"Добавь форму регистрации в src/pages/Register.tsx.\nИспользуй react-hook-form + zod для валидации (как в LoginForm.tsx).\nПоля: email, password (мин 8 симв.), confirmPassword.\nНе трогай существующий AuthContext.\"<\/code><\/pre><p>Совет из практики: держите файл вроде <code>CLAUDE.md<\/code> / <code>.cursorrules<\/code> с описанием архитектуры, конвенций и команд запуска тестов — это резко снижает число итераций «объясни заново».<\/p><p>Ошибка — просить ассистента «переписать всё с нуля» вместо инкрементальных изменений: теряется контроль над диффом и растёт риск регрессий.<\/p>", "quiz_ref": true, "links": [{"title": "Claude Code docs", "url": "https://docs.anthropic.com/en/docs/claude-code"}, {"title": "Anthropic prompt engineering guide", "url": "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview"}, {"title": "Cursor docs", "url": "https://docs.cursor.com/"}]}, {"title": "Code review с LLM", "level": "🟡 Middle", "explanation": "<p>LLM хорошо ловит определённые классы проблем в code review, но не заменяет человека полностью.<\/p><ul><li>Хорошо ловит: опечатки в логике, несоответствие конвенциям, отсутствие обработки ошибок, потенциальные null-указатели, забытые edge cases<\/li><li>Плохо ловит: архитектурные компромиссы, бизнес-логику без контекста продукта, проблемы производительности под реальной нагрузкой<\/li><\/ul><pre><code># Промпт для ревью диффа\nreview_prompt = f\"\"\"\nПроверь этот diff на:\n1. Логические ошибки\n2. Проблемы безопасности (SQL injection, XSS)\n3. Несоответствие стилю проекта (см. CLAUDE.md)\nНЕ комментируй форматирование — это делает linter.\n\ndiff:\n{diff_text}\n\"\"\"<\/code><\/pre><p>Продакшн-паттерн: LLM-ревью как дополнительный gate в CI (например, комментарии к PR), но обязательный человеческий approve перед мержем в main — особенно для кода, трогающего auth, платежи, миграции БД.<\/p><p>Типичная ошибка — гонять весь диф целиком без ограничения scope, из-за чего модель «размазывает» внимание и пропускает критичные строки. Разбивайте большие PR на логические чанки для ревью.<\/p>", "quiz_ref": true, "links": [{"title": "Anthropic prompt engineering guide", "url": "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview"}, {"title": "OWASP Top 10 for LLM Applications", "url": "https://owasp.org/www-project-top-10-for-large-language-model-applications/"}, {"title": "GitHub Copilot docs", "url": "https://docs.github.com/en/copilot"}]}, {"title": "Автоматизация рутины через агентов (хуки, скрипты)", "level": "🟡 Middle", "explanation": "<p>Помимо интерактивного использования, агентов встраивают в автоматизированные пайплайны: генерация коммит-сообщений, автозаполнение changelog, триаж issue, генерация тестов по коду.<\/p><ul><li><b>Git hooks<\/b> — pre-commit генерация/проверка через LLM (например, проверка на секреты)<\/li><li><b>CI-интеграция<\/b> — авто-ревью PR, авто-триаж багов по логам<\/li><li><b>Scheduled agents<\/b> — периодический обход репозитория на поиск устаревших зависимостей, dead code<\/li><\/ul><pre><code># Пример: авто-генерация summary PR в CI\ndiff = get_pr_diff()\nsummary = llm.call(f\"Опиши изменения кратко:\\n{diff}\")\npost_pr_comment(summary)<\/code><\/pre><p>Ключевой принцип надёжной автоматизации — <b>детерминированные обвязки вокруг недетерминированного ядра<\/b>: сам LLM-вызов непредсказуем, но пайплайн вокруг (retry, валидация вывода, fallback) должен быть строгим кодом.<\/p><p>Частая ошибка — давать автоматизированному агенту деструктивные права (force push, удаление файлов, мерж без ревью) без human-in-the-loop подтверждения. Для необратимых действий всегда нужен явный approval gate.<\/p>", "quiz_ref": true, "links": [{"title": "GitHub Actions docs", "url": "https://docs.github.com/en/actions"}, {"title": "Claude Code docs", "url": "https://docs.anthropic.com/en/docs/claude-code"}, {"title": "pre-commit framework docs", "url": "https://pre-commit.com/"}]}, {"title": "Ограничения и риски автономных агентов", "level": "🔴 Senior", "explanation": "<p>Автономность агента — это компромисс между удобством и контролем. Чем больше агент делает сам, тем выше риск непредсказуемых последствий.<\/p><ul><li><b>Prompt injection<\/b> — вредоносный текст в данных (веб-страница, email, файл), заставляющий агента выполнить нежелательное действие<\/li><li><b>Цепочки ошибок<\/b> — одна неверная посылка на раннем шаге искажает весь дальнейший план<\/li><li><b>Избыточные привилегии<\/b> — агент с доступом к продакшн-БД может случайно удалить данные при неверной интерпретации задачи<\/li><li><b>Стоимость/латентность runaway<\/b> — зацикливание без ограничения шагов<\/li><\/ul><pre><code># Пример защиты от prompt injection в инструменте\ndef fetch_url(url: str) -> str:\n    content = http_get(url)\n    # Помечаем внешний контент как ненадёжный\n    return f\"[UNTRUSTED EXTERNAL CONTENT]\\n{content}\\n[END]\"<\/code><\/pre><table><tr><th>Митигация<\/th><th>Как<\/th><\/tr><tr><td>Least privilege<\/td><td>Инструменты только с минимально необходимыми правами<\/td><\/tr><tr><td>Human approval<\/td><td>Подтверждение для деструктивных/необратимых действий<\/td><\/tr><tr><td>Sandboxing<\/td><td>Выполнение кода в изолированной среде, без доступа к реальной инфраструктуре<\/td><\/tr><tr><td>Audit log<\/td><td>Полное логирование всех действий агента для разбора инцидентов<\/td><\/tr><\/table><p>Главная ошибка senior-инженеров — недооценивать риск, потому что «модель обычно ведёт себя разумно». В проде проектируйте систему так, будто агент <i>иногда<\/i> сделает худшее из возможного, и ограничивайте blast radius заранее.<\/p>", "quiz_ref": true, "links": [{"title": "OWASP Top 10 for LLM Applications", "url": "https://owasp.org/www-project-top-10-for-large-language-model-applications/"}, {"title": "Anthropic: Building effective agents", "url": "https://www.anthropic.com/research/building-effective-agents"}, {"title": "Simon Willison: Prompt injection", "url": "https://simonwillison.net/series/prompt-injection/"}]}, {"title": "Function calling / Tool use API у современных LLM", "level": "🟡 Middle", "explanation": "<p>Function calling (tool use) — механизм, встроенный в API современных LLM (Anthropic, OpenAI и др.), позволяющий модели структурированно запрашивать вызов внешней функции вместо генерации свободного текста.<\/p><pre><code>import anthropic\nclient = anthropic.Anthropic()\n\nresponse = client.messages.create(\n    model=\"claude-sonnet-4-5\",\n    max_tokens=1024,\n    tools=[{\n        \"name\": \"get_stock_price\",\n        \"description\": \"Возвращает цену акции по тикеру\",\n        \"input_schema\": {\n            \"type\": \"object\",\n            \"properties\": {\"ticker\": {\"type\": \"string\"}},\n            \"required\": [\"ticker\"]\n        }\n    }],\n    messages=[{\"role\": \"user\", \"content\": \"Сколько стоит акция AAPL?\"}]\n)\n\nfor block in response.content:\n    if block.type == \"tool_use\":\n        result = get_stock_price(block.input[\"ticker\"])\n        # отправляем результат обратно в диалог как tool_result<\/code><\/pre><p>Модель возвращает <code>stop_reason: tool_use<\/code> вместо обычного текста, и приложение обязано выполнить вызов и вернуть результат в следующем сообщении с ролью <code>tool_result<\/code>, чтобы диалог продолжился.<\/p><p>Частая ошибка — забывать, что модель может запросить <b>несколько<\/b> инструментов параллельно за один ответ; код должен уметь обработать список tool_calls, а не только первый.<\/p>", "quiz_ref": true, "links": [{"title": "Anthropic Tool Use docs", "url": "https://docs.anthropic.com/en/docs/build-with-claude/tool-use"}, {"title": "OpenAI Function calling guide", "url": "https://platform.openai.com/docs/guides/function-calling"}, {"title": "Anthropic Python SDK (GitHub)", "url": "https://github.com/anthropics/anthropic-sdk-python"}]}], "quiz": [{"q": "Что принципиально отличает AI-агента от обычного вызова LLM с системным промптом?", "options": ["Агент использует более крупную модель", "Агент самостоятельно решает, какой инструмент вызвать и когда остановиться, работая в цикле", "Агент не может писать код", "Агент всегда работает без интернета"], "answer": 1, "explain": "Ключевое отличие агента — цикл наблюдение-решение-действие с самостоятельным выбором инструментов, а не жёсткий одноразовый вызов."}, {"q": "Какая ошибка чаще всего снижает качество работы агента с инструментами?", "options": ["Слишком короткие имена функций", "Один универсальный инструмент с 20 опциональными параметрами вместо нескольких узких", "Использование JSON Schema для параметров", "Логирование вызовов инструментов"], "answer": 1, "explain": "Модели проще и надёжнее выбирать между узкоспециализированными инструментами, чем правильно заполнять один перегруженный универсальный."}, {"q": "Что даёт паттерн ReAct (Reasoning + Acting)?", "options": ["Ускоряет ответ модели за счёт пропуска рассуждений", "Явное чередование мыслей и действий, что снижает число импульсивных неверных вызовов", "Позволяет обойтись без инструментов вообще", "Гарантирует нулевую стоимость запроса"], "answer": 1, "explain": "ReAct заставляет модель явно проговаривать план (Thought) перед действием (Action), что повышает качество решений ценой доп. токенов."}, {"q": "Почему в продакшене не стоит доверять плану LLM без валидации промежуточных шагов?", "options": ["Планы LLM всегда написаны на английском", "Ошибка на раннем шаге плана может каскадироваться и испортить весь результат", "Планирование запрещено политикой OpenAI/Anthropic", "LLM не умеет строить списки"], "answer": 1, "explain": "Без checkpoint-валидации ошибочная посылка на одном из первых шагов распространяется на все последующие."}, {"q": "Когда переход на multi-agent архитектуру оправдан?", "options": ["Всегда, чем больше агентов — тем лучше результат", "Когда есть чёткое разделение ответственности и данные показывают, что один агент справляется хуже", "Только если бюджет на токены неограничен", "Multi-agent никогда не используется в проде"], "answer": 1, "explain": "Multi-agent добавляет латентность, стоимость и точки отказа, поэтому его стоит вводить только при обоснованной необходимости разделения ролей."}, {"q": "Какая главная ценность MCP (Model Context Protocol)?", "options": ["Он заменяет собой LLM API целиком", "Стандартизированный интерфейс, позволяющий переиспользовать один сервер-интеграцию с разными LLM-клиентами", "MCP ускоряет обучение моделей", "MCP работает только с Python"], "answer": 1, "explain": "MCP позволяет написать интеграцию (например, с Jira) один раз и подключать её к любому MCP-совместимому клиенту без переписывания."}, {"q": "Как правильно решать проблему роста контекста в памяти агента?", "options": ["Хранить всю историю сообщений без ограничений", "Использовать суммаризацию, скользящее окно и извлечение только релевантных фактов", "Отключить память полностью", "Увеличивать max_tokens до максимума у провайдера"], "answer": 1, "explain": "Простое накопление истории упирается в лимиты контекста и рост стоимости; нужна суммаризация и релевантный retrieval (RAG-подход)."}, {"q": "Почему оценивать агентов сложнее, чем обычные LLM-ответы?", "options": ["Агенты не дают текстовых ответов вообще", "Важна не только правильность финального ответа, но и разумность траектории действий", "Агентов нельзя тестировать автоматически", "У агентов нет метрик стоимости"], "answer": 1, "explain": "Trajectory evaluation проверяет, что путь к решению был обоснованным, а не что ответ верен случайно."}, {"q": "Чем агентный CLI-инструмент (например, Claude Code) принципиально отличается от автодополнения кода (Copilot)?", "options": ["Ничем, это одно и то же", "Агентный инструмент самостоятельно исследует репозиторий, выполняет команды и итеративно проверяет результат", "Автодополнение работает быстрее в любых сценариях", "Агентные инструменты не умеют работать с git"], "answer": 1, "explain": "Автодополнение реагирует на печатаемый текст, тогда как агентный инструмент действует автономно: читает файлы, запускает тесты, исправляет ошибки в цикле."}, {"q": "Какой риск считается одним из самых серьёзных для автономных агентов с доступом к внешним данным?", "options": ["Слишком красивое форматирование ответа", "Prompt injection — вредоносный текст во внешних данных, заставляющий агента выполнить нежелательное действие", "Использование JSON вместо XML", "Слишком быстрая работа агента"], "answer": 1, "explain": "Prompt injection через внешний контент (веб-страницы, письма, файлы) — один из главных векторов атак на агентов, требующий пометки контента как недоверенного и ограничения привилегий."}], "id": 15, "pi": 3}, {"phase": "Phase 5 — MLOps & Production", "section": "🚀 MLOps: деплой и мониторинг", "topics": [{"title": "Жизненный цикл ML-модели", "level": "🟢 Junior", "explanation": "<p>ML-модель проходит путь: сбор данных → эксперименты → обучение → валидация → деплой → мониторинг → переобучение. Новички часто думают, что работа заканчивается на <code>model.fit()<\/code>, но на практике деплой и поддержка занимают 80% времени команды.<\/p><ul><li><b>Data<\/b>: сбор, разметка, версионирование<\/li><li><b>Train<\/b>: эксперименты, подбор гиперпараметров<\/li><li><b>Validate<\/b>: офлайн-метрики, тест на holdout<\/li><li><b>Deploy<\/b>: упаковка, serving<\/li><li><b>Monitor<\/b>: дрифт, деградация, алерты<\/li><li><b>Retrain<\/b>: цикл повторяется<\/li><\/ul><p>Типичная ошибка джуна — считать пайплайн линейным. На деле это цикл с обратной связью: мониторинг в проде порождает новые данные для переобучения.<\/p><pre><code># Псевдо-пайплайн\ndata = collect_and_label()\nmodel = train(data)\nif validate(model) &gt; threshold:\n    deploy(model)\nmonitor(model)  # триггерит retrain при дрифте<\/code><\/pre><p>Совет: с первого дня проектируйте систему так, будто модель будет переобучаться раз в неделю — это избавит от боли позже.<\/p>", "links": [{"title": "Google ML Ops guide", "url": "https://cloud.google.com/architecture/mlops-continuous-delivery-and-automation-pipelines-in-machine-learning"}, {"title": "MLOps Wikipedia", "url": "https://en.wikipedia.org/wiki/MLOps"}, {"title": "Made With ML", "url": "https://madewithml.com/"}]}, {"title": "Версионирование данных: DVC", "level": "🟢 Junior", "explanation": "<p>Git плохо работает с большими файлами данных. <b>DVC (Data Version Control)<\/b> хранит метаданные в git, а сами данные — в удалённом хранилище (S3, MinIO, GDrive).<\/p><pre><code>dvc init\ndvc add data/train.csv\ngit add data/train.csv.dvc .gitignore\ngit commit -m \"add dataset v1\"\ndvc remote add -d storage s3://bucket/dvcstore\ndvc push<\/code><\/pre><p>Каждая версия датасета получает хэш, воспроизводимость экспериментов гарантирована — вы всегда можете <code>dvc checkout<\/code> к нужной версии данных вместе с git-коммитом кода.<\/p><table><tr><th>Инструмент<\/th><th>Что версионирует<\/th><\/tr><tr><td>Git<\/td><td>код<\/td><\/tr><tr><td>DVC<\/td><td>данные, модели, пайплайны<\/td><\/tr><tr><td>MLflow<\/td><td>эксперименты, метрики<\/td><\/tr><\/table><p>Частая ошибка — коммитить датасеты напрямую в git: репозиторий раздувается до гигабайт, клонирование становится мучением. Всегда добавляйте большие файлы через DVC/Git LFS.<\/p>", "links": [{"title": "DVC Documentation", "url": "https://dvc.org/doc"}, {"title": "DVC Get Started", "url": "https://dvc.org/doc/start"}, {"title": "Git LFS", "url": "https://git-lfs.com/"}]}, {"title": "Эксперимент-трекинг: MLflow", "level": "🟢 Junior", "explanation": "<p>Без трекинга через месяц вы забудете, какой seed, какие гиперпараметры и какая версия данных дали лучший результат. <b>MLflow Tracking<\/b> логирует параметры, метрики, артефакты и модели.<\/p><pre><code>import mlflow\n\nwith mlflow.start_run():\n    mlflow.log_param(\"lr\", 0.001)\n    mlflow.log_param(\"batch_size\", 32)\n    for epoch in range(epochs):\n        loss = train_epoch()\n        mlflow.log_metric(\"loss\", loss, step=epoch)\n    mlflow.sklearn.log_model(model, \"model\")<\/code><\/pre><p>Затем в UI (<code>mlflow ui<\/code>) можно сравнивать запуски визуально, сортировать по метрикам, находить лучший чекпоинт.<\/p><ul><li><b>MLflow Model Registry<\/b> — управление стадиями модели (Staging → Production → Archived)<\/li><li>Альтернативы: Weights & Biases, Neptune.ai, ClearML<\/li><\/ul><p>Продакшен-совет: логируйте не только метрики, но и хэш git-коммита и версию данных — это единственный способ честно воспроизвести результат через полгода.<\/p>", "links": [{"title": "MLflow Documentation", "url": "https://mlflow.org/docs/latest/index.html"}, {"title": "MLflow Tracking", "url": "https://mlflow.org/docs/latest/tracking.html"}, {"title": "Weights & Biases Docs", "url": "https://docs.wandb.ai/"}]}, {"title": "Docker для ML-приложений", "level": "🟢 Junior", "explanation": "<p>Docker решает проблему «у меня локально работало» — модель, зависимости и системные библиотеки (CUDA, cuDNN) упаковываются в один образ.<\/p><pre><code>FROM python:3.11-slim\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\nCOPY model.pkl app.py .\nEXPOSE 8000\nCMD [\"uvicorn\", \"app:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]<\/code><\/pre><p>Для GPU-инференса используйте образы <code>nvidia/cuda<\/code> и флаг <code>--gpus all<\/code> при запуске контейнера.<\/p><ul><li>Фиксируйте версии в <code>requirements.txt<\/code> (не <code>torch<\/code>, а <code>torch==2.3.1<\/code>) — иначе сборка через полгода развалится<\/li><li>Используйте multi-stage build, чтобы не тащить в финальный образ компиляторы и кэш pip<\/li><li>Проверяйте размер образа: модель весом 500 МБ + torch = легко больше 5 ГБ<\/li><\/ul><p>Типичная ошибка — не закреплять версию CUDA-драйвера хоста и образа, что приводит к <code>CUDA error: no kernel image is available<\/code>.<\/p>", "links": [{"title": "Docker Documentation", "url": "https://docs.docker.com/"}, {"title": "NVIDIA Container Toolkit", "url": "https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/index.html"}, {"title": "Docker for Python apps", "url": "https://docs.docker.com/language/python/"}]}, {"title": "Model Serving: FastAPI", "level": "🟡 Middle", "explanation": "<p>Самый простой и гибкий способ отдать модель — обернуть её в REST API на FastAPI. Подходит для небольшой и средней нагрузки, для кастомной бизнес-логики препроцессинга.<\/p><pre><code>from fastapi import FastAPI\nimport joblib\nfrom pydantic import BaseModel\n\napp = FastAPI()\nmodel = joblib.load(\"model.pkl\")\n\nclass Item(BaseModel):\n    features: list[float]\n\n@app.post(\"/predict\")\ndef predict(item: Item):\n    pred = model.predict([item.features])\n    return {\"prediction\": pred.tolist()}<\/code><\/pre><p>Для продакшена запускайте через <code>uvicorn<\/code> с несколькими воркерами (<code>gunicorn -k uvicorn.workers.UvicornWorker -w 4<\/code>), добавляйте health-check эндпоинт <code>/health<\/code> и timeouts.<\/p><ul><li>Валидируйте вход через Pydantic — избежите падений на «грязных» данных<\/li><li>Держите модель в памяти процесса, а не загружайте на каждый запрос<\/li><li>Логируйте latency каждого запроса — пригодится для мониторинга<\/li><\/ul><p>Ошибка новичков: держать тяжёлую модель на CPU без батчинга запросов — throughput падает в разы.<\/p>", "links": [{"title": "FastAPI Documentation", "url": "https://fastapi.tiangolo.com/"}, {"title": "Uvicorn", "url": "https://www.uvicorn.org/"}, {"title": "Pydantic Docs", "url": "https://docs.pydantic.dev/"}]}, {"title": "Model Serving: TorchServe и Triton", "level": "🟡 Middle", "explanation": "<p>Для высоконагруженных сервисов FastAPI-обёртка не всегда эффективна — нет динамического батчинга, сложнее версионировать модели. <b>TorchServe<\/b> и <b>NVIDIA Triton Inference Server<\/b> решают это на уровне инфраструктуры.<\/p><pre><code># TorchServe: упаковка модели\ntorch-model-archiver --model-name resnet \\\n  --version 1.0 --serialized-file model.pt \\\n  --handler image_classifier \\\n  --export-path model_store\n\ntorchserve --start --model-store model_store --models resnet=resnet.mar<\/code><\/pre><p>Triton поддерживает несколько бэкендов (PyTorch, TensorRT, ONNX) одновременно, динамический батчинг и multi-model serving на одном GPU с эффективным разделением памяти.<\/p><table><tr><th>Инструмент<\/th><th>Плюс<\/th><\/tr><tr><td>FastAPI<\/td><td>простота, гибкая логика<\/td><\/tr><tr><td>TorchServe<\/td><td>встроенный батчинг, метрики<\/td><\/tr><tr><td>Triton<\/td><td>максимальный throughput, мультибэкенд<\/td><\/tr><\/table><p>Совет: не берите Triton для MVP — оверинжиниринг. Начинайте с FastAPI, мигрируйте когда упрётесь в throughput.<\/p>", "links": [{"title": "TorchServe Documentation", "url": "https://pytorch.org/serve/"}, {"title": "NVIDIA Triton Inference Server", "url": "https://docs.nvidia.com/deeplearning/triton-inference-server/user-guide/docs/index.html"}, {"title": "ONNX Runtime", "url": "https://onnxruntime.ai/docs/"}]}, {"title": "Serving LLM: vLLM", "level": "🟡 Middle", "explanation": "<p>Обычная генерация токенов LLM через HuggingFace <code>generate()<\/code> крайне неэффективна под нагрузкой. <b>vLLM<\/b> использует PagedAttention для эффективного управления KV-кэшем и continuous batching.<\/p><pre><code>pip install vllm\n\nfrom vllm import LLM, SamplingParams\n\nllm = LLM(model=\"meta-llama/Llama-3-8B\")\nparams = SamplingParams(temperature=0.7, max_tokens=200)\noutputs = llm.generate([\"Explain MLOps in short\"], params)\nprint(outputs[0].outputs[0].text)<\/code><\/pre><p>Для продакшена запускается как OpenAI-совместимый сервер:<\/p><pre><code>python -m vllm.entrypoints.openai.api_server \\\n  --model meta-llama/Llama-3-8B --port 8000<\/code><\/pre><ul><li>Continuous batching даёт в разы больше throughput vs наивный batch inference<\/li><li>Поддерживает квантизацию (AWQ, GPTQ) для экономии VRAM<\/li><li>Совместимость с OpenAI API упрощает миграцию с внешних провайдеров<\/li><\/ul><p>Ошибка: недооценивать требования к VRAM — 8B модель в fp16 требует ~16 ГБ только под веса, плюс KV-кэш растёт с длиной контекста и числом параллельных запросов.<\/p>", "links": [{"title": "vLLM Documentation", "url": "https://docs.vllm.ai/"}, {"title": "vLLM GitHub", "url": "https://github.com/vllm-project/vllm"}, {"title": "PagedAttention paper (arXiv)", "url": "https://arxiv.org/abs/2309.06180"}]}, {"title": "Батч vs онлайн инференс", "level": "🟢 Junior", "explanation": "<p>Выбор архитектуры инференса зависит от требований к latency и объёму данных.<\/p><table><tr><th>Тип<\/th><th>Когда использовать<\/th><th>Пример<\/th><\/tr><tr><td>Batch<\/td><td>Не нужен realtime, большие объёмы<\/td><td>ночной пересчёт рекомендаций<\/td><\/tr><tr><td>Online (realtime)<\/td><td>Нужен ответ за миллисекунды<\/td><td>детект мошенничества при оплате<\/td><\/tr><tr><td>Streaming<\/td><td>Непрерывный поток событий<\/td><td>обработка логов через Kafka<\/td><\/tr><\/table><pre><code># Batch inference через Spark/Pandas\nimport pandas as pd\ndf = pd.read_parquet(\"users.parquet\")\ndf[\"score\"] = model.predict(df[features])\ndf.to_parquet(\"scored_users.parquet\")<\/code><\/pre><p>Типичная ошибка — проектировать сервис под realtime, когда на самом деле бизнесу достаточно батча раз в час. Батч дешевле, проще масштабировать и отлаживать, не требует SLA по latency.<\/p><p>Совет: спрашивайте у продукта реальные требования к задержке ответа, прежде чем строить сложный realtime-сервис.<\/p>", "links": [{"title": "Apache Spark Documentation", "url": "https://spark.apache.org/docs/latest/"}, {"title": "Apache Kafka Documentation", "url": "https://kafka.apache.org/documentation/"}, {"title": "pandas Documentation", "url": "https://pandas.pydata.org/docs/"}]}, {"title": "Оптимизация инференса: ONNX", "level": "🟡 Middle", "explanation": "<p><b>ONNX (Open Neural Network Exchange)<\/b> — универсальный формат моделей, позволяющий переносить модель между фреймворками и запускать через оптимизированный рантайм <code>onnxruntime<\/code>, который быстрее нативного PyTorch на CPU.<\/p><pre><code>import torch\ntorch.onnx.export(\n    model, dummy_input, \"model.onnx\",\n    input_names=[\"input\"], output_names=[\"output\"],\n    dynamic_axes={\"input\": {0: \"batch\"}}\n)\n\nimport onnxruntime as ort\nsession = ort.InferenceSession(\"model.onnx\")\noutputs = session.run(None, {\"input\": x.numpy()})<\/code><\/pre><ul><li>Graph-оптимизации (fusion операций) дают ускорение 1.5-3x без потери точности<\/li><li>Единый формат для деплоя из PyTorch/TF/sklearn в единый рантайм<\/li><li>Поддержка execution providers: CPU, CUDA, TensorRT, OpenVINO<\/li><\/ul><p>Частая проблема — динамические формы входа (variable batch/sequence length) требуют явного указания <code>dynamic_axes<\/code>, иначе экспорт «зашьёт» конкретный размер и модель сломается на других входах.<\/p>", "links": [{"title": "ONNX Documentation", "url": "https://onnx.ai/onnx/index.html"}, {"title": "PyTorch ONNX Export", "url": "https://pytorch.org/docs/stable/onnx.html"}, {"title": "ONNX Runtime", "url": "https://onnxruntime.ai/docs/"}]}, {"title": "Квантизация моделей", "level": "🔴 Senior", "explanation": "<p>Квантизация уменьшает разрядность весов (fp32 → int8/int4), сокращая память и ускоряя инференс, ценой небольшой потери точности.<\/p><pre><code># Динамическая квантизация PyTorch\nimport torch\nquantized_model = torch.quantization.quantize_dynamic(\n    model, {torch.nn.Linear}, dtype=torch.qint8\n)\n\n# Для LLM: bitsandbytes 4-bit\nfrom transformers import AutoModelForCausalLM, BitsAndBytesConfig\nbnb_config = BitsAndBytesConfig(load_in_4bit=True, bnb_4bit_compute_dtype=torch.float16)\nmodel = AutoModelForCausalLM.from_pretrained(\"llama-3-8b\", quantization_config=bnb_config)<\/code><\/pre><table><tr><th>Метод<\/th><th>Особенность<\/th><\/tr><tr><td>Dynamic quant<\/td><td>просто, для CPU inference<\/td><\/tr><tr><td>Static quant (PTQ)<\/td><td>нужен калибровочный датасет<\/td><\/tr><tr><td>QAT<\/td><td>обучение с учётом квантизации, лучшая точность<\/td><\/tr><tr><td>GPTQ/AWQ<\/td><td>SOTA для LLM, минимальная просадка<\/td><\/tr><\/table><p>Senior-совет: всегда мерьте деградацию качества на реальном валидационном наборе после квантизации — иногда int4 «на глаз» работает, но качество на edge-case запросах падает заметно.<\/p>", "links": [{"title": "PyTorch Quantization", "url": "https://pytorch.org/docs/stable/quantization.html"}, {"title": "bitsandbytes (Hugging Face)", "url": "https://huggingface.co/docs/bitsandbytes/index"}, {"title": "GPTQ paper (arXiv)", "url": "https://arxiv.org/abs/2210.17323"}, {"title": "AWQ paper (arXiv)", "url": "https://arxiv.org/abs/2306.00978"}]}, {"title": "Мониторинг моделей в проде", "level": "🟡 Middle", "explanation": "<p>В отличие от обычного ПО, ML-модель может «молча» деградировать без единой ошибки в логах — код работает, но предсказания становятся хуже. Нужен отдельный слой мониторинга.<\/p><ul><li><b>Инфраструктурные метрики<\/b>: latency, throughput, error rate, использование GPU/CPU<\/li><li><b>Метрики качества модели<\/b>: точность на размеченной выборке (если доступна), распределение предсказаний<\/li><li><b>Метрики входных данных<\/b>: дрифт признаков, пропуски, аномалии<\/li><\/ul><pre><code># Prometheus + FastAPI\nfrom prometheus_client import Histogram, Counter\n\nREQUEST_LATENCY = Histogram(\"predict_latency_seconds\", \"latency\")\nPREDICTIONS = Counter(\"predictions_total\", \"count\", [\"class\"])\n\n@app.post(\"/predict\")\n@REQUEST_LATENCY.time()\ndef predict(item: Item):\n    pred = model.predict([item.features])\n    PREDICTIONS.labels(class=str(pred[0])).inc()\n    return {\"prediction\": pred.tolist()}<\/code><\/pre><p>Стек Prometheus + Grafana + алерты в Slack/PagerDuty — стандарт индустрии. Совет: настраивайте алерт не только на ошибки сервиса, но и на резкое смещение распределения выходов модели (например, доля класса \"fraud\" внезапно выросла в 5 раз).<\/p>", "links": [{"title": "Prometheus Documentation", "url": "https://prometheus.io/docs/introduction/overview/"}, {"title": "Grafana Documentation", "url": "https://grafana.com/docs/grafana/latest/"}, {"title": "Evidently AI Docs", "url": "https://docs.evidentlyai.com/"}]}, {"title": "Data drift и concept drift", "level": "🔴 Senior", "explanation": "<p><b>Data drift<\/b> — меняется распределение входных признаков (например, средний чек вырос из-за инфляции). <b>Concept drift<\/b> — меняется сама зависимость между признаками и таргетом (то, что раньше было мошенничеством, теперь легальная схема).<\/p><pre><code>from scipy.stats import ks_2samp\n\n# Тест Колмогорова-Смирнова между train и текущим распределением\nstat, p_value = ks_2samp(train_feature, prod_feature)\nif p_value &lt; 0.05:\n    alert(\"Data drift detected!\")<\/code><\/pre><ul><li><b>PSI (Population Stability Index)<\/b> — популярная метрика для табличных данных, порог 0.2 обычно считается тревожным<\/li><li>Библиотека <code>evidently<\/code> строит готовые отчёты по дрифту признаков и таргета<\/li><li>Concept drift сложнее обнаружить без ground truth — часто нужен delayed feedback loop (реальные исходы приходят через недели)<\/li><\/ul><pre><code>from evidently.report import Report\nfrom evidently.metric_preset import DataDriftPreset\n\nreport = Report(metrics=[DataDriftPreset()])\nreport.run(reference_data=train_df, current_data=prod_df)\nreport.save_html(\"drift_report.html\")<\/code><\/pre><p>Senior-совет: заранее продумайте, как в проде собирать ground truth (пусть с задержкой) — без него дрифт-мониторинг превращается в гадание.<\/p>", "links": [{"title": "Evidently AI Documentation", "url": "https://docs.evidentlyai.com/"}, {"title": "scipy.stats.ks_2samp", "url": "https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.ks_2samp.html"}, {"title": "Concept drift (Wikipedia)", "url": "https://en.wikipedia.org/wiki/Concept_drift"}]}, {"title": "A/B тестирование моделей", "level": "🔴 Senior", "explanation": "<p>Офлайн-метрики (accuracy, F1) не гарантируют бизнес-эффект. A/B-тест сравнивает старую и новую модель на реальном трафике по бизнес-метрике (конверсия, revenue, CTR).<\/p><pre><code># Простое разделение трафика по hash(user_id)\ndef assign_bucket(user_id: str, ratio: float = 0.1) -&gt; str:\n    h = int(hashlib.md5(user_id.encode()).hexdigest(), 16)\n    return \"treatment\" if (h % 100) &lt; ratio * 100 else \"control\"<\/code><\/pre><ul><li><b>Shadow deployment<\/b> — новая модель считает предсказания параллельно, но не влияет на пользователя; сравниваем офлайн<\/li><li><b>Canary release<\/b> — новую модель выкатывают на 1-5% трафика, постепенно увеличивая долю при отсутствии проблем<\/li><li>Обязательно считайте статистическую значимость (t-test, доверительные интервалы), а не просто сравнивайте средние<\/li><\/ul><table><tr><th>Стратегия<\/th><th>Риск<\/th><\/tr><tr><td>Shadow<\/td><td>минимальный, нет влияния на юзера<\/td><\/tr><tr><td>Canary<\/td><td>низкий, контролируемый rollout<\/td><\/tr><tr><td>Full A/B<\/td><td>средний, нужен статистический расчёт мощности<\/td><\/tr><\/table><p>Частая ошибка — остановить тест раньше срока при первом хорошем результате (peeking problem), что искажает статистику.<\/p>", "links": [{"title": "A/B testing (Wikipedia)", "url": "https://en.wikipedia.org/wiki/A/B_testing"}, {"title": "Google Cloud: Application Deployment and Testing Strategies", "url": "https://cloud.google.com/architecture/application-deployment-and-testing-strategies"}, {"title": "Trustworthy Online Controlled Experiments", "url": "https://www.exp-platform.com/"}]}, {"title": "CI/CD для ML (MLOps pipelines)", "level": "🔴 Senior", "explanation": "<p>CI/CD для ML шире обычного software CI/CD — нужно тестировать не только код, но и данные, и качество модели.<\/p><ul><li><b>CI<\/b>: линтеры, юнит-тесты кода, тесты на схему данных (great_expectations), быстрый smoke-тест обучения на маленькой выборке<\/li><li><b>CT (Continuous Training)<\/b>: автоматический ретрейн по расписанию или по триггеру дрифта<\/li><li><b>CD<\/b>: автоматический деплой модели при прохождении порога качества на holdout<\/li><\/ul><pre><code># GitHub Actions: пример шага валидации модели\n- name: Validate model\n  run: |\n    python train.py --output model.pkl\n    python validate.py --model model.pkl --min-f1 0.85\n\n- name: Deploy if passed\n  if: success()\n  run: |\n    mlflow models serve -m model.pkl -p 8000 &amp;\n    curl -X POST http://localhost:8000/invocations -d @sample.json<\/code><\/pre><p>Инструменты оркестрации пайплайнов: Airflow, Kubeflow Pipelines, Prefect, Dagster — они умеют строить DAG из шагов (extract → train → validate → deploy) с ретраями и мониторингом.<\/p><p>Senior-совет: закладывайте автоматический rollback — если после деплоя ключевая бизнес-метрика падает, система должна откатиться на предыдущую модель без участия человека.<\/p>", "links": [{"title": "Kubeflow Pipelines", "url": "https://www.kubeflow.org/docs/components/pipelines/"}, {"title": "Apache Airflow Documentation", "url": "https://airflow.apache.org/docs/"}, {"title": "Great Expectations Docs", "url": "https://docs.greatexpectations.io/docs/"}, {"title": "GitHub Actions Documentation", "url": "https://docs.github.com/en/actions"}]}, {"title": "Feature Store (кратко)", "level": "🔴 Senior", "explanation": "<p><b>Feature Store<\/b> решает проблему train/serve skew — когда признаки для обучения считаются одним кодом (Python/Spark оффлайн), а признаки в проде — другим (Java/Go онлайн), и они расходятся.<\/p><ul><li><b>Offline store<\/b> — исторические признаки для обучения (обычно data warehouse: BigQuery, Snowflake)<\/li><li><b>Online store<\/b> — низколатентное хранилище (Redis, DynamoDB) для realtime-инференса<\/li><li>Единое определение фичи гарантирует консистентность между train и serve<\/li><\/ul><pre><code># Пример с Feast\nfrom feast import FeatureStore\n\nstore = FeatureStore(repo_path=\".\")\n\n# Обучение: исторические фичи\ntraining_df = store.get_historical_features(\n    entity_df=entity_df, features=[\"user_stats:avg_spend\"]\n).to_df()\n\n# Прод: realtime фичи\nfeatures = store.get_online_features(\n    features=[\"user_stats:avg_spend\"],\n    entity_rows=[{\"user_id\": 42}]\n).to_dict()<\/code><\/pre><p>Известные решения: Feast (open-source), Tecton, AWS SageMaker Feature Store. Внедрять feature store имеет смысл, когда команда растёт и несколько моделей начинают переиспользовать одни и те же признаки — для одного пет-проекта это оверинжиниринг.<\/p>", "links": [{"title": "Feast Documentation", "url": "https://docs.feast.dev/"}, {"title": "Tecton", "url": "https://www.tecton.ai/"}, {"title": "AWS SageMaker Feature Store", "url": "https://docs.aws.amazon.com/sagemaker/latest/dg/feature-store.html"}]}], "quiz": [{"q": "Что из перечисленного НЕ является частью жизненного цикла ML-модели?", "options": ["Мониторинг в проде", "Версионирование данных", "Написание CSS-стилей для лендинга", "Переобучение при дрифте"], "answer": 2, "explain": "CSS-вёрстка лендинга не относится к ML-циклу — цикл включает данные, обучение, деплой, мониторинг, ретрейн."}, {"q": "Для чего используется DVC?", "options": ["Для форматирования Python-кода", "Для версионирования больших датасетов и моделей рядом с git", "Для деплоя контейнеров в Kubernetes", "Для визуализации метрик обучения"], "answer": 1, "explain": "DVC хранит метаданные больших файлов в git, а сами данные — в удалённом сторадже (S3, MinIO и т.д.)."}, {"q": "Какой инструмент лучше всего подходит для трекинга экспериментов (параметры, метрики, артефакты)?", "options": ["Docker Compose", "MLflow", "Nginx", "ONNX Runtime"], "answer": 1, "explain": "MLflow Tracking специально создан для логирования параметров, метрик и артефактов экспериментов."}, {"q": "Почему vLLM превосходит наивный HuggingFace generate() при обслуживании LLM под нагрузкой?", "options": ["Он использует другой язык программирования", "PagedAttention и continuous batching эффективно управляют KV-кэшем и запросами", "Он не поддерживает GPU", "Он снижает точность модели для скорости"], "answer": 1, "explain": "vLLM применяет PagedAttention для эффективного KV-кэша и continuous batching, что резко увеличивает throughput."}, {"q": "Когда предпочтителен батч-инференс вместо онлайн?", "options": ["Когда нужен ответ за миллисекунды", "Когда обрабатывается детект мошенничества в момент оплаты", "Когда нет требования к realtime и объёмы данных большие", "Никогда, онлайн всегда лучше"], "answer": 2, "explain": "Батч-инференс дешевле и проще, когда бизнесу не требуется мгновенный ответ (например, ночной пересчёт рекомендаций)."}, {"q": "Что даёт экспорт модели в формат ONNX?", "options": ["Автоматическое увеличение точности модели", "Кроссплатформенный формат и ускорение инференса через onnxruntime", "Замену необходимости в GPU полностью", "Автоматическую разметку данных"], "answer": 1, "explain": "ONNX — универсальный формат для переноса между фреймворками, а onnxruntime даёт оптимизированный и часто более быстрый инференс."}, {"q": "Что такое data drift?", "options": ["Изменение зависимости между признаками и таргетом", "Изменение распределения входных признаков модели со временем", "Утечка данных из train в test", "Ошибка в коде препроцессинга"], "answer": 1, "explain": "Data drift — это смещение распределения входных данных; concept drift — изменение самой зависимости признак→таргет."}, {"q": "Какая стратегия деплоя новой модели считается наименее рискованной, так как не влияет на реальных пользователей?", "options": ["Canary release", "Полный A/B тест", "Shadow deployment", "Мгновенная полная замена (big bang)"], "answer": 2, "explain": "При shadow deployment новая модель считает предсказания параллельно со старой, но не влияет на ответ пользователю."}, {"q": "Зачем нужен Feature Store в MLOps-инфраструктуре?", "options": ["Чтобы хранить исходный код моделей", "Чтобы избежать train/serve skew, обеспечивая единое определение признаков для обучения и продакшена", "Чтобы заменить систему мониторинга", "Чтобы ускорить компиляцию Docker-образов"], "answer": 1, "explain": "Feature Store гарантирует, что признаки при обучении (offline) и в проде (online) вычисляются одинаково, устраняя train/serve skew."}, {"q": "Что из перечисленного — типичная ошибка при CI/CD для ML?", "options": ["Автоматический rollback при падении бизнес-метрики", "Тестирование схемы данных перед обучением", "Остановка A/B теста раньше срока при первом хорошем результате (peeking)", "Логирование версии данных и git-коммита вместе с метриками"], "answer": 2, "explain": "Peeking (ранняя остановка теста при удачном промежуточном результате) искажает статистическую значимость A/B теста."}], "id": 16, "pi": 4}, {"phase": "Phase 5 — MLOps & Production", "section": "🏗️ ML System Design и карьера", "topics": [{"title": "Структура ML System Design интервью", "level": "🟡 Middle", "explanation": "<p>ML System Design интервью — это не про то, чтобы вспомнить формулу F1-score, а про способность провести собеседника от расплывчатой бизнес-идеи до работающей системы. Универсальный каркас, который держат в голове интервьюеры:<\/p><ul><li><b>Clarify<\/b> — уточнить требования: кто пользователь, какая метрика бизнеса важна, latency-бюджет, объём данных, ограничения по железу/бюджету.<\/li><li><b>Metrics<\/b> — offline (precision/recall, NDCG, AUC) и online (CTR, retention, revenue).<\/li><li><b>Data<\/b> — источники, разметка, баланс классов, дрифт.<\/li><li><b>Baseline<\/b> — простая модель (эвристика, логрег) до сложной.<\/li><li><b>Architecture<\/b> — пайплайн: feature store → training → serving → monitoring.<\/li><li><b>Trade-offs<\/b> — latency vs accuracy, batch vs real-time, cost.<\/li><\/ul><p>Типичная ошибка джунов — сразу предлагать трансформер на 7B параметров для задачи, где хватило бы градиентного бустинга. Сеньоры всегда начинают с вопроса «а какая метрика определяет успех бизнеса» и явно проговаривают допущения вслух — это то, что оценивают больше всего.<\/p><pre><code># Псевдо-чеклист, который держат в голове на интервью\nsteps = [\n    \"clarify_requirements\",\n    \"define_metrics (offline + online)\",\n    \"data_pipeline\",\n    \"baseline_model\",\n    \"scale_architecture\",\n    \"monitoring_and_feedback_loop\",\n]<\/code><\/pre>", "links": [{"title": "ML System Design (Chip Huyen, Designing ML Systems)", "url": "https://huyenchip.com/machine-learning-systems-design/toc.html"}, {"title": "Exponent ML System Design Guide", "url": "https://www.tryexponent.com/blog/ml-system-design-interview"}, {"title": "Google ML Rules of ML", "url": "https://developers.google.com/machine-learning/guides/rules-of-ml"}]}, {"title": "Постановка бизнес-задачи как ML-задачи", "level": "🟢 Junior", "explanation": "<p>Главный навык уровня middle+ — переводить фразы менеджера («хотим удерживать клиентов») в формальную ML-постановку. Алгоритм:<\/p><ul><li>Определить целевую переменную (target): что именно предсказываем? Отток за 30 дней — бинарная классификация.<\/li><li>Определить unit of prediction: пользователь, сессия, транзакция.<\/li><li>Определить, что оптимизируем: recall (не пропустить отток) или precision (не спамить скидками всех подряд).<\/li><li>Проверить, решаема ли задача вообще ML — иногда достаточно правила «если 30 дней не заходил → email».<\/li><\/ul><p>Частая ошибка — сразу лезть в модель, не выяснив, как решение будет использовано. Если продакт-менеджер хочет «топ-3 причины оттока», это уже не просто классификация, а задача интерпретируемости — потребуется SHAP или простая логрег вместо чёрного ящика.<\/p><table><tr><th>Бизнес-фраза<\/th><th>ML-формулировка<\/th><\/tr><tr><td>«Хотим меньше жалоб на модерацию»<\/td><td>Бинарная классификация токсичности + порог по recall<\/td><\/tr><tr><td>«Увеличить средний чек»<\/td><td>Ranking / recommendation, метрика — revenue per session<\/td><\/tr><\/table><p>Совет: всегда фиксируйте постановку письменно (design doc) до того, как начнёте писать код — это экономит недели переделок.<\/p>", "links": [{"title": "Google Problem Framing", "url": "https://developers.google.com/machine-learning/problem-framing"}, {"title": "Made With ML — Design", "url": "https://madewithml.com/courses/mlops/design/"}, {"title": "scikit-learn: Choosing the right estimator", "url": "https://scikit-learn.org/stable/machine_learning_map.html"}]}, {"title": "Сбор и разметка данных", "level": "🟢 Junior", "explanation": "<p>Данные — самое дорогое и недооценённое звено пайплайна. Источники: логи продакшена, сторонние API, краудсорс-разметка (Toloka, MTurk), синтетика через LLM.<\/p><ul><li><b>Разметка<\/b>: всегда считайте inter-annotator agreement (Cohen's kappa) — если разметчики не согласны друг с другом, модель тоже не сможет.<\/li><li><b>Активное обучение<\/b> — размечайте сначала примеры, где модель сомневается больше всего, экономит бюджет разметки в разы.<\/li><li><b>Утечки (data leakage)<\/b> — самая частая продакшн-ошибка: в train попадают признаки, которых не будет доступно в момент инференса (например, таргет, посчитанный по будущим данным).<\/li><\/ul><pre><code>from sklearn.model_selection import train_test_split\n# Плохо: случайное разбиение временных данных -> leakage\nX_train, X_test = train_test_split(df, test_size=0.2)\n\n# Хорошо: разбиение по времени\ntrain = df[df.date < '2026-01-01']\ntest = df[df.date >= '2026-01-01']<\/code><\/pre><p>Совет из продакшена: заведите data contract — схему с типами и допустимыми диапазонами полей, и валидируйте её в CI (Great Expectations, Pandera). Иначе однажды апстрим поменяет формат даты, и модель молча начнёт деградировать.<\/p>", "links": [{"title": "Cohen's kappa — Wikipedia", "url": "https://en.wikipedia.org/wiki/Cohen%27s_kappa"}, {"title": "Great Expectations Docs", "url": "https://docs.greatexpectations.io/"}, {"title": "pandas documentation", "url": "https://pandas.pydata.org/docs/"}, {"title": "Data Leakage — scikit-learn", "url": "https://scikit-learn.org/stable/common_pitfalls.html#data-leakage"}]}, {"title": "Выбор модели и построение baseline", "level": "🟢 Junior", "explanation": "<p>Золотое правило: baseline должен быть готов за день, а не за неделю. Порядок эскалации сложности:<\/p><ul><li>Эвристика/правило (если возможно) — часто уже даёт 70% качества.<\/li><li>Линейная модель / логрег — быстрая, интерпретируемая, хороший sanity-check.<\/li><li>Градиентный бустинг (LightGBM/XGBoost/CatBoost) — рабочая лошадка для табличных данных.<\/li><li>Нейросети/трансформеры — только если есть доказанный прирост, оправдывающий сложность инфраструктуры.<\/li><\/ul><pre><code>import lightgbm as lgb\nfrom sklearn.metrics import roc_auc_score\n\nmodel = lgb.LGBMClassifier(n_estimators=200, learning_rate=0.05)\nmodel.fit(X_train, y_train)\nprint(roc_auc_score(y_test, model.predict_proba(X_test)[:, 1]))<\/code><\/pre><p>Типичная ошибка джуна — сразу пробовать самую «модную» архитектуру без baseline, из-за чего непонятно, окупает ли сложность прирост метрики. На собеседовании всегда явно проговаривайте: «сначала baseline X, потом сравниваем с Y» — это сигнал зрелости.<\/p>", "links": [{"title": "LightGBM Documentation", "url": "https://lightgbm.readthedocs.io/"}, {"title": "XGBoost Documentation", "url": "https://xgboost.readthedocs.io/"}, {"title": "scikit-learn Linear Models", "url": "https://scikit-learn.org/stable/modules/linear_model.html"}]}, {"title": "Проектирование ML-пайплайна (feature store, training, serving)", "level": "🟡 Middle", "explanation": "<p>Продакшн ML-система — это не одна модель, а конвейер компонентов:<\/p><ul><li><b>Feature store<\/b> (Feast, Tecton) — единый источник признаков для train и inference, устраняет training/serving skew.<\/li><li><b>Training pipeline<\/b> — оркестрируется Airflow/Kubeflow/Dagster, версионируется через DVC/MLflow.<\/li><li><b>Model registry<\/b> — хранит версии моделей с метаданными и метриками (MLflow Model Registry).<\/li><li><b>Serving<\/b> — batch (для рекомендаций раз в сутки) vs online (REST/gRPC с латентностью &lt;100мс).<\/li><\/ul><pre><code># Пример простого serving-контракта (FastAPI)\nfrom fastapi import FastAPI\nimport joblib\n\napp = FastAPI()\nmodel = joblib.load(\"model_v3.pkl\")\n\n@app.post(\"/predict\")\ndef predict(features: dict):\n    x = preprocess(features)\n    return {\"score\": float(model.predict_proba([x])[0][1])}<\/code><\/pre><p>Ключевая продакшн-проблема — training/serving skew: признаки считаются по-разному в оффлайне (Spark/Pandas) и в онлайне (Java/Go сервис). Решение — единый feature store или генерация признаков одним и тем же кодом в обоих режимах.<\/p>", "links": [{"title": "Feast Feature Store Docs", "url": "https://docs.feast.dev/"}, {"title": "MLflow Documentation", "url": "https://mlflow.org/docs/latest/index.html"}, {"title": "Apache Airflow Docs", "url": "https://airflow.apache.org/docs/"}, {"title": "FastAPI Documentation", "url": "https://fastapi.tiangolo.com/"}]}, {"title": "Кейс: рекомендательная система", "level": "🟡 Middle", "explanation": "<p>Классический дизайн: двухступенчатая архитектура retrieval → ranking.<\/p><ul><li><b>Candidate generation<\/b>: из миллионов айтемов быстро отбираем сотни кандидатов — collaborative filtering, ANN-поиск по эмбеддингам (FAISS, ScaNN).<\/li><li><b>Ranking<\/b>: точная модель (GBDT или нейросеть) ранжирует кандидатов по вероятности клика/покупки, используя богатые признаки (user history, context, item features).<\/li><li><b>Re-ranking<\/b>: диверсификация, бизнес-правила (не показывать одну категорию 5 раз подряд), fairness.<\/li><\/ul><pre><code># Приближённый поиск ближайших соседей\nimport faiss\nindex = faiss.IndexFlatIP(embedding_dim)\nindex.add(item_embeddings)\nscores, ids = index.search(user_embedding.reshape(1, -1), k=200)<\/code><\/pre><p>Метрики: offline — NDCG@k, Recall@k; online — CTR, conversion, watch time. Частая ловушка — оптимизация только под CTR приводит к кликбейту; нужен баланс с долгосрочным retention. На собесе стоит упомянуть cold start (новые пользователи/айтемы) и как его решают — контентные признаки, popularity fallback.<\/p>", "links": [{"title": "FAISS Documentation", "url": "https://faiss.ai/"}, {"title": "Deep Learning Recommendation Systems — Google", "url": "https://developers.google.com/machine-learning/recommendation"}, {"title": "Recommender Systems Handbook (arXiv survey)", "url": "https://arxiv.org/abs/2109.12613"}]}, {"title": "Кейс: система поиска (search)", "level": "🟡 Middle", "explanation": "<p>Поисковая система тоже строится по принципу retrieval + ranking, но с акцентом на релевантность запросу:<\/p><ul><li><b>Lexical retrieval<\/b> — BM25 (Elasticsearch/OpenSearch) для точного совпадения ключевых слов.<\/li><li><b>Semantic retrieval<\/b> — dense embeddings (bi-encoder) + ANN-индекс для смысловой близости, особенно важно при синонимах и опечатках.<\/li><li><b>Hybrid<\/b> — комбинация lexical + semantic score (RRF — Reciprocal Rank Fusion) часто побеждает каждый метод по отдельности.<\/li><li><b>Re-ranking<\/b> — cross-encoder (точнее, но дороже) на топ-100 кандидатах.<\/li><\/ul><pre><code># Reciprocal Rank Fusion, k=60\ndef rrf(rank_lists, k=60):\n    scores = {}\n    for ranks in rank_lists:\n        for pos, doc_id in enumerate(ranks):\n            scores[doc_id] = scores.get(doc_id, 0) + 1 / (k + pos + 1)\n    return sorted(scores, key=scores.get, reverse=True)<\/code><\/pre><p>Метрики: MRR, NDCG, Recall@k. Продакшн-совет: логируйте запросы без кликов (zero-click queries) — это золотая жила для улучшения релевантности и обнаружения дыр в индексе.<\/p>", "links": [{"title": "OpenSearch BM25 docs", "url": "https://opensearch.org/docs/latest/search-plugins/searching-data/bm25/"}, {"title": "Sentence-Transformers (bi-encoders)", "url": "https://www.sbert.net/"}, {"title": "Reciprocal Rank Fusion paper", "url": "https://plg.uwaterloo.ca/~gvcormac/cormacksigir09-rrf.pdf"}]}, {"title": "Кейс: антифрод-система", "level": "🔴 Senior", "explanation": "<p>Антифрод — задача с экстремальным дисбалансом классов (0.1% мошенничества) и требованием низкой латентности (десятки миллисекунд на транзакцию).<\/p><ul><li><b>Дисбаланс<\/b>: не downsampling вслепую — лучше калиброванные модели (isotonic regression) + правильный выбор метрики (PR-AUC, а не ROC-AUC, которая обманчиво хороша при дисбалансе).<\/li><li><b>Real-time признаки<\/b>: скользящие агрегаты (кол-во транзакций за последние 5 минут) считаются через Kafka + Flink/Redis, а не через batch-джобы.<\/li><li><b>Adversarial adaptation<\/b>: мошенники подстраиваются под модель — нужен постоянный переобучение и мониторинг drift, а не «обучили один раз и забыли».<\/li><li><b>Многоуровневая защита<\/b>: rule-engine (жёсткие правила) + ML-скор + graph-анализ связей аккаунтов.<\/li><\/ul><pre><code># PR-AUC вместо ROC-AUC при сильном дисбалансе\nfrom sklearn.metrics import average_precision_score\npr_auc = average_precision_score(y_true, y_scores)<\/code><\/pre><p>Ключевой trade-off: false positive (заблокировали честного клиента) стоит бизнесу репутации, false negative — прямых денег. Порог решения обычно настраивают под cost-matrix, а не под 0.5 по умолчанию.<\/p>", "links": [{"title": "Precision-Recall vs ROC — scikit-learn", "url": "https://scikit-learn.org/stable/auto_examples/model_selection/plot_precision_recall.html"}, {"title": "Apache Flink Documentation", "url": "https://nightlies.apache.org/flink/flink-docs-stable/"}, {"title": "Imbalanced-learn Documentation", "url": "https://imbalanced-learn.org/stable/"}]}, {"title": "Кейс: чат-бот с RAG", "level": "🔴 Senior", "explanation": "<p>RAG (Retrieval-Augmented Generation) — стандартная архитектура для чат-ботов над корпоративными знаниями, снижающая галлюцинации LLM.<\/p><ul><li><b>Индексация<\/b>: документы режутся на чанки (обычно 200–500 токенов с overlap), кодируются в эмбеддинги (bge, OpenAI ada), складываются в векторную БД (Qdrant, Pinecone, pgvector).<\/li><li><b>Retrieval<\/b>: hybrid search (BM25 + dense), top-k чанков подаются в промпт.<\/li><li><b>Generation<\/b>: LLM генерирует ответ, опираясь только на найденный контекст; важно явно инструктировать «отвечай только на основе контекста, если ответа нет — скажи что не знаешь».<\/li><li><b>Evaluation<\/b>: RAGAS-метрики — faithfulness (не выдумал ли модель факты), answer relevance, context precision/recall.<\/li><\/ul><pre><code>chunks = retriever.search(query, k=5)\nprompt = f\"\"\"Ответь на вопрос, используя только контекст ниже.\nКонтекст: {chunks}\nВопрос: {query}\"\"\"\nanswer = llm.generate(prompt)<\/code><\/pre><p>Продакшн-грабли: слишком большой chunk_size размывает релевантность, слишком маленький — теряет контекст. Всегда добавляйте цитирование источников в ответе — это резко повышает доверие пользователей и упрощает дебаг галлюцинаций.<\/p>", "links": [{"title": "Anthropic Docs — Embeddings", "url": "https://docs.anthropic.com/en/docs/build-with-claude/embeddings"}, {"title": "Hugging Face — RAG", "url": "https://huggingface.co/docs/transformers/model_doc/rag"}, {"title": "RAGAS Documentation", "url": "https://docs.ragas.io/"}, {"title": "Qdrant Documentation", "url": "https://qdrant.tech/documentation/"}]}, {"title": "Масштабирование и latency-оптимизация", "level": "🔴 Senior", "explanation": "<p>Когда система выходит за пределы одного сервера, встают вопросы throughput и latency budget.<\/p><ul><li><b>Батчинг запросов<\/b> на GPU (dynamic batching в Triton Inference Server) резко повышает throughput ценой небольшой задержки.<\/li><li><b>Кэширование<\/b> частых запросов (Redis) — особенно для рекомендаций/поиска с повторяющимися паттернами.<\/li><li><b>Квантизация и дистилляция<\/b> моделей (INT8, ONNX Runtime, distilled студент-модели) снижают latency в 2–5 раз почти без потери качества.<\/li><li><b>Горизонтальное масштабирование<\/b>: stateless сервисы за балансировщиком, автоскейлинг по очереди/CPU.<\/li><\/ul><pre><code># Квантизация модели через ONNX Runtime\nfrom onnxruntime.quantization import quantize_dynamic, QuantType\nquantize_dynamic(\"model.onnx\", \"model_int8.onnx\", weight_type=QuantType.QInt8)<\/code><\/pre><p>Правило продакшена: измеряйте p99 latency, а не среднюю — именно хвост распределения убивает пользовательский опыт. Частая ошибка — оптимизировать модель, забыв, что 80% latency уходит на сериализацию/сеть, а не на инференс.<\/p>", "links": [{"title": "NVIDIA Triton Inference Server Docs", "url": "https://docs.nvidia.com/deeplearning/triton-inference-server/user-guide/docs/index.html"}, {"title": "ONNX Runtime Documentation", "url": "https://onnxruntime.ai/docs/"}, {"title": "Redis Documentation", "url": "https://redis.io/docs/latest/"}]}, {"title": "Cost-оптимизация ML-систем", "level": "🟡 Middle", "explanation": "<p>ML-инфраструктура может стоить дороже, чем весь остальной бэкенд, если не следить за расходами.<\/p><ul><li><b>Spot-инстансы<\/b> для обучения (не для serving) — экономия до 70%.<\/li><li><b>Right-sizing<\/b>: не держите GPU A100 под задачу, которая работает на CPU в 3 раза дешевле.<\/li><li><b>Autoscaling to zero<\/b> для редко используемых сервисов (serverless inference — SageMaker Serverless, Cloud Run).<\/li><li><b>Оптимизация токенов<\/b> при работе с LLM API: кэширование промптов, укорачивание системных промптов, батчинг запросов.<\/li><\/ul><table><tr><th>Решение<\/th><th>Экономия<\/th><\/tr><tr><td>Квантизация модели<\/td><td>2-4x меньше памяти/latency<\/td><\/tr><tr><td>Кэш ответов LLM<\/td><td>до 90% на повторяющихся запросах<\/td><\/tr><tr><td>Spot-инстансы для train<\/td><td>60-70% стоимости compute<\/td><\/tr><\/table><p>Совет: заведите дашборд cost-per-prediction — это метрика, которую любят финансовые директора, и она заставляет инженеров думать о деньгах, а не только о метриках качества.<\/p>", "links": [{"title": "AWS SageMaker Serverless Inference", "url": "https://docs.aws.amazon.com/sagemaker/latest/dg/serverless-endpoints.html"}, {"title": "Google Cloud Run Docs", "url": "https://cloud.google.com/run/docs"}, {"title": "Anthropic — Prompt Caching", "url": "https://docs.anthropic.com/en/docs/build-with-claude/prompt-caching"}]}, {"title": "Этика, приватность и safety в ML", "level": "🟡 Middle", "explanation": "<p>Продакшн ML-система обязана учитывать не только качество, но и последствия ошибок для людей.<\/p><ul><li><b>Приватность<\/b>: PII должен быть анонимизирован/псевдонимизирован до попадания в фичи; помните про GDPR/152-ФЗ — право на удаление данных должно распространяться и на обученные модели.<\/li><li><b>Fairness<\/b>: проверяйте метрики по подгруппам (пол, возраст, регион) — модель может быть точной в среднем, но дискриминировать меньшинство.<\/li><li><b>Explainability<\/b>: для чувствительных решений (кредитный скоринг, модерация) регуляторы часто требуют объяснимость — SHAP/LIME или изначально интерпретируемые модели.<\/li><li><b>Safety для LLM<\/b>: guardrails против prompt injection, фильтрация токсичного контента, red-teaming перед релизом.<\/li><\/ul><pre><code>import shap\nexplainer = shap.TreeExplainer(model)\nshap_values = explainer.shap_values(X_sample)\nshap.summary_plot(shap_values, X_sample)<\/code><\/pre><p>Реальный кейс: модель скоринга кредитов, обученная на исторических данных, унаследовала дискриминацию прошлого — proxy-признаки (район проживания) коррелировали с расой. Всегда аудитируйте признаки на скрытые прокси перед деплоем.<\/p>", "links": [{"title": "SHAP Documentation", "url": "https://shap.readthedocs.io/"}, {"title": "GDPR overview", "url": "https://gdpr-info.eu/"}, {"title": "Google Responsible AI Practices", "url": "https://ai.google/responsibility/responsible-ai-practices/"}]}, {"title": "Портфолио и pet-проекты для ML-инженера", "level": "🟢 Junior", "explanation": "<p>Работодателей интересует не набор Kaggle-медалей, а способность довести проект до продакшн-качества.<\/p><ul><li>Выберите 1-2 проекта, которые закрывают полный цикл: сбор данных → обучение → деплой (API/Docker) → мониторинг, а не просто ноутбук с метрикой.<\/li><li>Хороший pet-проект: RAG-бот над своими документами, детектор аномалий на реальных логах, рекомендательная система на open-датасете (MovieLens) с A/B-симуляцией.<\/li><li>Выложите на GitHub с внятным README: постановка задачи, архитектура, метрики, ограничения — это то, что реально читают.<\/li><li>Пишите технические посты (Habr, Medium) о нетривиальных решениях — это работает как публичное портфолио сильнее, чем список репозиториев.<\/li><\/ul><pre><code># Структура репозитория, которая нравится рекрутерам\nproject/\n├── data/           # or DVC pointer\n├── src/\n│   ├── train.py\n│   ├── serve.py\n├── tests/\n├── Dockerfile\n├── README.md       # постановка задачи + результаты + graphs\n<\/code><\/pre><p>Ошибка большинства кандидатов — 10 недоделанных ноутбуков вместо одного завершённого end-to-end проекта. Качество и глубина одного проекта побеждают количество.<\/p>", "links": [{"title": "Made With ML — MLOps Course", "url": "https://madewithml.com/"}, {"title": "MLOps Community Resources", "url": "https://mlops.community/"}, {"title": "GitHub Docs — About READMEs", "url": "https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-readmes"}]}, {"title": "Собеседования ML-инженера: типы и подготовка", "level": "🟡 Middle", "explanation": "<p>Собеседование на ML-инженера обычно состоит из 4-5 блоков:<\/p><ul><li><b>Coding<\/b> — алгоритмы + иногда ML-specific код (реализовать k-means с нуля).<\/li><li><b>ML fundamentals<\/b> — bias/variance, регуляризация, метрики, как работает backprop, разница между bagging и boosting.<\/li><li><b>ML System Design<\/b> — спроектировать систему end-to-end (см. отдельную тему).<\/li><li><b>Behavioral<\/b> — рассказ о прошлых проектах по STAR-методу (Situation-Task-Action-Result).<\/li><li><b>Take-home/case<\/b> — иногда дают датасет и просят построить решение за несколько дней.<\/li><\/ul><pre><code># Пример вопроса на fundamentals: реализовать метрику вручную\ndef precision_recall(y_true, y_pred):\n    tp = sum((yt == 1 and yp == 1) for yt, yp in zip(y_true, y_pred))\n    fp = sum((yt == 0 and yp == 1) for yt, yp in zip(y_true, y_pred))\n    fn = sum((yt == 1 and yp == 0) for yt, yp in zip(y_true, y_pred))\n    precision = tp / (tp + fp) if (tp + fp) else 0\n    recall = tp / (tp + fn) if (tp + fn) else 0\n    return precision, recall<\/code><\/pre><p>Совет: готовьте 3-4 истории по STAR заранее — про провал, про конфликт в команде, про сложное техническое решение. Импровизация на behavioral-части — частая причина отказов даже у сильных технически кандидатов.<\/p>", "links": [{"title": "fast.ai курс", "url": "https://course.fast.ai/"}, {"title": "DeepLearning.AI курсы", "url": "https://www.deeplearning.ai/"}, {"title": "Chip Huyen — ML Interviews Book", "url": "https://huyenchip.com/ml-interviews-book/"}]}, {"title": "Роадмап роста Junior → Middle → Senior ML-инженера", "level": "🔴 Senior", "explanation": "<p>Карьерный рост в ML измеряется не годами, а масштабом решаемых проблем и уровнем неопределённости, с которым вы работаете самостоятельно.<\/p><table><tr><th>Уровень<\/th><th>Фокус<\/th><\/tr><tr><td>Junior<\/td><td>Реализация по чёткому ТЗ: обучить модель по заданным метрикам, написать тесты, следовать код-ревью<\/td><\/tr><tr><td>Middle<\/td><td>Самостоятельная постановка задачи, выбор архитектуры, ответственность за весь пайплайн одного сервиса<\/td><\/tr><tr><td>Senior<\/td><td>Проектирование систем на несколько сервисов, менторство, trade-off решения с бизнес-последствиями, влияние на roadmap команды<\/td><\/tr><\/table><ul><li>Junior → Middle: научитесь доводить проект до продакшена целиком, а не только «модель обучилась в ноутбуке».<\/li><li>Middle → Senior: развивайте system thinking — умение оценить стоимость/риски решения до его реализации, а не после.<\/li><li>На всех уровнях: непрерывно читайте статьи (arXiv, папиры конференций NeurIPS/ICML) и внедряйте 1-2 идеи в квартал — стагнация в ML особенно заметна из-за скорости индустрии.<\/li><\/ul><p>Практический совет: попросите тимлида явно сформулировать, что отделяет вас от следующего грейда — конкретные, измеримые критерии работают лучше расплывчатого «нужно больше опыта».<\/p>", "links": [{"title": "Chip Huyen — ML Interviews Book", "url": "https://huyenchip.com/ml-interviews-book/"}, {"title": "Google's Rules of ML", "url": "https://developers.google.com/machine-learning/guides/rules-of-ml"}, {"title": "arXiv.org — свежие статьи по ML", "url": "https://arxiv.org/list/cs.LG/recent"}]}], "quiz": [{"q": "С чего стоит начинать ML System Design интервью?", "options": ["Сразу с выбора архитектуры нейросети", "С уточнения требований, метрик и ограничений (clarify)", "С написания кода обучения модели", "С обсуждения зарплаты"], "answer": 1, "explain": "Без уточнения требований (пользователь, метрика, latency, объём данных) любое архитектурное решение будет угадыванием."}, {"q": "Что такое data leakage в контексте обучения модели?", "options": ["Утечка данных пользователей в интернет", "Попадание в обучающую выборку информации, недоступной в момент реального инференса", "Потеря данных при передаче по сети", "Слишком маленький размер датасета"], "answer": 1, "explain": "Классический пример — таргет или future-признаки просачиваются в трейн, из-за чего offline-метрики завышены, а в продакшене модель проседает."}, {"q": "Зачем нужен baseline перед сложной моделью?", "options": ["Чтобы потратить больше времени на проект", "Чтобы иметь точку сравнения и понять, оправдана ли сложность", "Baseline не нужен, если есть трансформер", "Чтобы удовлетворить требования заказчика по срокам"], "answer": 1, "explain": "Baseline даёт быструю точку отсчёта и sanity-check: если сложная модель не бьёт baseline существенно, её усложнение не оправдано."}, {"q": "Что решает feature store в ML-пайплайне?", "options": ["Ускоряет обучение GPU в 10 раз", "Устраняет training/serving skew, обеспечивая единый источник признаков", "Заменяет модель регрессии", "Хранит только текстовые данные"], "answer": 1, "explain": "Feature store гарантирует, что признаки считаются одинаково и в оффлайн-обучении, и в онлайн-инференсе."}, {"q": "Почему для антифрод-задач ROC-AUC может вводить в заблуждение?", "options": ["ROC-AUC вообще нельзя считать для классификации", "При сильном дисбалансе классов ROC-AUC остаётся высоким даже при плохом ка
