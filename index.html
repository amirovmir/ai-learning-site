<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI / ML Engineer — Учебник</title>
<style>
:root{
  --paper:#f7f5f0; --ink:#23241f; --muted:#6b6a62; --line:#dedbd2;
  --card:#ffffff; --code-bg:#2b2d2a; --code-ink:#e8e6da;
  --p0:#2e7d46; --p1:#1f5fa8; --p2:#c07716; --p3:#b23a3a; --p4:#6d4fa3;
}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,'Times New Roman',serif;background:var(--paper);color:var(--ink);line-height:1.65}
code,pre,.mono{font-family:Consolas,'JetBrains Mono',Menlo,monospace}
a{color:inherit}
#layout{display:flex;min-height:100vh}
/* Sidebar */
#nav{width:300px;flex-shrink:0;border-right:1px solid var(--line);background:#f0ede5;padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
#nav h1{font-size:17px;margin:0 20px 4px;letter-spacing:.02em}
#nav .sub{font-size:12px;color:var(--muted);margin:0 20px 18px;font-family:Consolas,monospace}
.phase-group{margin-bottom:6px}
.phase-label{display:flex;align-items:center;gap:8px;padding:8px 20px 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:Consolas,monospace}
.phase-label .spine{width:14px;height:4px;border-radius:2px}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:none;font:inherit;font-size:14.5px;padding:7px 20px 7px 34px;cursor:pointer;color:var(--ink);border-left:4px solid transparent}
.nav-item:hover{background:#e8e4d8}
.nav-item.active{background:#fff;border-left-color:var(--pc);font-weight:bold}
.nav-item .done-mark{margin-left:auto;font-size:11px;color:var(--muted);font-family:Consolas,monospace}
/* Main */
#main{flex:1;min-width:0;padding:40px 56px 120px;max-width:960px}
.eyebrow{font-family:Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--pc)}
h2.section-title{font-size:34px;margin:6px 0 4px;line-height:1.2}
.section-meta{color:var(--muted);font-size:14px;margin-bottom:28px}
/* Topic accordion */
.topic{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:4px;margin-bottom:10px;overflow:hidden}
.topic-head{display:flex;align-items:center;gap:12px;padding:13px 18px;cursor:pointer;user-select:none}
.topic-head:hover{background:#fbfaf6}
.topic-num{font-family:Consolas,monospace;font-size:12px;color:var(--muted);min-width:26px}
.topic-title{flex:1;font-size:16.5px}
.topic-level{font-size:11px;font-family:Consolas,monospace;color:var(--muted);white-space:nowrap}
.topic-check{width:18px;height:18px;flex-shrink:0;accent-color:var(--pc)}
.topic-body{display:none;padding:4px 22px 20px 56px;border-top:1px dashed var(--line);font-size:15.5px}
.topic.open .topic-body{display:block}
.topic-body p{margin:.7em 0}
.topic-body code{background:#eceade;padding:1px 5px;border-radius:3px;font-size:.88em}
.topic-body pre{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:6px;overflow-x:auto;font-size:13px;line-height:1.5}
.topic-body pre code{background:none;padding:0;color:inherit}
.topic-body table{border-collapse:collapse;margin:.8em 0;font-size:14px}
.topic-body td,.topic-body th{border:1px solid var(--line);padding:5px 10px;text-align:left}
.topic-body th{background:#f0ede5}
.deep-links{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
.deep-links .dl-title{font-family:Consolas,monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.deep-links ul{margin:0;padding-left:20px;font-size:14px}
.deep-links a{color:#1f5fa8;text-decoration:none}
.deep-links a:hover{text-decoration:underline}
/* Quiz */
#quiz-block{margin-top:48px;border-top:3px double var(--line);padding-top:28px}
#quiz-block h3{font-size:24px;margin:0 0 4px}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px 22px;margin:14px 0}
.q-text{font-weight:bold;margin-bottom:12px}
.q-num{font-family:Consolas,monospace;color:var(--muted);font-weight:normal;margin-right:8px}
.opt{display:block;padding:8px 12px;margin:6px 0;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:15px}
.opt:hover{background:#fbfaf6}
.opt input{margin-right:10px;accent-color:var(--pc)}
.opt.correct{border-color:#2e7d46;background:#eef6ef}
.opt.wrong{border-color:#b23a3a;background:#faeeee}
.q-explain{display:none;margin-top:10px;font-size:14px;color:var(--muted);border-left:3px solid var(--pc);padding-left:12px}
.q-card.answered .q-explain{display:block}
#quiz-actions{margin-top:24px;display:flex;gap:14px;align-items:center}
button.primary{font:inherit;font-size:15px;background:var(--ink);color:#fff;border:none;padding:11px 26px;border-radius:4px;cursor:pointer}
button.primary:hover{opacity:.88}
button.ghost{font:inherit;font-size:14px;background:none;border:1px solid var(--line);padding:10px 20px;border-radius:4px;cursor:pointer;color:var(--muted)}
#quiz-result{font-size:17px;font-weight:bold}
/* Dashboard */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:28px}
.book{background:var(--card);border:1px solid var(--line);border-left:10px solid var(--pc);border-radius:4px;padding:16px 18px;cursor:pointer}
.book:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.book .bp{font-family:Consolas,monospace;font-size:11px;color:var(--pc);letter-spacing:.12em;text-transform:uppercase}
.book h4{margin:6px 0 8px;font-size:17px}
.bar{height:6px;background:#eceade;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pc)}
.book .stats{font-size:12px;color:var(--muted);font-family:Consolas,monospace;margin-top:7px}
.hero-eyebrow{font-family:Consolas,monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h2.hero{font-size:40px;margin:8px 0 10px;line-height:1.15}
.hero-sub{color:var(--muted);font-size:16px;max-width:620px}
#menu-btn{display:none}
@media(max-width:860px){
  #nav{position:fixed;z-index:20;transform:translateX(-100%);transition:transform .2s}
  #nav.open{transform:none}
  #menu-btn{display:block;position:fixed;top:12px;left:12px;z-index:30;font:inherit;background:var(--ink);color:#fff;border:none;border-radius:4px;padding:8px 14px}
  #main{padding:64px 20px 100px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<button id="menu-btn" onclick="document.getElementById('nav').classList.toggle('open')">☰ Разделы</button>
<div id="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
const DATA = [{"phase": "Phase 1 — Python + Math + Data", "section": "🐍 Python для ML", "topics": [{"title": "Синтаксис и идиомы Python для ML", "level": "🟢 Junior", "explanation": "<p>ML-код читают чаще, чем пишут — поэтому идиоматичность важна не меньше, чем корректность. Используйте list/dict comprehensions вместо ручных циклов, где это не убивает читаемость.<\/p><ul><li>Распаковка: <code>a, *rest = [1,2,3,4]<\/code><\/li><li>f-строки для логов: <code>f\"loss={loss:.4f}\"<\/code><\/li><li>Контекстные менеджеры для ресурсов: файлы, GPU-контексты, таймеры<\/li><\/ul><pre><code># Плохо\nresult = []\nfor x in data:\n    if x > 0:\n        result.append(x**2)\n\n# Хорошо\nresult = [x**2 for x in data if x > 0]<\/code><\/pre><p>Типичная ошибка новичков — злоупотребление вложенными comprehensions ради 'питоничности'. Если выражение не читается за 2 секунды — разбейте на цикл или вынесите в функцию.<\/p><table><tr><th>Идиома<\/th><th>Когда использовать<\/th><\/tr><tr><td>comprehension<\/td><td>простая трансформация/фильтр<\/td><\/tr><tr><td>generator expr<\/td><td>большие данные, ленивая обработка<\/td><\/tr><tr><td>явный цикл<\/td><td>сложная логика, побочные эффекты<\/td><\/tr><\/table><p>Совет из продакшена: включайте <code>ruff<\/code> или <code>flake8<\/code> в pre-commit — это экономит часы на код-ревью.<\/p>", "links": [{"title": "Python docs — официальная документация", "url": "https://docs.python.org/3/"}, {"title": "PEP 8 — Style Guide for Python Code", "url": "https://peps.python.org/pep-0008/"}, {"title": "Ruff — линтер", "url": "https://docs.astral.sh/ruff/"}]}, {"title": "Типизация (type hints, mypy)", "level": "🟢 Junior", "explanation": "<p>В ML-пайплайнах данные текут через десятки функций (загрузка → препроцессинг → модель → постобработка). Аннотации типов резко снижают число багов вида 'ожидал numpy array, получил list'.<\/p><pre><code>from typing import Optional\nimport numpy as np\n\ndef normalize(x: np.ndarray, eps: float = 1e-8) -> np.ndarray:\n    return (x - x.mean()) / (x.std() + eps)\n\ndef load_batch(path: str) -> tuple[np.ndarray, np.ndarray]:\n    ...<\/code><\/pre><p>Для сложных структур используйте <code>TypedDict<\/code>, <code>Protocol<\/code> или <code>pydantic.BaseModel<\/code> — особенно для конфигов экспериментов.<\/p><ul><li><code>Optional[int]<\/code> вместо магических <code>-1<\/code> как 'нет значения'<\/li><li><code>Literal[\"train\", \"val\", \"test\"]<\/code> вместо голых строк<\/li><li>Запускайте <code>mypy --strict<\/code> в CI хотя бы на core-модулях<\/li><\/ul><p>Частая ошибка: аннотировать входы, но забыть про возвращаемое значение генераторов (<code>Iterator[torch.Tensor]<\/code>) — из-за этого IDE не подсказывает автодополнение дальше по цепочке.<\/p>", "links": [{"title": "typing — документация Python", "url": "https://docs.python.org/3/library/typing.html"}, {"title": "mypy — документация", "url": "https://mypy.readthedocs.io/"}, {"title": "Pydantic — документация", "url": "https://docs.pydantic.dev/"}]}, {"title": "Управление окружением: venv, poetry, uv", "level": "🟢 Junior", "explanation": "<p>Несовпадение версий библиотек — источник боли номер один в ML-командах ('у меня работает'). Изоляция окружений обязательна.<\/p><pre><code># venv (встроенный, минимальный)\npython -m venv .venv\nsource .venv/bin/activate\npip install -r requirements.txt\n\n# poetry (управление зависимостями + lock-файл)\npoetry init\npoetry add torch numpy pandas\npoetry lock\n\n# uv (быстрая замена pip/venv, 2024+)\nuv venv\nuv pip install -r requirements.txt<\/code><\/pre><p><code>uv<\/code> сейчас стремительно вытесняет pip в новых проектах благодаря скорости (написан на Rust) — стоит привыкать к нему уже сейчас.<\/p><table><tr><th>Инструмент<\/th><th>Плюс<\/th><th><th>Минус<\/th><\/tr><tr><td>venv+pip<\/td><td>встроен<\/td><td>нет lock-файла из коробки<\/td><\/tr><tr><td>poetry<\/td><td>lock, dev-группы<\/td><td>медленнее<\/td><\/tr><tr><td>uv<\/td><td>очень быстрый<\/td><td>относительно новый<\/td><\/tr><\/table><p>Совет: всегда фиксируйте версии CUDA-зависимых пакетов (torch, torchvision) вместе с версией CUDA-тулкита — иначе получите runtime-краш на GPU-сервере, которого не было локально на CPU.<\/p>", "links": [{"title": "venv — документация Python", "url": "https://docs.python.org/3/library/venv.html"}, {"title": "Poetry — документация", "url": "https://python-poetry.org/docs/"}, {"title": "uv — документация Astral", "url": "https://docs.astral.sh/uv/"}]}, {"title": "ООП и dataclasses в ML-коде", "level": "🟡 Middle", "explanation": "<p>ООП в ML используется умеренно: модели, датасеты, конфиги хорошо ложатся в классы, но не стоит городить иерархии ради иерархий.<\/p><pre><code>from dataclasses import dataclass, field\n\n@dataclass\nclass TrainConfig:\n    lr: float = 3e-4\n    batch_size: int = 32\n    epochs: int = 10\n    tags: list[str] = field(default_factory=list)\n\ncfg = TrainConfig(lr=1e-3)\nprint(cfg)  # авто __repr__<\/code><\/pre><p><code>dataclass<\/code> экономит десятки строк boilerplate (<code>__init__<\/code>, <code>__repr__<\/code>, <code>__eq__<\/code>) и отлично подходит для конфигов экспериментов, которые потом сериализуются в YAML/JSON.<\/p><ul><li>Используйте <code>frozen=True<\/code> для неизменяемых конфигов — защита от случайной мутации в середине обучения<\/li><li>Наследование от <code>torch.nn.Module<\/code> — классический паттерн для моделей<\/li><li>Не путайте dataclass с pydantic: pydantic нужен, когда требуется валидация входных данных (например, из API или CLI)<\/li><\/ul><p>Частая ошибка: изменяемые значения по умолчанию (<code>list = []<\/code>) — используйте <code>field(default_factory=list)<\/code>, иначе все экземпляры будут делить один и тот же список.<\/p>", "links": [{"title": "dataclasses — документация Python", "url": "https://docs.python.org/3/library/dataclasses.html"}, {"title": "PyTorch nn.Module", "url": "https://pytorch.org/docs/stable/generated/torch.nn.Module.html"}, {"title": "Pydantic models", "url": "https://docs.pydantic.dev/latest/concepts/models/"}]}, {"title": "Генераторы и итераторы", "level": "🟡 Middle", "explanation": "<p>Датасеты в ML часто не помещаются в память целиком — генераторы позволяют обрабатывать данные лениво, без загрузки всего файла.<\/p><pre><code>def read_large_jsonl(path: str):\n    with open(path, encoding='utf-8') as f:\n        for line in f:\n            yield json.loads(line)\n\n# Бесконечный генератор батчей\nimport itertools\n\ndef infinite_batches(data, batch_size):\n    it = iter(data)\n    while True:\n        batch = list(itertools.islice(it, batch_size))\n        if not batch:\n            it = iter(data)\n            continue\n        yield batch<\/code><\/pre><p>PyTorch <code>Dataset<\/code>/<code>IterableDataset<\/code> и TensorFlow <code>tf.data<\/code> построены поверх этой же идеи — понимание итераторов помогает писать эффективные кастомные загрузчики данных.<\/p><ul><li><code>yield<\/code> vs <code>return<\/code>: генератор возобновляется с того же места, экономя память<\/li><li>Генераторные выражения <code>(x**2 for x in range(1000000))<\/code> вместо списков для больших последовательностей<\/li><li>Осторожно: генератор можно пройти только один раз — если нужно несколько эпох, пересоздавайте его или используйте <code>itertools.tee<\/code><\/li><\/ul><p>Продакшен-совет: при мультипроцессной загрузке данных (<code>num_workers > 0<\/code>) убедитесь, что генератор не держит несериализуемые объекты (сокеты, open-файлы) — это частая причина зависаний DataLoader.<\/p>", "links": [{"title": "Python Generators — документация", "url": "https://docs.python.org/3/howto/functional.html"}, {"title": "itertools — документация", "url": "https://docs.python.org/3/library/itertools.html"}, {"title": "PyTorch Dataset & DataLoader", "url": "https://pytorch.org/tutorials/beginner/basics/data_tutorial.html"}]}, {"title": "Декораторы", "level": "🟡 Middle", "explanation": "<p>Декораторы — must-have для кросс-cutting задач: логирование времени эпохи, кэширование препроцессинга, retry для нестабильных API (например, вызовы LLM).<\/p><pre><code>import functools\nimport time\n\ndef timeit(func):\n    @functools.wraps(func)\n    def wrapper(*args, **kwargs):\n        start = time.perf_counter()\n        result = func(*args, **kwargs)\n        print(f\"{func.__name__}: {time.perf_counter()-start:.3f}s\")\n        return result\n    return wrapper\n\n@timeit\ndef train_epoch(model, loader):\n    ...\n\n@functools.lru_cache(maxsize=128)\ndef expensive_feature_extraction(text: str) -> tuple:\n    ...<\/code><\/pre><p><code>functools.wraps<\/code> обязателен — без него теряются <code>__name__<\/code> и docstring обёрнутой функции, что ломает интроспекцию и pytest fixtures.<\/p><ul><li><code>@lru_cache<\/code> — отличный кэш для чистых функций (без побочных эффектов и мутабельных аргументов)<\/li><li>Декораторы с параметрами: <code>@retry(times=3)<\/code> — фабрика декораторов<\/li><li>PyTorch активно использует декораторы: <code>@torch.no_grad()<\/code>, <code>@torch.compile<\/code><\/li><\/ul><p>Ошибка: применять <code>@lru_cache<\/code> к методам класса без учёта, что <code>self<\/code> тоже кэшируется — это может держать объекты в памяти дольше ожидаемого (утечка).<\/p>", "links": [{"title": "functools — документация Python", "url": "https://docs.python.org/3/library/functools.html"}, {"title": "Python Decorators — Real Python", "url": "https://realpython.com/primer-on-python-decorators/"}, {"title": "torch.no_grad — PyTorch docs", "url": "https://pytorch.org/docs/stable/generated/torch.no_grad.html"}]}, {"title": "Обработка ошибок и логирование", "level": "🟡 Middle", "explanation": "<p>Долгие обучающие запуски (часы/дни) требуют устойчивости к сбоям: NaN в лоссе, OOM на GPU, обрыв сети при скачивании данных.<\/p><pre><code>import logging\n\nlogger = logging.getLogger(__name__)\n\ntry:\n    loss = compute_loss(batch)\n    if torch.isnan(loss):\n        raise ValueError(\"NaN loss detected\")\nexcept torch.cuda.OutOfMemoryError:\n    logger.warning(\"OOM, очищаю кэш и уменьшаю batch\")\n    torch.cuda.empty_cache()\nexcept ValueError as e:\n    logger.error(f\"Training aborted: {e}\")\n    raise\nfinally:\n    checkpoint_manager.save_if_needed()<\/code><\/pre><ul><li>Никогда не используйте голый <code>except:<\/code> — он ловит даже <code>KeyboardInterrupt<\/code><\/li><li>Настраивайте <code>logging<\/code> вместо <code>print<\/code> — уровни (DEBUG/INFO/WARNING), ротация файлов, интеграция с W&B/MLflow<\/li><li>Свои исключения (<code>class DataValidationError(Exception)<\/code>) делают код читаемым для команды<\/li><\/ul><p>Продакшен-совет: логируйте не только ошибки, но и метрики на каждом шаге в структурированном виде (JSON-логи) — это упрощает последующий парсинг и алертинг.<\/p>", "links": [{"title": "logging — документация Python", "url": "https://docs.python.org/3/library/logging.html"}, {"title": "Errors and Exceptions — Python docs", "url": "https://docs.python.org/3/tutorial/errors.html"}, {"title": "Weights & Biases — документация", "url": "https://docs.wandb.ai/"}]}, {"title": "Работа с файлами и форматами: JSON, CSV, Parquet", "level": "🟢 Junior", "explanation": "<p>Выбор формата хранения данных сильно влияет на скорость пайплайна. CSV прост, но медленный и не хранит типы; Parquet — колоночный, сжатый, быстрый для аналитики и ML.<\/p><pre><code>import pandas as pd\n\ndf = pd.read_csv('data.csv')\ndf.to_parquet('data.parquet', engine='pyarrow', compression='snappy')\n\n# Parquet читается в разы быстрее и весит меньше\ndf2 = pd.read_parquet('data.parquet', columns=['id', 'label'])\n\nimport json\nwith open('config.json', encoding='utf-8') as f:\n    cfg = json.load(f)<\/code><\/pre><table><tr><th>Формат<\/th><th>Плюсы<\/th><th>Минусы<\/th><\/tr><tr><td>CSV<\/td><td>универсальный, читаемый<\/td><td>нет типов, медленный<\/td><\/tr><tr><td>JSON/JSONL<\/td><td>вложенные структуры<\/td><td>больше размер<\/td><\/tr><tr><td>Parquet<\/td><td>быстрый, сжатие, схема<\/td><td>не читается глазами<\/td><\/tr><\/table><p>Совет: для больших датасетов используйте JSONL (по строке на JSON-объект) — можно стримить построчно, не загружая всё в память. Частая ошибка — забыть <code>encoding='utf-8'<\/code> при работе с русскоязычными данными на Windows, где локаль по умолчанию cp1251.<\/p>", "links": [{"title": "pandas IO tools", "url": "https://pandas.pydata.org/docs/user_guide/io.html"}, {"title": "Apache Parquet — документация", "url": "https://parquet.apache.org/docs/"}, {"title": "json — документация Python", "url": "https://docs.python.org/3/library/json.html"}]}, {"title": "Asyncio: базовые концепции", "level": "🟡 Middle", "explanation": "<p>В ML-инженерии asyncio чаще всего нужен не для самого обучения (там GIL и NumPy/PyTorch и так уходят в C-код), а для инференс-серверов и параллельных вызовов внешних LLM/API.<\/p><pre><code>import asyncio\nimport aiohttp\n\nasync def fetch_embedding(session, text: str):\n    async with session.post(API_URL, json={\"text\": text}) as resp:\n        return await resp.json()\n\nasync def main(texts: list[str]):\n    async with aiohttp.ClientSession() as session:\n        tasks = [fetch_embedding(session, t) for t in texts]\n        return await asyncio.gather(*tasks)\n\nresults = asyncio.run(main([\"привет\", \"мир\"]))<\/code><\/pre><ul><li><code>asyncio.gather<\/code> — параллельные независимые запросы (например, батч эмбеддингов через API)<\/li><li>Не смешивайте блокирующий код (тяжёлые вычисления, <code>time.sleep<\/code>) с event loop без <code>run_in_executor<\/code><\/li><li>FastAPI + async — стандарт для сервинга ML-моделей с высокой конкурентностью<\/li><\/ul><p>Частая ошибка: использовать синхронный <code>requests<\/code> внутри <code>async def<\/code> — это блокирует весь event loop и убивает весь смысл асинхронности.<\/p>", "links": [{"title": "asyncio — документация Python", "url": "https://docs.python.org/3/library/asyncio.html"}, {"title": "aiohttp — документация", "url": "https://docs.aiohttp.org/"}, {"title": "FastAPI — документация", "url": "https://fastapi.tiangolo.com/"}]}, {"title": "Jupyter Notebook: эффективная работа", "level": "🟢 Junior", "explanation": "<p>Jupyter — стандартный инструмент для EDA и прототипирования, но требует дисциплины, иначе превращается в 'спагетти из ячеек'.<\/p><pre><code># Автоперезагрузка изменённых модулей\n%load_ext autoreload\n%autoreload 2\n\n# Замер времени ячейки\n%%timeit\nresult = expensive_function(data)\n\n# Быстрый просмотр датафрейма\ndf.describe()\ndf.head()\n\n# Магия для inline-графиков\n%matplotlib inline<\/code><\/pre><ul><li>Пишите ячейки так, чтобы Kernel → Restart & Run All проходил без ошибок — иначе notebook не воспроизводим<\/li><li>Выносите переиспользуемый код в <code>.py<\/code>-модули и импортируйте — не копипастьте функции между ноутбуками<\/li><li>Используйте <code>nbstripout<\/code> в git-хуках, чтобы не коммитить output ячеек (особенно с большими графиками)<\/li><\/ul><p>Типичная ошибка: полагаться на состояние переменных, оставшееся от удалённой ячейки — код работает у автора, но падает при чистом перезапуске. Это одна из главных причин 'у меня работало' на код-ревью.<\/p>", "links": [{"title": "Jupyter — документация", "url": "https://docs.jupyter.org/"}, {"title": "IPython magic commands", "url": "https://ipython.readthedocs.io/en/stable/interactive/magics.html"}, {"title": "nbstripout — GitHub", "url": "https://github.com/kynan/nbstripout"}]}, {"title": "Профилирование и оптимизация Python-кода", "level": "🔴 Senior", "explanation": "<p>Прежде чем оптимизировать, нужно измерить — интуиция про 'узкие места' в ML-пайплайнах часто ошибается (обычно тормозит I/O или препроцессинг, а не сама модель).<\/p><pre><code>import cProfile\nimport pstats\n\nprofiler = cProfile.Profile()\nprofiler.enable()\ntrain_epoch(model, loader)\nprofiler.disable()\nstats = pstats.Stats(profiler).sort_stats('cumulative')\nstats.print_stats(15)\n\n# Построчный профайлер\n# pip install line_profiler\n# %lprun -f my_function my_function(data)\n\n# Профилирование памяти\n# pip install memory_profiler\n# @profile\ndef process(data):\n    ...<\/code><\/pre><ul><li><code>cProfile<\/code> — по функциям, быстрый обзор<\/li><li><code>line_profiler<\/code> — построчно, для точечной оптимизации горячего цикла<\/li><li>Векторизация вместо Python-циклов: <code>numpy<\/code>/<code>pandas<\/code> операции вместо <code>for<\/code> ускоряют код в 10-100x<\/li><li><code>torch.utils.data.DataLoader(num_workers=N)<\/code> для распараллеливания загрузки данных, пока GPU считает<\/li><\/ul><p>Продакшен-совет: используйте PyTorch Profiler (<code>torch.profiler<\/code>) для анализа GPU/CPU трасс — часто выясняется, что узкое место не модель, а копирование тензоров CPU↔GPU или synchronize-вызовы.<\/p>", "links": [{"title": "cProfile — документация Python", "url": "https://docs.python.org/3/library/profile.html"}, {"title": "line_profiler — GitHub", "url": "https://github.com/pyutils/line_profiler"}, {"title": "PyTorch Profiler", "url": "https://pytorch.org/tutorials/recipes/recipes/profiler_recipe.html"}]}, {"title": "Тестирование с pytest", "level": "🟡 Middle", "explanation": "<p>ML-код тестируют иначе, чем обычный backend: важны не только 'функция вернула правильный тип', но и инварианты данных (формы тензоров, диапазоны значений, отсутствие NaN).<\/p><pre><code>import pytest\nimport numpy as np\n\n@pytest.fixture\ndef sample_batch():\n    return np.random.randn(32, 128)\n\ndef test_normalize_shape(sample_batch):\n    out = normalize(sample_batch)\n    assert out.shape == sample_batch.shape\n\ndef test_normalize_no_nan(sample_batch):\n    out = normalize(sample_batch)\n    assert not np.isnan(out).any()\n\n@pytest.mark.parametrize(\"batch_size\", [1, 16, 64])\ndef test_model_forward(batch_size):\n    x = torch.randn(batch_size, 10)\n    out = model(x)\n    assert out.shape == (batch_size, 2)<\/code><\/pre><ul><li><code>pytest.fixture<\/code> — переиспользуемые тестовые данные<\/li><li><code>parametrize<\/code> — проверка на разных batch size/edge cases (пустой батч, батч из 1 элемента)<\/li><li>Тестируйте препроцессинг отдельно от модели — это самая частая точка отказа в проде (сдвиг распределения между train и inference)<\/li><\/ul><p>Частая ошибка: тестировать только 'счастливый путь'. Обязательно проверяйте граничные случаи: пустые строки, отсутствующие ключи в JSON, батч размера 1 (легко ломает BatchNorm).<\/p>", "links": [{"title": "pytest — документация", "url": "https://docs.pytest.org/"}, {"title": "pytest fixtures — документация", "url": "https://docs.pytest.org/en/stable/how-to/fixtures.html"}, {"title": "NumPy testing", "url": "https://numpy.org/doc/stable/reference/routines.testing.html"}]}, {"title": "Управление конфигурацией экспериментов (Hydra/YAML)", "level": "🔴 Senior", "explanation": "<p>При десятках экспериментов хардкод гиперпараметров в коде превращается в хаос. Инструменты вроде Hydra позволяют компоновать и переопределять конфиги из CLI, сохраняя воспроизводимость.<\/p><pre><code># config.yaml\nmodel:\n  hidden_size: 256\n  num_layers: 4\ntrain:\n  lr: 3e-4\n  epochs: 20\n\n# main.py\nimport hydra\nfrom omegaconf import DictConfig\n\n@hydra.main(config_path=\"conf\", config_name=\"config\")\ndef main(cfg: DictConfig):\n    print(cfg.model.hidden_size)\n    train(cfg)\n\n# Запуск с переопределением из CLI:\n# python main.py train.lr=1e-3 model.num_layers=6<\/code><\/pre><ul><li>Hydra автоматически создаёт папку с логами и сохранённым конфигом для каждого запуска — критично для воспроизводимости<\/li><li>Multirun (<code>-m<\/code>) позволяет запускать grid search по гиперпараметрам одной командой<\/li><li>Альтернатива полегче — простой <code>dataclass<\/code> + <code>argparse<\/code>/<code>typer<\/code> для небольших проектов<\/li><\/ul><p>Совет: всегда сохраняйте итоговый resolved-конфиг вместе с чекпоинтом модели — без этого через полгода никто не вспомнит, с какими гиперпараметрами обучалась 'best_model.pt'.<\/p>", "links": [{"title": "Hydra — документация", "url": "https://hydra.cc/docs/intro/"}, {"title": "OmegaConf — документация", "url": "https://omegaconf.readthedocs.io/"}, {"title": "PyYAML — документация", "url": "https://pyyaml.org/wiki/PyYAMLDocumentation"}]}, {"title": "Работа с командной строкой: argparse и typer", "level": "🟢 Junior", "explanation": "<p>Скрипты обучения и инференса почти всегда запускаются с параметрами из терминала — CLI-интерфейс должен быть понятным и валидировать входные данные.<\/p><pre><code>import argparse\n\nparser = argparse.ArgumentParser()\nparser.add_argument('--lr', type=float, default=3e-4)\nparser.add_argument('--epochs', type=int, default=10)\nparser.add_argument('--model', choices=['resnet', 'vit'], required=True)\nargs = parser.parse_args()\n\n# Современная альтернатива — typer (автогенерация из type hints)\nimport typer\n\napp = typer.Typer()\n\n@app.command()\ndef train(lr: float = 3e-4, epochs: int = 10):\n    ...\n\nif __name__ == \"__main__\":\n    app()<\/code><\/pre><ul><li><code>typer<\/code> генерирует <code>--help<\/code> и валидацию автоматически из аннотаций типов — меньше boilerplate, чем <code>argparse<\/code><\/li><li>Используйте <code>choices<\/code>/<code>Literal<\/code> для параметров с фиксированным набором значений — предотвращает опечатки типа <code>--model resnett<\/code><\/li><li>Не забывайте про <code>--dry-run<\/code> флаг для проверки конфигурации без реального запуска долгого обучения<\/li><\/ul><p>Совет: логируйте полную командную строку запуска (<code>sys.argv<\/code>) в файл эксперимента — это спасает, когда нужно воспроизвести результат недельной давности.<\/p>", "links": [{"title": "argparse — документация Python", "url": "https://docs.python.org/3/library/argparse.html"}, {"title": "Typer — документация", "url": "https://typer.tiangolo.com/"}, {"title": "Click — документация", "url": "https://click.palletsprojects.com/"}]}], "quiz": [{"q": "Что произойдёт при повторных вызовах функции с dataclass-полем `tags: list[str] = []` вместо `field(default_factory=list)`?", "options": ["Ничего, каждый экземпляр получит новый пустой список", "Все экземпляры класса будут делить один и тот же список", "Будет выброшено исключение TypeError при создании класса", "Python автоматически исправит это на default_factory"], "answer": 1, "explain": "Изменяемые значения по умолчанию создаются один раз и разделяются между всеми экземплярами — классическая ловушка Python."}, {"q": "Почему для больших JSONL-датасетов предпочтительнее использовать генератор, а не загружать весь файл в список?", "options": ["Генераторы работают быстрее благодаря JIT-компиляции", "Список нельзя итерировать более одного раза", "Генератор обрабатывает данные лениво, не требуя загрузки всего файла в память", "JSONL нельзя прочитать иначе, кроме как генератором"], "answer": 2, "explain": "Генераторы дают ленивую (lazy) обработку — данные читаются и обрабатываются по одному элементу, что экономит память на больших датасетах."}, {"q": "Зачем нужен functools.wraps при написании декораторов?", "options": ["Он ускоряет выполнение обёрнутой функции", "Без него декоратор не будет работать вообще", "Он сохраняет __name__ и docstring оригинальной функции после обёртывания", "Он автоматически кэширует результат функции"], "answer": 2, "explain": "functools.wraps копирует метаданные (__name__, __doc__) из оригинальной функции в обёртку, что важно для интроспекции и отладки."}, {"q": "Почему голый `except:` считается плохой практикой в обработке ошибок?", "options": ["Он работает медленнее, чем except Exception", "Он ловит даже KeyboardInterrupt и SystemExit, что мешает штатной остановке программы", "Python не позволяет использовать его в функциях", "Он не совместим с логированием через модуль logging"], "answer": 1, "explain": "Голый except перехватывает все исключения, включая системные (KeyboardInterrupt, SystemExit), что затрудняет корректное завершение и отладку."}, {"q": "В чём главное преимущество формата Parquet перед CSV для ML-датасетов?", "options": ["Parquet можно открыть в обычном текстовом редакторе", "Parquet — колоночный формат со схемой и сжатием, что ускоряет чтение и уменьшает размер", "CSV не поддерживается библиотекой pandas", "Parquet не требует установки дополнительных библиотек"], "answer": 1, "explain": "Parquet хранит данные по колонкам с типами и компрессией, что даёт значительный выигрыш в скорости чтения и объёме по сравнению с построчным текстовым CSV."}, {"q": "Что произойдёт, если внутри async-функции вызвать синхронный блокирующий requests.get() без run_in_executor?", "options": ["asyncio автоматически распараллелит вызов", "Будет выброшено RuntimeError", "Это заблокирует весь event loop, лишая смысла асинхронность", "Запрос выполнится быстрее благодаря event loop"], "answer": 2, "explain": "Синхронные блокирующие вызовы внутри async-кода останавливают event loop целиком, блокируя выполнение всех остальных корутин."}, {"q": "Какой инструмент лучше всего подходит для построчного (line-by-line) профилирования горячего участка Python-кода?", "options": ["cProfile", "line_profiler", "pytest", "mypy"], "answer": 1, "explain": "line_profiler даёт построчную статистику времени выполнения, тогда как cProfile агрегирует данные по функциям в целом."}, {"q": "Почему в pytest-тестах для ML-пайплайнов важно проверять батч размера 1?", "options": ["Потому что pytest требует минимум один тест-кейс с размером 1", "Батч из одного элемента может ломать слои вроде BatchNorm, которые рассчитаны на статистику по батчу", "Это ускоряет прохождение тестов", "Батч размера 1 обязателен по стандарту PEP8"], "answer": 1, "explain": "BatchNorm и подобные слои вычисляют статистику (среднее, дисперсию) по батчу, и батч из одного элемента — частый edge case, ломающий такие вычисления."}, {"q": "Зачем сохранять resolved-конфиг эксперимента (например, через Hydra) вместе с чекпоинтом модели?", "options": ["Это требование лицензии PyTorch", "Чтобы уменьшить размер чекпоинта", "Чтобы впоследствии можно было точно воспроизвести, с какими гиперпараметрами обучалась модель", "Конфиг ускоряет загрузку модели при инференсе"], "answer": 2, "explain": "Без сохранённого конфига невозможно достоверно восстановить условия обучения модели спустя время — это критично для воспроизводимости экспериментов."}, {"q": "В чём преимущество uv перед классической связкой pip + venv?", "options": ["uv поддерживает только Python 2.7", "uv значительно быстрее благодаря реализации на Rust", "uv автоматически обучает модели", "uv заменяет pytest для тестирования"], "answer": 1, "explain": "uv написан на Rust и обеспечивает значительно более высокую скорость установки зависимостей и создания окружений по сравнению с pip/venv."}], "id": 0, "pi": 0}, {"phase": "Phase 1 — Python + Math + Data", "section": "📐 Математика для ML", "topics": [{"title": "Векторы и векторные операции", "level": "🟢 Junior", "explanation": "<p>Вектор — упорядоченный набор чисел, задающий точку или направление в пространстве. В ML вектор — это, как правило, одно наблюдение (строка признаков).<\/p><ul><li>Сложение и вычитание — покомпонентно<\/li><li>Скалярное произведение (dot product) — мера \"схожести\" направлений, основа косинусного сходства<\/li><li>Норма вектора (L1, L2) — длина, используется в регуляризации<\/li><\/ul><pre><code>import numpy as np\na = np.array([1, 2, 3])\nb = np.array([4, 5, 6])\ndot = a @ b            # 32\nnorm_l2 = np.linalg.norm(a)   # sqrt(1+4+9)\ncos_sim = dot / (np.linalg.norm(a) * np.linalg.norm(b))\n<\/code><\/pre><p>Типичная ошибка новичков — путать поэлементное умножение <code>a * b<\/code> и матричное/скалярное <code>a @ b<\/code>. В NumPy это разные операции, и на больших моделях такая опечатка молча даёт неверные градиенты.<\/p><p>Совет: всегда проверяйте <code>.shape<\/code> массивов перед операцией — 90% багов в ML-коде это mismatch размерностей.<\/p>", "links": [{"title": "NumPy: Linear algebra", "url": "https://numpy.org/doc/stable/reference/routines.linalg.html"}, {"title": "3Blue1Brown: Essence of Linear Algebra", "url": "https://www.3blue1brown.com/topics/linear-algebra"}, {"title": "Vector (Wikipedia)", "url": "https://en.wikipedia.org/wiki/Euclidean_vector"}]}, {"title": "Матрицы и матричные операции", "level": "🟢 Junior", "explanation": "<p>Матрица — таблица чисел, в ML чаще всего это батч данных (строки — объекты, столбцы — признаки) или веса слоя нейросети.<\/p><table><tr><th>Операция<\/th><th>Смысл<\/th><\/tr><tr><td>Транспонирование <code>A.T<\/code><\/td><td>меняет строки и столбцы местами<\/td><\/tr><tr><td>Умножение <code>A @ B<\/code><\/td><td>линейное преобразование, основа Dense/Linear слоёв<\/td><\/tr><tr><td>Обратная матрица <code>np.linalg.inv(A)<\/code><\/td><td>решение систем уравнений (аналитическая регрессия)<\/td><\/tr><\/table><pre><code>import numpy as np\nX = np.random.randn(100, 5)   # 100 объектов, 5 признаков\nW = np.random.randn(5, 1)     # веса\ny_pred = X @ W                # (100, 1)\n<\/code><\/pre><p>Продакшен-совет: при работе с PyTorch/TensorFlow правило то же, но размерности называют \"shape broadcasting\". Ошибка <code>RuntimeError: mat1 and mat2 shapes cannot be multiplied<\/code> — самая частая на старте, лечится проверкой <code>(N, in_features) @ (in_features, out_features)<\/code>.<\/p>", "links": [{"title": "NumPy: Array broadcasting", "url": "https://numpy.org/doc/stable/user/basics.broadcasting.html"}, {"title": "PyTorch: torch.nn.Linear", "url": "https://pytorch.org/docs/stable/generated/torch.nn.Linear.html"}, {"title": "Matrix (mathematics) — Wikipedia", "url": "https://en.wikipedia.org/wiki/Matrix_(mathematics)"}]}, {"title": "Собственные значения и собственные векторы", "level": "🟡 Middle", "explanation": "<p>Для матрицы <code>A<\/code> собственный вектор <code>v<\/code> и собственное значение <code>λ<\/code> удовлетворяют <code>A v = λ v<\/code> — вектор не меняет направление при преобразовании, лишь масштабируется.<\/p><ul><li>Лежат в основе PCA (снижение размерности) — собственные векторы матрицы ковариации задают главные компоненты<\/li><li>Используются в спектральной кластеризации и анализе устойчивости обучения (собственные значения гессиана)<\/li><\/ul><pre><code>import numpy as np\nX = np.random.randn(200, 3)\nX -= X.mean(axis=0)\ncov = np.cov(X.T)\neigvals, eigvecs = np.linalg.eigh(cov)\n# сортируем по убыванию значимости\norder = np.argsort(eigvals)[::-1]\nprincipal = eigvecs[:, order[0]]\n<\/code><\/pre><p>Практический момент: <code>np.linalg.eig<\/code> vs <code>np.linalg.eigh<\/code> — для симметричных матриц (как ковариация) всегда используйте <code>eigh<\/code>, он быстрее и численно стабильнее.<\/p><p>Интуиция для собеседования: большие собственные значения гессиана функции потерь → крутые направления → нужен меньший learning rate, иначе расходимость.<\/p>", "links": [{"title": "NumPy: numpy.linalg.eigh", "url": "https://numpy.org/doc/stable/reference/generated/numpy.linalg.eigh.html"}, {"title": "scikit-learn: PCA", "url": "https://scikit-learn.org/stable/modules/decomposition.html#pca"}, {"title": "Eigenvalues and eigenvectors — Wikipedia", "url": "https://en.wikipedia.org/wiki/Eigenvalues_and_eigenvectors"}]}, {"title": "Производные и градиент", "level": "🟢 Junior", "explanation": "<p>Производная показывает скорость изменения функции. Градиент — вектор частных производных функции по каждому параметру, указывает направление наискорейшего роста.<\/p><pre><code>import torch\nx = torch.tensor(3.0, requires_grad=True)\ny = x**2 + 2*x\ny.backward()\nprint(x.grad)  # dy/dx = 2x+2 = 8\n<\/code><\/pre><ul><li>Для обучения модели градиент функции потерь по весам показывает, куда \"толкать\" веса<\/li><li>Автоматическое дифференцирование (autograd) в PyTorch/TensorFlow считает это за вас — но важно понимать, что происходит под капотом<\/li><\/ul><p>Частая ошибка: забыть <code>optimizer.zero_grad()<\/code> перед <code>backward()<\/code> — градиенты накапливаются между итерациями, и модель обучается некорректно, хотя ошибок в коде нет.<\/p><p>Совет ментора: если <code>loss.backward()<\/code> падает с <code>RuntimeError: grad can be implicitly created only for scalar outputs<\/code>, значит вы вызвали backward на тензоре, а не на скаляре — нужно сначала усреднить (<code>.mean()<\/code>) или просуммировать.<\/p>", "links": [{"title": "PyTorch: Autograd mechanics", "url": "https://pytorch.org/docs/stable/notes/autograd.html"}, {"title": "PyTorch: torch.autograd", "url": "https://pytorch.org/docs/stable/autograd.html"}, {"title": "karpathy/micrograd", "url": "https://github.com/karpathy/micrograd"}]}, {"title": "Chain rule (правило цепочки) и backpropagation", "level": "🟡 Middle", "explanation": "<p>Chain rule позволяет вычислить производную сложной функции через производные её составных частей: <code>d(f(g(x)))/dx = f'(g(x)) * g'(x)<\/code>. Backpropagation — это применение chain rule послойно, от выхода сети к входу.<\/p><pre><code># Ручной пример: y = sigmoid(w*x + b)\nimport numpy as np\nw, x, b = 0.5, 2.0, 0.1\nz = w*x + b\ny = 1/(1+np.exp(-z))\n# dL/dy известна (например, из loss)\ndL_dy = 0.3\n# chain rule: dL/dz = dL/dy * dy/dz, dy/dz = y*(1-y)\ndL_dz = dL_dy * y*(1-y)\ndL_dw = dL_dz * x   # dz/dw = x\n<\/code><\/pre><p>Понимание chain rule критично для отладки vanishing/exploding gradients: при глубоких сетях произведение множества маленьких производных (&lt;1) стремится к нулю — сигнал не доходит до первых слоёв.<\/p><ul><li>Решения: residual connections, нормализация (BatchNorm/LayerNorm), правильная инициализация весов (Xavier/He)<\/li><\/ul><p>На собеседованиях часто просят вывести backprop для простого перцептрона на бумаге — стоит попрактиковаться руками хотя бы раз.<\/p>", "links": [{"title": "PyTorch: Autograd mechanics", "url": "https://pytorch.org/docs/stable/notes/autograd.html"}, {"title": "Backpropagation — Wikipedia", "url": "https://en.wikipedia.org/wiki/Backpropagation"}, {"title": "karpathy: Neural Networks: Zero to Hero", "url": "https://karpathy.ai/zero-to-hero.html"}]}, {"title": "Градиентный спуск: интуиция и варианты", "level": "🟢 Junior", "explanation": "<p>Градиентный спуск — итеративный метод минимизации функции потерь: шаг за шагом двигаемся против направления градиента.<\/p><pre><code>w = w - lr * grad_w\n<\/code><\/pre><table><tr><th>Вариант<\/th><th>Особенность<\/th><\/tr><tr><td>Batch GD<\/td><td>градиент по всей выборке — точно, но медленно<\/td><\/tr><tr><td>SGD<\/td><td>по одному объекту — шумно, но быстро<\/td><\/tr><tr><td>Mini-batch GD<\/td><td>компромисс, стандарт в глубоком обучении<\/td><\/tr><tr><td>Adam<\/td><td>адаптивный learning rate + momentum, дефолт в большинстве проектов<\/td><\/tr><\/table><p>Ключевой гиперпараметр — learning rate (<code>lr<\/code>). Слишком большой → расходимость (loss улетает в NaN), слишком маленький → обучение занимает вечность.<\/p><p>Практика: если видите <code>loss = nan<\/code> после нескольких шагов — в 80% случаев виноват завышенный lr или отсутствие gradient clipping. Начинайте с <code>lr=1e-3<\/code> для Adam и подбирайте через LR range test или scheduler (<code>ReduceLROnPlateau<\/code>, <code>CosineAnnealing<\/code>).<\/p>", "links": [{"title": "PyTorch: torch.optim", "url": "https://pytorch.org/docs/stable/optim.html"}, {"title": "Adam optimizer paper (arXiv)", "url": "https://arxiv.org/abs/1412.6980"}, {"title": "Gradient descent — Wikipedia", "url": "https://en.wikipedia.org/wiki/Gradient_descent"}]}, {"title": "Вероятность и распределения", "level": "🟢 Junior", "explanation": "<p>Вероятностный взгляд лежит в основе большинства ML-моделей: классификатор предсказывает не класс, а распределение вероятностей по классам.<\/p><ul><li><b>Нормальное (Гауссово)<\/b> распределение — фон для многих статистических тестов и инициализации весов<\/li><li><b>Бернулли/биномиальное<\/b> — бинарная классификация<\/li><li><b>Категориальное<\/b> — многоклассовая классификация (softmax)<\/li><\/ul><pre><code>import numpy as np\nfrom scipy import stats\n\nsample = np.random.normal(loc=0, scale=1, size=1000)\nprint(stats.norm.pdf(0))       # плотность в точке 0\nprint(stats.norm.cdf(1.96))    # ~0.975\n<\/code><\/pre><p>Softmax превращает вектор логитов в распределение вероятностей:<\/p><pre><code>def softmax(z):\n    e = np.exp(z - np.max(z))  # вычитаем max для численной стабильности!\n    return e / e.sum()\n<\/code><\/pre><p>Забытое вычитание максимума — классический баг: при больших логитах <code>exp()<\/code> уходит в переполнение (<code>inf<\/code>), и softmax возвращает NaN.<\/p>", "links": [{"title": "SciPy: scipy.stats", "url": "https://docs.scipy.org/doc/scipy/reference/stats.html"}, {"title": "NumPy: Random sampling", "url": "https://numpy.org/doc/stable/reference/random/index.html"}, {"title": "Softmax function — Wikipedia", "url": "https://en.wikipedia.org/wiki/Softmax_function"}]}, {"title": "Байесовская теорема", "level": "🟡 Middle", "explanation": "<p>Формула Байеса связывает априорную и апостериорную вероятность: <code>P(H|D) = P(D|H) * P(H) / P(D)<\/code>. Позволяет обновлять убеждения по мере поступления данных.<\/p><pre><code># Наивный Байес для спам-фильтра (упрощённо)\n# P(spam|word) = P(word|spam)*P(spam) / P(word)\np_spam = 0.3\np_word_given_spam = 0.8\np_word_given_ham = 0.1\np_word = p_word_given_spam*p_spam + p_word_given_ham*(1-p_spam)\np_spam_given_word = (p_word_given_spam * p_spam) / p_word\n<\/code><\/pre><ul><li>Основа Naive Bayes классификатора<\/li><li>Байесовская оптимизация гиперпараметров (Optuna, BoTorch) использует апостериорное распределение для выбора следующей точки поиска<\/li><li>A/B тестирование: байесовский подход даёт вероятность \"вариант B лучше\", а не просто p-value<\/li><\/ul><p>Ловушка на собеседовании — классическая задача про тест на редкую болезнь: даже при точности теста 99% вероятность реального заболевания при положительном результате может быть низкой из-за малой базовой частоты (prior). Всегда считайте через формулу, а не интуитивно.<\/p>", "links": [{"title": "Bayes' theorem — Wikipedia", "url": "https://en.wikipedia.org/wiki/Bayes%27_theorem"}, {"title": "scikit-learn: Naive Bayes", "url": "https://scikit-learn.org/stable/modules/naive_bayes.html"}, {"title": "Optuna docs", "url": "https://optuna.readthedocs.io/"}]}, {"title": "Математическое ожидание и дисперсия", "level": "🟢 Junior", "explanation": "<p>Матожидание <code>E[X]<\/code> — среднее значение случайной величины с учётом весов вероятности. Дисперсия <code>Var(X) = E[(X-E[X])²]<\/code> — мера разброса.<\/p><pre><code>import numpy as np\ndata = np.array([2, 4, 4, 4, 5, 5, 7, 9])\nmean = data.mean()          # E[X]\nvar = data.var()            # смещённая дисперсия (ddof=0)\nvar_unbiased = data.var(ddof=1)  # несмещённая, для выборки\nstd = data.std()\n<\/code><\/pre><p>Важное практическое различие: при <code>ddof=0<\/code> NumPy делит на N (популяционная дисперсия), при <code>ddof=1<\/code> — на N-1 (выборочная оценка, несмещённая). Для статистических выводов на выборке всегда используйте <code>ddof=1<\/code>.<\/p><ul><li>Bias-variance tradeoff: высокая дисперсия модели = переобучение, высокое смещение (bias) = недообучение<\/li><li>Нормализация признаков (StandardScaler) использует именно среднее и дисперсию: <code>(x - mean) / std<\/code><\/li><\/ul><p>Совет: считайте mean/std только на train-выборке и применяйте к test — иначе получите data leakage.<\/p>", "links": [{"title": "NumPy: numpy.var / numpy.std", "url": "https://numpy.org/doc/stable/reference/generated/numpy.var.html"}, {"title": "scikit-learn: StandardScaler", "url": "https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.StandardScaler.html"}, {"title": "Bias–variance tradeoff — Wikipedia", "url": "https://en.wikipedia.org/wiki/Bias%E2%80%93variance_tradeoff"}]}, {"title": "Статистические тесты (t-test, chi-square)", "level": "🟡 Middle", "explanation": "<p>Статистические тесты позволяют формально проверить, случайно ли различие между группами (например, в A/B-тесте) или оно значимо.<\/p><pre><code>from scipy import stats\n\ngroup_a = [5.1, 5.5, 5.0, 5.3, 5.2]\ngroup_b = [5.8, 6.0, 5.7, 6.1, 5.9]\nt_stat, p_value = stats.ttest_ind(group_a, group_b)\nprint(p_value)  # если < 0.05 — различие статистически значимо\n<\/code><\/pre><ul><li><b>t-test<\/b> — сравнение средних двух групп<\/li><li><b>chi-square<\/b> — проверка независимости категориальных переменных<\/li><li><b>ANOVA<\/b> — сравнение более двух групп<\/li><\/ul><p>Классическая ошибка — множественное тестирование (multiple comparisons) без поправки (Bonferroni, Benjamini-Hochberg): при проверке 20 гипотез с порогом p&lt;0.05 вы почти гарантированно получите хотя бы один ложноположительный результат.<\/p><p>В продакшене статистические тесты применяют для проверки дрифта данных (data drift): сравнивают распределение признаков в проде и на train через Kolmogorov-Smirnov тест.<\/p>", "links": [{"title": "SciPy: scipy.stats.ttest_ind", "url": "https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.ttest_ind.html"}, {"title": "Student's t-test — Wikipedia", "url": "https://en.wikipedia.org/wiki/Student%27s_t-test"}, {"title": "Chi-squared test — Wikipedia", "url": "https://en.wikipedia.org/wiki/Chi-squared_test"}]}, {"title": "Метод максимального правдоподобия (MLE)", "level": "🔴 Senior", "explanation": "<p>MLE — метод оценки параметров модели, максимизирующий вероятность (правдоподобие) наблюдаемых данных при заданных параметрах.<\/p><pre><code>import numpy as np\nfrom scipy.optimize import minimize_scalar\n\ndata = np.array([2.1, 1.9, 2.3, 2.0, 2.2])\n\ndef neg_log_likelihood(mu):\n    sigma = 1.0\n    ll = -0.5*np.sum(((data-mu)/sigma)**2)\n    return -ll  # минимизируем отрицательное правдоподобие\n\nres = minimize_scalar(neg_log_likelihood)\nprint(res.x)  # оценка mu ≈ mean(data)\n<\/code><\/pre><p>Ключевая связь: минимизация MSE (среднеквадратичной ошибки) в линейной регрессии эквивалентна MLE при предположении о гауссовом шуме. Минимизация кросс-энтропии в классификации — это MLE для категориального распределения.<\/p><ul><li>MAP (maximum a posteriori) — MLE + prior, добавляет регуляризацию естественным путём (L2 = гауссов prior, L1 = Лапласовский prior)<\/li><\/ul><p>На senior-собеседовании часто просят вывести, почему <code>CrossEntropyLoss<\/code> — это фактически <code>-log P(y|x)<\/code>, то есть максимизация правдоподобия истинного класса.<\/p>", "links": [{"title": "Maximum likelihood estimation — Wikipedia", "url": "https://en.wikipedia.org/wiki/Maximum_likelihood_estimation"}, {"title": "SciPy: scipy.optimize.minimize_scalar", "url": "https://docs.scipy.org/doc/scipy/reference/generated/scipy.optimize.minimize_scalar.html"}, {"title": "PyTorch: CrossEntropyLoss", "url": "https://pytorch.org/docs/stable/generated/torch.nn.CrossEntropyLoss.html"}]}, {"title": "Энтропия и Kullback-Leibler дивергенция", "level": "🔴 Senior", "explanation": "<p>Энтропия <code>H(p) = -Σ p(x) log p(x)<\/code> измеряет неопределённость распределения. KL-дивергенция <code>D_KL(p||q)<\/code> измеряет, насколько распределение <code>q<\/code> отличается от истинного <code>p<\/code>.<\/p><pre><code>import numpy as np\n\ndef entropy(p):\n    p = p[p > 0]\n    return -np.sum(p * np.log(p))\n\ndef kl_divergence(p, q):\n    mask = p > 0\n    return np.sum(p[mask] * np.log(p[mask] / q[mask]))\n\np = np.array([0.9, 0.1])\nq = np.array([0.6, 0.4])\nprint(entropy(p), kl_divergence(p, q))\n<\/code><\/pre><ul><li>Кросс-энтропия = энтропия + KL-дивергенция: <code>H(p,q) = H(p) + D_KL(p||q)<\/code> — поэтому минимизация cross-entropy loss эквивалентна минимизации KL между истинным и предсказанным распределением<\/li><li>KL используется в VAE (variational autoencoders), в RLHF (PPO/DPO с KL-штрафом от reference policy) и дистилляции моделей<\/li><\/ul><p>Важно помнить: KL-дивергенция несимметрична, <code>D_KL(p||q) ≠ D_KL(q||p)<\/code> — выбор направления влияет на поведение оптимизации (mode-seeking vs mode-covering).<\/p>", "links": [{"title": "Kullback–Leibler divergence — Wikipedia", "url": "https://en.wikipedia.org/wiki/Kullback%E2%80%93Leibler_divergence"}, {"title": "Entropy (information theory) — Wikipedia", "url": "https://en.wikipedia.org/wiki/Entropy_(information_theory)"}, {"title": "Auto-Encoding Variational Bayes (VAE paper, arXiv)", "url": "https://arxiv.org/abs/1312.6114"}]}, {"title": "Линейная регрессия как математическая модель", "level": "🟡 Middle", "explanation": "<p>Линейная регрессия ищет веса <code>w<\/code>, минимизирующие сумму квадратов ошибок <code>||Xw - y||²<\/code>. Есть точное аналитическое решение через нормальное уравнение:<\/p><pre><code>import numpy as np\n\nX = np.random.randn(100, 3)\nX_b = np.c_[np.ones((100,1)), X]  # добавляем bias-столбец\ny = X_b @ np.array([1,2,-1,0.5]) + np.random.randn(100)*0.1\n\n# Нормальное уравнение: w = (X^T X)^-1 X^T y\nw = np.linalg.inv(X_b.T @ X_b) @ X_b.T @ y\n<\/code><\/pre><p>На практике <code>inv()<\/code> численно нестабильна и медленна при большом числе признаков — вместо неё используют <code>np.linalg.lstsq<\/code> или градиентный спуск.<\/p><ul><li>Регуляризация: Ridge (L2) добавляет <code>λ||w||²<\/code>, Lasso (L1) — <code>λ||w||₁<\/code> и обнуляет часть весов (feature selection)<\/li><li>Мультиколлинеарность признаков делает <code>X^T X<\/code> плохо обусловленной — решение через SVD или регуляризацию<\/li><\/ul><p>Совет: даже используя <code>sklearn.linear_model.LinearRegression<\/code>, полезно понимать, что под капотом — это поможет диагностировать нестабильность коэффициентов при коррелирующих признаках.<\/p>", "links": [{"title": "scikit-learn: Linear Models", "url": "https://scikit-learn.org/stable/modules/linear_model.html"}, {"title": "NumPy: numpy.linalg.lstsq", "url": "https://numpy.org/doc/stable/reference/generated/numpy.linalg.lstsq.html"}, {"title": "Linear regression — Wikipedia", "url": "https://en.wikipedia.org/wiki/Linear_regression"}]}, {"title": "Матричные разложения: SVD и его применение", "level": "🔴 Senior", "explanation": "<p>Singular Value Decomposition раскладывает любую матрицу <code>A = U Σ V^T<\/code>, где <code>Σ<\/code> — диагональная матрица сингулярных значений, отражающих \"важность\" направлений.<\/p><pre><code>import numpy as np\nA = np.random.randn(50, 10)\nU, S, Vt = np.linalg.svd(A, full_matrices=False)\n\n# сжатие: оставляем только k главных компонент\nk = 3\nA_approx = U[:, :k] @ np.diag(S[:k]) @ Vt[:k, :]\n<\/code><\/pre><ul><li>PCA математически реализуется через SVD данных, а не через явное вычисление собственных векторов ковариации — это численно стабильнее<\/li><li>Рекомендательные системы: матричная факторизация рейтингов пользователь-товар через SVD (или его обучаемые аналоги — ALS)<\/li><li>Сжатие моделей: low-rank approximation весов слоя ускоряет инференс<\/li><li>LoRA (Low-Rank Adaptation) для fine-tuning больших языковых моделей — теоретическая база именно в низкоранговых разложениях<\/li><\/ul><p>Senior-инсайт: если на собеседовании спросят, почему LoRA работает — ответ в том, что изменение весов при fine-tuning часто имеет низкий intrinsic rank, и его можно аппроксимировать произведением двух маленьких матриц вместо полного дообучения.<\/p>", "links": [{"title": "NumPy: numpy.linalg.svd", "url": "https://numpy.org/doc/stable/reference/generated/numpy.linalg.svd.html"}, {"title": "LoRA paper (arXiv)", "url": "https://arxiv.org/abs/2106.09685"}, {"title": "Hugging Face: PEFT docs", "url": "https://huggingface.co/docs/peft/index"}, {"title": "Singular value decomposition — Wikipedia", "url": "https://en.wikipedia.org/wiki/Singular_value_decomposition"}]}], "quiz": [{"q": "Что вычисляет операция a @ b для двух векторов NumPy?", "options": ["Поэлементное умножение", "Скалярное (dot) произведение", "Конкатенацию векторов", "Норму разности"], "answer": 1, "explain": "Оператор @ в NumPy — это матричное/скалярное умножение, в отличие от * (поэлементное)."}, {"q": "Почему для симметричных матриц (например, ковариации) предпочтительнее np.linalg.eigh, а не np.linalg.eig?", "options": ["eigh работает только с целыми числами", "eigh быстрее и численно стабильнее для симметричных матриц", "eig устарел и удалён из NumPy", "Разницы нет, это синонимы"], "answer": 1, "explain": "eigh специально оптимизирован под симметричные/эрмитовы матрицы и гарантирует вещественные собственные значения."}, {"q": "Что произойдёт, если забыть вызвать optimizer.zero_grad() перед loss.backward() в PyTorch?", "options": ["Программа упадёт с ошибкой", "Градиенты будут накапливаться между итерациями", "Модель обучится быстрее", "Ничего, PyTorch делает это автоматически"], "answer": 1, "explain": "PyTorch по умолчанию накапливает градиенты в .grad, поэтому без обнуления они суммируются между шагами, искажая обучение."}, {"q": "Какая проблема возникает при обучении очень глубоких сетей из-за chain rule, если производные слоёв меньше 1?", "options": ["Exploding gradients", "Vanishing gradients", "Overfitting", "Data leakage"], "answer": 1, "explain": "Перемножение множества маленьких производных (<1) экспоненциально уменьшает градиент к первым слоям — vanishing gradients."}, {"q": "Зачем в функции softmax вычитают np.max(z) перед экспонентой?", "options": ["Для ускорения вычислений", "Для численной стабильности и предотвращения переполнения exp()", "Это требование по стандарту NumPy", "Чтобы сумма вероятностей была больше 1"], "answer": 1, "explain": "Без вычитания максимума большие логиты дают exp(large)=inf, и результат становится NaN."}, {"q": "Наивный Байес классификатор основан на:", "options": ["Градиентном спуске", "Теореме Байеса и предположении о независимости признаков", "Матричном разложении SVD", "Chain rule для backpropagation"], "answer": 1, "explain": "Naive Bayes использует формулу Байеса, наивно предполагая условную независимость признаков друг от друга."}, {"q": "Чем отличается data.var(ddof=0) от data.var(ddof=1) в NumPy?", "options": ["ddof=1 считает медиану вместо среднего", "ddof=0 делит на N, ddof=1 делит на N-1 (несмещённая оценка)", "Они дают одинаковый результат всегда", "ddof=1 применим только к целым числам"], "answer": 1, "explain": "ddof=1 даёт несмещённую оценку дисперсии выборки (деление на N-1), что важно при статистических выводах."}, {"q": "Минимизация MSE в линейной регрессии математически эквивалентна:", "options": ["Минимизации энтропии", "MLE при предположении о гауссовом шуме в данных", "Байесовской теореме напрямую", "SVD разложению матрицы признаков"], "answer": 1, "explain": "При гауссовом шуме максимизация правдоподобия (MLE) сводится ровно к минимизации суммы квадратов ошибок (MSE)."}, {"q": "Что отличает KL-дивергенцию D_KL(p||q) от обычной метрики расстояния?", "options": ["Она всегда отрицательна", "Она несимметрична: D_KL(p||q) ≠ D_KL(q||p)", "Она определена только для дискретных распределений", "Она равна нулю всегда, если p и q разные"], "answer": 1, "explain": "KL-дивергенция не является метрикой в строгом смысле именно из-за несимметричности, что влияет на выбор направления в задачах вроде VAE."}, {"q": "На чём математически основан метод LoRA для fine-tuning больших языковых моделей?", "options": ["Градиентном клиппинге", "Низкоранговом разложении (low-rank) изменения весов", "Байесовской оптимизации гиперпараметров", "Chi-square тестах на дрифт данных"], "answer": 1, "explain": "LoRA аппроксимирует изменение весов при fine-tuning произведением двух маленьких low-rank матриц, опираясь на идеи SVD/низкорангового разложения."}], "id": 1, "pi": 0}, {"phase": "Phase 1 — Python + Math + Data", "section": "🧮 NumPy · Pandas · SQL", "topics": [{"title": "ndarray и broadcasting", "level": "🟢 Junior", "explanation": "<p>Основа NumPy — <code>ndarray<\/code>: однородный многомерный массив с фиксированным типом и формой (<code>shape<\/code>). В отличие от списков Python, элементы хранятся в непрерывном блоке памяти, что даёт скорость и компактность.<\/p><ul><li><code>arr.shape<\/code>, <code>arr.dtype<\/code>, <code>arr.ndim<\/code> — базовые атрибуты, проверяйте их при отладке.<\/li><li><b>Broadcasting<\/b> — правило, по которому массивы разной формы участвуют в операциях без явного копирования данных.<\/li><\/ul><pre><code>import numpy as np\na = np.array([[1,2,3],[4,5,6]])  # shape (2,3)\nb = np.array([10,20,30])          # shape (3,)\nprint(a + b)  # b растягивается по строкам\n# [[11 22 33]\n#  [14 25 36]]<\/code><\/pre><p>Правило broadcasting: формы сравниваются справа налево, размерности должны совпадать либо одна из них равна 1.<\/p><p><b>Типичная ошибка:<\/b> смешивать <code>int<\/code> и <code>float<\/code> массивы и удивляться неявному приведению типов, либо получать <code>ValueError: operands could not be broadcast together<\/code> — проверяйте <code>shape<\/code> перед операцией.<\/p><p><b>Совет:<\/b> используйте <code>arr.reshape(-1, 1)<\/code> для явного превращения вектора в столбец при broadcasting.<\/p>", "links": [{"title": "NumPy: ndarray docs", "url": "https://numpy.org/doc/stable/reference/arrays.ndarray.html"}, {"title": "NumPy Broadcasting", "url": "https://numpy.org/doc/stable/user/basics.broadcasting.html"}, {"title": "NumPy Quickstart", "url": "https://numpy.org/doc/stable/user/quickstart.html"}]}, {"title": "Векторизация вместо циклов", "level": "🟢 Junior", "explanation": "<p>Циклы <code>for<\/code> по NumPy-массивам — антипаттерн: каждая итерация в Python обходится дорого из-за интерпретатора. Векторизованные операции выполняются в скомпилированном C-коде.<\/p><pre><code>import numpy as np\nx = np.random.rand(1_000_000)\n\n# Плохо: ~0.3-0.5 сек\nresult = [v**2 + 1 for v in x]\n\n# Хорошо: ~0.005 сек\nresult = x**2 + 1<\/code><\/pre><p>Полезные инструменты вместо ручных циклов:<\/p><ul><li><code>np.where(cond, a, b)<\/code> — векторный if/else<\/li><li><code>np.select([cond1, cond2], [val1, val2], default=0)<\/code> — множественные условия<\/li><li><code>np.vectorize<\/code> — удобно, но НЕ быстрее цикла, это просто синтаксический сахар<\/li><\/ul><table><tr><th>Подход<\/th><th>Скорость<\/th><\/tr><tr><td>Python for-loop<\/td><td>1x (база)<\/td><\/tr><tr><td>np.vectorize<\/td><td>~1.2x<\/td><\/tr><tr><td>Векторизация NumPy<\/td><td>50-200x<\/td><\/tr><\/table><p><b>Продакшен-совет:<\/b> если векторизация невозможна (сложная логика с состоянием), используйте <code>numba<\/code> с <code>@njit<\/code> — часто даёт прирост как у C без переписывания на C.<\/p>", "links": [{"title": "NumPy Performance Tips", "url": "https://numpy.org/doc/stable/user/basics.performance.html"}, {"title": "np.where docs", "url": "https://numpy.org/doc/stable/reference/generated/numpy.where.html"}, {"title": "Numba documentation", "url": "https://numba.readthedocs.io/en/stable/"}]}, {"title": "Индексация, срезы и булевы маски", "level": "🟢 Junior", "explanation": "<p>NumPy поддерживает несколько видов индексации, и путаница между ними — источник багов №1 у новичков.<\/p><ul><li><b>Базовая индексация<\/b> (срезы <code>a[1:3]<\/code>) возвращает <b>view<\/b> — изменение среза меняет исходный массив!<\/li><li><b>Fancy indexing<\/b> (список индексов <code>a[[0,2,4]]<\/code>) и <b>булевы маски<\/b> возвращают <b>copy<\/b>.<\/li><\/ul><pre><code>import numpy as np\na = np.arange(10)\nview = a[2:5]\nview[0] = 999\nprint(a)  # [0 1 999 3 4 5 6 7 8 9] -- изменился!\n\nmask = a > 5\nfiltered = a[mask]  # копия\nfiltered[0] = -1\nprint(a)  # исходный массив не изменился<\/code><\/pre><p>Комбинированная маска с логическими операторами требует скобок и побитовых операторов <code>&amp;<\/code>, <code>|<\/code>, а не <code>and<\/code>/<code>or<\/code>:<\/p><pre><code>a[(a > 2) &amp; (a < 8)]<\/code><\/pre><p><b>Типичная ошибка:<\/b> <code>ValueError: truth value of an array is ambiguous<\/code> — возникает при попытке использовать <code>and<\/code>/<code>or<\/code> на массивах.<\/p><p><b>Совет:<\/b> если нужна независимая копия — вызывайте <code>.copy()<\/code> явно, не полагайтесь на угадывание.<\/p>", "links": [{"title": "NumPy Indexing", "url": "https://numpy.org/doc/stable/user/basics.indexing.html"}, {"title": "NumPy Copies and Views", "url": "https://numpy.org/doc/stable/user/basics.copies.html"}, {"title": "Pandas Boolean Indexing", "url": "https://pandas.pydata.org/docs/user_guide/indexing.html#boolean-indexing"}]}, {"title": "DataFrame и Series — основы Pandas", "level": "🟢 Junior", "explanation": "<p><code>Series<\/code> — одномерный массив с индексом, <code>DataFrame<\/code> — таблица из Series с общим индексом. Это рабочая лошадка для 90% задач EDA.<\/p><pre><code>import pandas as pd\ndf = pd.DataFrame({\n    'name': ['Alice', 'Bob', 'Carl'],\n    'age': [25, 32, 28],\n    'city': ['NY', 'LA', 'NY']\n})\ndf.head()\ndf.info()          # типы колонок, пропуски\ndf.describe()       # статистика по числовым колонкам\ndf['age'].mean()\ndf.loc[df['city'] == 'NY', 'name']   # label-based\ndf.iloc[0:2, 1:3]                     # position-based<\/code><\/pre><p><b>Ключевое правило:<\/b> используйте <code>.loc<\/code> для меток и условий, <code>.iloc<\/code> для позиций. Смешивание — источник <code>SettingWithCopyWarning<\/code>.<\/p><pre><code># Плохо (может не сработать или дать warning)\ndf[df.age > 25]['city'] = 'Unknown'\n\n# Хорошо\ndf.loc[df.age > 25, 'city'] = 'Unknown'<\/code><\/pre><p><b>Совет:<\/b> цепочка индексаций (<code>df[...][...] = ...<\/code>) — почти всегда баг. Всегда используйте один <code>.loc<\/code>.<\/p>", "links": [{"title": "Pandas: 10 minutes to pandas", "url": "https://pandas.pydata.org/docs/user_guide/10min.html"}, {"title": "Pandas DataFrame docs", "url": "https://pandas.pydata.org/docs/reference/frame.html"}, {"title": "Pandas Indexing and Selecting Data", "url": "https://pandas.pydata.org/docs/user_guide/indexing.html"}]}, {"title": "Чтение и очистка данных", "level": "🟢 Junior", "explanation": "<p>Реальные данные почти никогда не бывают чистыми. Стандартный пайплайн: загрузка → профилирование → очистка.<\/p><pre><code>import pandas as pd\ndf = pd.read_csv('data.csv', dtype={'id': str}, parse_dates=['created_at'])\n\n# Профилирование\nprint(df.isna().sum())\nprint(df.duplicated().sum())\nprint(df.dtypes)\n\n# Очистка\ndf = df.drop_duplicates()\ndf['price'] = pd.to_numeric(df['price'], errors='coerce')\ndf['name'] = df['name'].str.strip().str.lower()\ndf = df[df['price'] > 0]  # фильтрация выбросов/невалидных значений<\/code><\/pre><ul><li><code>read_csv<\/code> с большими файлами — используйте <code>chunksize<\/code> или сразу <code>dtype<\/code>, чтобы не тратить память на автоопределение типов.<\/li><li><code>errors='coerce'<\/code> в <code>pd.to_numeric<\/code>/<code>pd.to_datetime<\/code> превращает мусор в <code>NaN<\/code> вместо падения — удобно для грязных данных.<\/li><\/ul><p><b>Типичная ошибка:<\/b> читать ID как <code>int<\/code>, теряя ведущие нули (например, почтовые индексы). Всегда явно указывайте <code>dtype=str<\/code> для идентификаторов.<\/p><p><b>Совет:<\/b> заведите функцию <code>profile_df(df)<\/code>, которая печатает shape, dtypes, na-счётчики и пример строк — экономит время на каждом новом датасете.<\/p>", "links": [{"title": "Pandas IO Tools (read_csv)", "url": "https://pandas.pydata.org/docs/user_guide/io.html"}, {"title": "Pandas Working with Missing Data", "url": "https://pandas.pydata.org/docs/user_guide/missing_data.html"}, {"title": "Pandas Data Cleaning Guide", "url": "https://pandas.pydata.org/docs/getting_started/intro_tutorials/07_reshape_table_layout.html"}]}, {"title": "GroupBy, merge и pivot_table", "level": "🟡 Middle", "explanation": "<p>Это ядро аналитики в Pandas — аналог <code>GROUP BY<\/code> и <code>JOIN<\/code> в SQL.<\/p><pre><code>import pandas as pd\n\n# GroupBy + агрегация\nresult = df.groupby('category').agg(\n    total_sales=('sales', 'sum'),\n    avg_price=('price', 'mean'),\n    n_orders=('order_id', 'count')\n).reset_index()\n\n# Merge (аналог SQL JOIN)\nmerged = pd.merge(orders, customers, on='customer_id', how='left')\n\n# Pivot table (аналог сводной таблицы Excel)\npivot = df.pivot_table(\n    index='region', columns='month', values='sales', aggfunc='sum', fill_value=0\n)<\/code><\/pre><table><tr><th>Pandas<\/th><th>SQL<\/th><\/tr><tr><td>merge(how='left')<\/td><td>LEFT JOIN<\/td><\/tr><tr><td>groupby().agg()<\/td><td>GROUP BY + агрегаты<\/td><\/tr><tr><td>pivot_table<\/td><td>CASE WHEN + GROUP BY<\/td><\/tr><\/table><p><b>Типичная ошибка:<\/b> merge без проверки количества строк до/после — при дублях по ключу можно случайно размножить строки (fan-out). Проверяйте <code>len(merged)<\/code> и используйте <code>validate='one_to_many'<\/code> и подобные параметры <code>merge()<\/code>.<\/p><p><b>Совет:<\/b> для сложных агрегаций с несколькими группировками используйте именованную агрегацию (<code>total_sales=('sales','sum')<\/code>) — читается однозначно.<\/p>", "links": [{"title": "Pandas GroupBy docs", "url": "https://pandas.pydata.org/docs/user_guide/groupby.html"}, {"title": "Pandas Merge, join, concatenate", "url": "https://pandas.pydata.org/docs/user_guide/merging.html"}, {"title": "Pandas Pivot tables", "url": "https://pandas.pydata.org/docs/user_guide/reshaping.html"}]}, {"title": "Работа с пропущенными значениями", "level": "🟡 Middle", "explanation": "<p>Пропуски (<code>NaN<\/code>, <code>None<\/code>, <code>NaT<\/code>) — не просто 'дырки', а сигнал о процессе сбора данных. Слепое <code>dropna()<\/code> может убить полезные данные.<\/p><pre><code>import pandas as pd\nimport numpy as np\n\ndf.isna().mean() * 100   # % пропусков по колонкам\n\n# Стратегии заполнения\ndf['age'] = df['age'].fillna(df['age'].median())\ndf['category'] = df['category'].fillna('unknown')\ndf['value'] = df.groupby('group')['value'].transform(\n    lambda s: s.fillna(s.mean())\n)\n\n# Интерполяция для временных рядов\ndf['temp'] = df['temp'].interpolate(method='linear')<\/code><\/pre><ul><li>Если пропусков &gt; 40-50% в колонке — часто разумнее удалить колонку, чем заполнять.<\/li><li>Для ML-моделей полезно добавить бинарный индикатор <code>is_missing<\/code> — сама пропущенность может быть предиктивным признаком.<\/li><\/ul><p><b>Типичная ошибка:<\/b> заполнять пропуски средним/медианой ПОСЛЕ train/test split неправильным образом — вычисляйте статистику только на train, иначе получите data leakage.<\/p><p><b>Совет:<\/b> документируйте, почему выбрана та или иная стратегия заполнения — это часть воспроизводимости эксперимента.<\/p>", "links": [{"title": "Pandas Missing Data guide", "url": "https://pandas.pydata.org/docs/user_guide/missing_data.html"}, {"title": "scikit-learn Imputation", "url": "https://scikit-learn.org/stable/modules/impute.html"}, {"title": "Data Leakage — Wikipedia", "url": "https://en.wikipedia.org/wiki/Leakage_(machine_learning)"}]}, {"title": "Категориальные данные и dtype category", "level": "🟡 Middle", "explanation": "<p>Тип <code>category<\/code> в Pandas хранит уникальные значения один раз плюс массив кодов — экономит память и ускоряет операции на колонках с малым числом уникальных значений.<\/p><pre><code>import pandas as pd\ndf['city'] = df['city'].astype('category')\nprint(df.memory_usage(deep=True))\n\n# Упорядоченные категории (важно для ML и сортировки)\nsize_order = pd.CategoricalDtype(\n    categories=['S', 'M', 'L', 'XL'], ordered=True\n)\ndf['size'] = df['size'].astype(size_order)\ndf.sort_values('size')  # сортировка по смыслу, не по алфавиту\n\n# One-hot encoding для моделей\npd.get_dummies(df, columns=['city'], drop_first=True)<\/code><\/pre><p><b>Когда использовать:<\/b> колонка с cardinality &lt; 50% от общего числа строк — кандидат на <code>category<\/code>. На датасете 10 млн строк с 20 уникальными городами экономия памяти может быть 10x.<\/p><p><b>Типичная ошибка:<\/b> присваивать новое значение категориальной колонке, которого нет в списке категорий — получите <code>NaN<\/code> вместо ошибки. Используйте <code>.cat.add_categories()<\/code> перед присвоением.<\/p><p><b>Совет:<\/b> для деревьев (XGBoost/LightGBM) можно передавать category-колонки напрямую, не делая one-hot — модели поддерживают нативную категориальную обработку.<\/p>", "links": [{"title": "Pandas Categorical data", "url": "https://pandas.pydata.org/docs/user_guide/categorical.html"}, {"title": "pandas.get_dummies docs", "url": "https://pandas.pydata.org/docs/reference/api/pandas.get_dummies.html"}, {"title": "LightGBM categorical features", "url": "https://lightgbm.readthedocs.io/en/latest/Advanced-Topics.html"}]}, {"title": "Работа с датами и временными рядами", "level": "🟡 Middle", "explanation": "<p>Тип <code>datetime64<\/code> и класс <code>DatetimeIndex<\/code> открывают мощные операции: ресемплинг, скользящие окна, работу с временными зонами.<\/p><pre><code>import pandas as pd\ndf['ts'] = pd.to_datetime(df['ts'], utc=True)\ndf = df.set_index('ts')\n\n# Ресемплинг: агрегация по дням\ndaily = df['sales'].resample('D').sum()\n\n# Скользящее окно (rolling)\ndf['sales_ma7'] = df['sales'].rolling(window=7).mean()\n\n# Извлечение компонентов\ndf['dayofweek'] = df.index.dayofweek\ndf['is_weekend'] = df.index.dayofweek >= 5\n\n# Сдвиг для лагов (важно в time series ML)\ndf['sales_lag1'] = df['sales'].shift(1)<\/code><\/pre><p><b>Типичная ошибка №1:<\/b> смешивать timezone-aware и naive datetime — операции упадут с <code>TypeError<\/code>. Всегда явно указывайте <code>utc=True<\/code> при парсинге разнородных источников.<\/p><p><b>Типичная ошибка №2 (утечка данных):<\/b> использовать <code>rolling<\/code> или статистику, включающую будущие значения, при построении признаков для прогнозирования — всегда проверяйте, что окно смотрит только назад (<code>closed='left'<\/code> при необходимости).<\/p><p><b>Совет:<\/b> для нерегулярных временных рядов используйте <code>asfreq<\/code> перед resample, чтобы явно увидеть пропущенные периоды.<\/p>", "links": [{"title": "Pandas Time series / date functionality", "url": "https://pandas.pydata.org/docs/user_guide/timeseries.html"}, {"title": "Pandas Window functions (rolling)", "url": "https://pandas.pydata.org/docs/user_guide/window.html"}, {"title": "Pandas resample docs", "url": "https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.resample.html"}]}, {"title": "SQL: JOIN и типы соединений", "level": "🟡 Middle", "explanation": "<p>ML/AI-инженер обязан свободно писать SQL — большинство фичей для моделей достаются из хранилищ данных через запросы, а не из CSV.<\/p><pre><code>SELECT o.order_id, c.name, o.amount\nFROM orders o\nINNER JOIN customers c ON o.customer_id = c.id\nWHERE o.created_at >= '2026-01-01';\n\n-- LEFT JOIN сохраняет все строки левой таблицы\nSELECT c.name, COUNT(o.order_id) AS n_orders\nFROM customers c\nLEFT JOIN orders o ON c.id = o.customer_id\nGROUP BY c.name;<\/code><\/pre><table><tr><th>JOIN<\/th><th>Поведение<\/th><\/tr><tr><td>INNER<\/td><td>только совпадающие строки<\/td><\/tr><tr><td>LEFT<\/td><td>все строки левой + NULL если нет пары<\/td><\/tr><tr><td>FULL OUTER<\/td><td>все строки обеих таблиц<\/td><\/tr><tr><td>CROSS<\/td><td>декартово произведение<\/td><\/tr><\/table><p><b>Типичная ошибка:<\/b> JOIN по колонке с дублями без понимания — количество строк в результате может неожиданно вырасти (fan-out), искажая суммы и средние. Всегда проверяйте <code>COUNT(*)<\/code> до и после.<\/p><p><b>Совет:<\/b> используйте <code>EXPLAIN ANALYZE<\/code>, чтобы понять, использует ли JOIN индекс — на больших таблицах разница может быть в 100x по времени.<\/p>", "links": [{"title": "PostgreSQL JOIN docs", "url": "https://www.postgresql.org/docs/current/tutorial-join.html"}, {"title": "SQL JOIN — Wikipedia", "url": "https://en.wikipedia.org/wiki/Join_(SQL)"}, {"title": "Mode SQL Tutorial: Joins", "url": "https://mode.com/sql-tutorial/sql-joins/"}]}, {"title": "SQL: оконные функции и агрегации", "level": "🔴 Senior", "explanation": "<p>Оконные функции (<code>OVER (...)<\/code>) позволяют считать агрегаты без схлопывания строк — незаменимы для ранжирования, скользящих метрик, накопительных сумм.<\/p><pre><code>SELECT\n  user_id,\n  order_date,\n  amount,\n  SUM(amount) OVER (\n    PARTITION BY user_id ORDER BY order_date\n    ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n  ) AS running_total,\n  RANK() OVER (PARTITION BY user_id ORDER BY amount DESC) AS rank_by_amount,\n  LAG(amount, 1) OVER (PARTITION BY user_id ORDER BY order_date) AS prev_amount\nFROM orders;<\/code><\/pre><ul><li><code>ROW_NUMBER()<\/code>, <code>RANK()<\/code>, <code>DENSE_RANK()<\/code> — различаются обработкой одинаковых значений.<\/li><li><code>LAG<\/code>/<code>LEAD<\/code> — доступ к соседним строкам без self-join, крайне полезно для построения фичей time-series прямо в БД.<\/li><li>CTE (<code>WITH ... AS (...)<\/code>) улучшают читаемость сложных запросов и позволяют переиспользовать промежуточные результаты.<\/li><\/ul><p><b>Типичная ошибка:<\/b> путать <code>WHERE<\/code> и <code>HAVING<\/code> с оконными функциями — оконные функции нельзя фильтровать в <code>WHERE<\/code> того же уровня запроса, нужен внешний <code>SELECT<\/code> или CTE с фильтром по alias.<\/p><p><b>Продакшен-совет:<\/b> оконные функции с большими <code>PARTITION BY<\/code> без индекса на колонке партиционирования могут быть узким местом — проверяйте план выполнения на объёмах, близких к боевым.<\/p>", "links": [{"title": "PostgreSQL Window Functions", "url": "https://www.postgresql.org/docs/current/tutorial-window.html"}, {"title": "PostgreSQL Window Functions Reference", "url": "https://www.postgresql.org/docs/current/functions-window.html"}, {"title": "Mode SQL Tutorial: Window Functions", "url": "https://mode.com/sql-tutorial/sql-window-functions/"}]}, {"title": "Polars как альтернатива Pandas", "level": "🔴 Senior", "explanation": "<p>Polars — DataFrame-библиотека на Rust с ленивым выполнением запросов (query optimization) и нативным параллелизмом. На больших датасетах (10M+ строк) даёт 5-30x ускорение против Pandas.<\/p><pre><code>import polars as pl\n\n# Eager API — похож на Pandas\ndf = pl.read_csv('data.csv')\nresult = (\n    df.filter(pl.col('amount') > 0)\n      .group_by('category')\n      .agg(pl.col('amount').sum().alias('total'))\n)\n\n# Lazy API — оптимизатор строит план выполнения\nlazy_result = (\n    pl.scan_csv('big_data.csv')\n      .filter(pl.col('amount') > 0)\n      .group_by('category')\n      .agg(pl.col('amount').sum())\n      .collect()  # выполнение только здесь\n)<\/code><\/pre><table><tr><th>Критерий<\/th><th>Pandas<\/th><th>Polars<\/th><\/tr><tr><td>Параллелизм<\/td><td>однопоточный (в основном)<\/td><td>многопоточный из коробки<\/td><\/tr><tr><td>Ленивые вычисления<\/td><td>нет<\/td><td>да (lazy API)<\/td><\/tr><tr><td>Экосистема<\/td><td>огромная<\/td><td>растёт быстро<\/td><\/tr><\/table><p><b>Когда выбирать Polars:<\/b> ETL-пайплайны на десятках гигабайт, где Pandas упирается в память или скорость. Для небольших исследовательских ноутбуков Pandas часто удобнее из-за экосистемы (seaborn, statsmodels и т.д. заточены под него).<\/p><p><b>Совет:<\/b> Polars поддерживает выгрузку в Pandas (<code>.to_pandas()<\/code>) — можно использовать гибридный подход: тяжёлый ETL на Polars, финальный анализ на Pandas.<\/p>", "links": [{"title": "Polars User Guide", "url": "https://docs.pola.rs/"}, {"title": "Polars API Reference", "url": "https://docs.pola.rs/api/python/stable/reference/index.html"}, {"title": "Polars vs Pandas", "url": "https://docs.pola.rs/user-guide/migration/pandas/"}]}, {"title": "Память и производительность Pandas", "level": "🔴 Senior", "explanation": "<p>Pandas по умолчанию не оптимизирован под память: <code>int64<\/code>/<code>float64<\/code> используются везде, строки хранятся как Python-объекты (накладные расходы на объект).<\/p><pre><code>import pandas as pd\n\ndf.info(memory_usage='deep')\n\n# Downcasting числовых типов\ndf['id'] = pd.to_numeric(df['id'], downcast='integer')\ndf['price'] = pd.to_numeric(df['price'], downcast='float')\n\n# category вместо object для строк с малым cardinality\nfor col in df.select_dtypes('object').columns:\n    if df[col].nunique() / len(df) < 0.5:\n        df[col] = df[col].astype('category')\n\n# Чтение по чанкам для файлов, не влезающих в память\nchunks = pd.re
