честве на положительном классе, лучше PR-AUC", "ROC-AUC требует GPU для расчёта", "ROC-AUC применим только к регрессии"], "answer": 1, "explain": "При сильном дисбалансе (0.1% мошенничества) PR-AUC честнее отражает качество модели на редком положительном классе."}, {"q": "Какова роль retrieval-этапа в RAG-архитектуре чат-бота?", "options": ["Генерировать финальный текст ответа", "Находить релевантные фрагменты контекста для передачи в промпт LLM", "Обучать LLM с нуля", "Заменять векторную базу данных на SQL"], "answer": 1, "explain": "Retrieval находит топ-k релевантных чанков документов, которые затем передаются в промпт для генерации ответа, снижая галлюцинации."}, {"q": "Почему для latency важнее смотреть на p99, а не на среднее значение?", "options": ["Среднее значение вообще нельзя измерить", "p99 отражает худший опыт значимой доли пользователей, который среднее скрывает", "p99 всегда меньше среднего", "Это требование только для мобильных приложений"], "answer": 1, "explain": "Средняя latency может быть низкой, но 1% медленных запросов (p99) реально портит пользовательский опыт и часто указывает на проблему инфраструктуры."}, {"q": "Какой подход к cost-оптимизации ML-инфраструктуры корректен?", "options": ["Всегда использовать самые мощные GPU для любых задач", "Использовать spot-инстансы для обучения и right-sizing ресурсов под задачу", "Отказаться от мониторинга затрат", "Хранить все модели без квантизации для лучшей точности"], "answer": 1, "explain": "Spot-инстансы для обучения и подбор ресурсов под реальную нагрузку — стандартные практики снижения расходов без потери качества."}, {"q": "Что важно проверить при аудите ML-модели на этичность?", "options": ["Только общую точность модели", "Наличие скрытых прокси-признаков, коррелирующих с защищёнными атрибутами (раса, пол)", "Скорость инференса модели", "Размер обучающего датасета в гигабайтах"], "answer": 1, "explain": "Модель может быть точной в среднем, но дискриминировать по прокси-признакам (например, район проживания), унаследованным от исторических данных."}, {"q": "Что отличает Senior ML-инженера от Middle согласно роадмапу роста?", "options": ["Только больший стаж работы", "Способность проектировать системы с учётом бизнес-trade-off'ов и влиять на roadmap команды", "Умение писать больше кода в день", "Знание большего числа языков программирования"], "answer": 1, "explain": "Переход на Senior измеряется масштабом ответственности и уровнем неопределённости, с которым инженер справляется самостоятельно, а не только техническими навыками."}], "id": 17, "pi": 4}, {"phase": "Phase 5 — MLOps & Production", "section": "💡 Фишки и лайфхаки", "topics": [{"title": "Ускорение pandas в 10 раз", "level": "🟡 Middle", "explanation": "<p>Классический pandas часто становится узким местом на больших датафреймах, но простые приёмы дают ускорение в разы без смены библиотеки.<\/p><ul><li>Используй <code>dtype<\/code> явно: <code>category<\/code> для строковых колонок с малым числом уникальных значений экономит память в разы.<\/li><li>Векторизация вместо <code>.apply()<\/code> и уж тем более циклов <code>for<\/code> — операции над колонками целиком в разы быстрее.<\/li><li><code>df.query()<\/code> и <code>eval()<\/code> используют numexpr под капотом и ускоряют арифметику на больших таблицах.<\/li><li>Читай CSV с <code>usecols<\/code>, <code>dtype<\/code> и <code>chunksize<\/code>, чтобы не грузить лишнее в память.<\/li><li>Для по-настоящему больших данных переключайся на <b>Polars<\/b> (Rust, ленивые вычисления, мультипоточность из коробки) или <b>DuckDB<\/b> для SQL-запросов прямо по parquet-файлам.<\/li><\/ul><pre><code># было медленно\ndf['x2'] = df['x'].apply(lambda v: v ** 2)\n# стало быстро\ndf['x2'] = df['x'] ** 2<\/code><\/pre><p>Профилируй перед оптимизацией: <code>%timeit<\/code> в Jupyter или <code>line_profiler<\/code> покажут реальное узкое место.<\/p>", "links": [{"title": "Pandas: Enhancing performance", "url": "https://pandas.pydata.org/docs/user_guide/enhancingperf.html"}, {"title": "Polars — User Guide", "url": "https://docs.pola.rs/"}, {"title": "DuckDB documentation", "url": "https://duckdb.org/docs/"}]}, {"title": "Отладка CUDA Out Of Memory", "level": "🟡 Middle", "explanation": "<p>OOM на GPU — один из самых частых практических факапов при обучении моделей. Есть проверенный чек-лист диагностики и починки.<\/p><ul><li>Первым делом смотри <code>nvidia-smi<\/code> — сколько памяти реально занято и кем (иногда это зомби-процесс от прошлого запуска).<\/li><li>Уменьши <code>batch_size<\/code> и компенсируй через <code>gradient_accumulation_steps<\/code> — эффективный батч не меняется, память падает.<\/li><li>Включи <b>mixed precision<\/b> (<code>torch.cuda.amp<\/code> или <code>bf16<\/code>) — экономия памяти почти в 2 раза.<\/li><li><b>Gradient checkpointing<\/b> обменивает вычисления на память — критично для трансформеров.<\/li><li>Чисти кэш аккуратно: <code>torch.cuda.empty_cache()<\/code> не освобождает память ОС, а лишь дефрагментирует пул PyTorch.<\/li><li>Используй <code>torch.cuda.memory_summary()<\/code> для точной картины по аллокациям.<\/li><\/ul><pre><code>import torch\nprint(torch.cuda.memory_summary())\ntorch.cuda.empty_cache()<\/code><\/pre><p>Если модель не влезает даже в batch_size=1 — нужен offloading (DeepSpeed ZeRO, accelerate) или квантизация весов.<\/p>", "links": [{"title": "PyTorch: Memory management", "url": "https://pytorch.org/docs/stable/notes/cuda.html#memory-management"}, {"title": "HuggingFace: Efficient training on a single GPU", "url": "https://huggingface.co/docs/transformers/perf_train_gpu_one"}, {"title": "DeepSpeed ZeRO", "url": "https://www.deepspeed.ai/tutorials/zero/"}]}, {"title": "Seed и воспроизводимость экспериментов", "level": "🟢 Junior", "explanation": "<p>Без фиксации сидов результаты экспериментов не воспроизводятся, а сравнение моделей превращается в гадание. Нужно зафиксировать рандом на всех уровнях.<\/p><ul><li>Python, NumPy, PyTorch/TensorFlow имеют независимые генераторы случайных чисел — фиксируй каждый.<\/li><li>На GPU полная детерминированность требует отключения некоторых оптимизаций cuDNN (жертвуешь скоростью ради воспроизводимости).<\/li><li>DataLoader с несколькими воркерами тоже нужно детерминировать через <code>worker_init_fn<\/code>.<\/li><li>Помимо сида, фиксируй версии библиотек (<code>requirements.txt<\/code> / <code>poetry.lock<\/code>) и данные (хэш датасета или DVC).<\/li><\/ul><pre><code>import random, numpy as np, torch\n\ndef set_seed(seed=42):\n    random.seed(seed)\n    np.random.seed(seed)\n    torch.manual_seed(seed)\n    torch.cuda.manual_seed_all(seed)\n    torch.backends.cudnn.deterministic = True\n    torch.backends.cudnn.benchmark = False<\/code><\/pre><p>Полная бит-в-бит воспроизводимость на GPU почти недостижима из-за недетерминированных ядер — фиксируйся на «воспроизводимость метрик в пределах погрешности».<\/p>", "links": [{"title": "PyTorch: Reproducibility", "url": "https://pytorch.org/docs/stable/notes/randomness.html"}, {"title": "scikit-learn: Controlling randomness", "url": "https://scikit-learn.org/stable/common_pitfalls.html#controlling-randomness"}, {"title": "DVC — Data Version Control", "url": "https://dvc.org/doc"}]}, {"title": "Быстрый прототип на Streamlit / Gradio", "level": "🟢 Junior", "explanation": "<p>Чтобы показать модель заказчику или коллеге, не нужен фронтенд-разработчик — Streamlit и Gradio позволяют собрать демо за 15 минут.<\/p><ul><li><b>Streamlit<\/b> — декларативный подход, весь скрипт перерисовывается сверху вниз при каждом взаимодействии, удобен для дашбордов и multi-page приложений.<\/li><li><b>Gradio<\/b> — заточен под ML-демо конкретной функции (вход → выход), одной строкой деплоится в HuggingFace Spaces с публичной ссылкой.<\/li><li>Кэшируй тяжёлые операции: <code>@st.cache_resource<\/code> для загрузки модели, чтобы она не переинициализировалась на каждый клик.<\/li><li>Для быстрого шаринга без деплоя используй <code>gr.Interface(...).launch(share=True)<\/code> — временная публичная ссылка на 72 часа.<\/li><\/ul><pre><code>import gradio as gr\n\ndef predict(text):\n    return model(text)\n\ngr.Interface(fn=predict, inputs=\"text\", outputs=\"label\").launch(share=True)<\/code><\/pre><p>Для продакшена такие демо не годятся — там нужен настоящий бэкенд с очередями и мониторингом, но для validation идеи это золотой стандарт.<\/p>", "links": [{"title": "Streamlit docs", "url": "https://docs.streamlit.io/"}, {"title": "Gradio docs", "url": "https://www.gradio.app/docs"}, {"title": "HuggingFace Spaces", "url": "https://huggingface.co/docs/hub/spaces"}]}, {"title": "Дешёвый GPU: Colab, Kaggle, vast.ai", "level": "🟢 Junior", "explanation": "<p>Не обязательно покупать GPU или платить за AWS по полной цене — есть проверенные способы получить вычисления дёшево или бесплатно.<\/p><ul><li><b>Google Colab<\/b> — бесплатный T4 с ограничениями по времени сессии, Colab Pro/Pro+ даёт A100/L4 и дольше держит сессию.<\/li><li><b>Kaggle Notebooks<\/b> — 30 часов GPU в неделю бесплатно (P100/T4x2), плюс бесплатный TPU.<\/li><li><b>vast.ai<\/b> и <b>RunPod<\/b> — маркетплейсы GPU от частных владельцев, в разы дешевле AWS/GCP, но менее надёжны (spot-инстансы могут прерваться).<\/li><li><b>Lambda Labs<\/b> — специализированные ML-инстансы по конкурентной цене.<\/li><li>Всегда сохраняй чекпоинты на внешнее хранилище (Google Drive, S3, HF Hub) — spot-инстанс может исчезнуть в любой момент.<\/li><\/ul><pre><code># быстрый маунт Google Drive в Colab\nfrom google.colab import drive\ndrive.mount('/content/drive')<\/code><\/pre><p>Для долгих экспериментов считай total cost of ownership: дешёвый GPU с частыми обрывами может выйти дороже из-за потерянного времени на перезапуски.<\/p>", "links": [{"title": "Google Colab", "url": "https://colab.research.google.com/"}, {"title": "Kaggle Notebooks docs", "url": "https://www.kaggle.com/docs/notebooks"}, {"title": "vast.ai", "url": "https://vast.ai/"}]}, {"title": "Кэширование эмбеддингов", "level": "🟡 Middle", "explanation": "<p>Пересчёт эмбеддингов одних и тех же текстов на каждый запрос — типичная растрата денег и времени. Кэш решает это элегантно.<\/p><ul><li>Хэшируй входной текст (например, SHA-256) и используй как ключ в key-value хранилище (Redis, SQLite, локальный dict).<\/li><li>Для RAG-систем эмбеддинги документов кэшируй навсегда — пересчитывай только при изменении контента (сверяй хэш чанка).<\/li><li>Векторные БД (Chroma, Qdrant, pgvector) сами являются постоянным кэшем — не пересоздавай индекс с нуля при каждом запуске.<\/li><li>Для LLM-эмбеддингов через API (OpenAI, Cohere) кэш экономит реальные деньги при повторяющихся запросах в дев-цикле.<\/li><\/ul><pre><code>import hashlib, functools\n\n@functools.lru_cache(maxsize=10000)\ndef embed_cached(text: str):\n    return embedding_model.encode(text)\n\n# для персистентности между запусками — на диск\nkey = hashlib.sha256(text.encode()).hexdigest()<\/code><\/pre><p>Помни про инвалидацию: если сменил модель эмбеддингов, версионируй ключи кэша (добавь имя модели в хэш), иначе получишь несовместимые вектора.<\/p>", "links": [{"title": "LangChain: CacheBackedEmbeddings", "url": "https://python.langchain.com/docs/how_to/caching_embeddings/"}, {"title": "Redis as a vector database", "url": "https://redis.io/docs/latest/develop/get-started/vector-database/"}, {"title": "Qdrant documentation", "url": "https://qdrant.tech/documentation/"}]}, {"title": "Промпт-паттерны, которые реально работают", "level": "🟡 Middle", "explanation": "<p>Есть небольшой набор промпт-техник, которые многократно подтверждены на практике и в статьях, в отличие от «магических» формулировок из соцсетей.<\/p><ul><li><b>Few-shot<\/b> — 2-5 качественных примеров формата ввода-вывода почти всегда лучше нуля примеров.<\/li><li><b>Chain-of-Thought<\/b> — просьба «рассуждай пошагово» заметно улучшает точность на задачах с логикой и арифметикой.<\/li><li><b>Явная структура вывода<\/b> — задавай JSON-схему или XML-теги, это снижает вариативность и упрощает парсинг.<\/li><li><b>Разделение ролей<\/b> — system-промпт для правил поведения, user — для задачи, это снижает prompt injection и путаницу.<\/li><li><b>Self-consistency<\/b> — несколько независимых генераций + голосование повышает надёжность на сложных задачах.<\/li><\/ul><pre><code>SYSTEM: Ты отвечаешь только валидным JSON по схеме {\"answer\": str, \"confidence\": float}.\nUSER: Реши задачу пошагово, затем выведи финальный JSON.<\/code><\/pre><p>Избегай культа «идеального промпта» — для продакшена важнее eval-датасет, на котором можно объективно сравнить варианты промптов.<\/p>", "links": [{"title": "Anthropic: Prompt engineering overview", "url": "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview"}, {"title": "OpenAI: Prompt engineering guide", "url": "https://platform.openai.com/docs/guides/prompt-engineering"}, {"title": "Chain-of-Thought Prompting (Wei et al., 2022)", "url": "https://arxiv.org/abs/2201.11903"}]}, {"title": "Экономия на API-токенах LLM", "level": "🟡 Middle", "explanation": "<p>Счета за LLM API растут быстро при масштабировании — есть набор практических приёмов снижения расходов без потери качества.<\/p><ul><li><b>Prompt caching<\/b> (Anthropic, OpenAI) — повторяющийся системный промпт или контекст кэшируется провайдером и стоит в разы дешевле.<\/li><li>Выбирай модель под задачу: не гоняй простую классификацию через флагманскую модель — маленькие модели (Haiku, GPT-4o-mini) справляются дешевле и быстрее.<\/li><li>Сокращай контекст: обрезай историю диалога, суммаризируй старые сообщения вместо хранения полного лога.<\/li><li>Батчинг через Batch API (скидка до 50%) для несрочных офлайн-задач.<\/li><li>Считай токены заранее через токенайзер (<code>tiktoken<\/code>, <code>anthropic.count_tokens<\/code>), чтобы не превышать бюджет на этапе разработки промпта.<\/li><\/ul><pre><code>import tiktoken\nenc = tiktoken.encoding_for_model(\"gpt-4o\")\nprint(len(enc.encode(prompt)))<\/code><\/pre><p>Мониторь стоимость по фичам, а не только по общему счёту — часто 90% расходов даёт одна неоптимальная фича (например, полное сканирование документа при каждом запросе).<\/p>", "links": [{"title": "Anthropic: Prompt caching", "url": "https://docs.anthropic.com/en/docs/build-with-claude/prompt-caching"}, {"title": "OpenAI: Batch API", "url": "https://platform.openai.com/docs/guides/batch"}, {"title": "tiktoken (OpenAI tokenizer)", "url": "https://github.com/openai/tiktoken"}]}, {"title": "Малоизвестные хаки Hugging Face", "level": "🟡 Middle", "explanation": "<p>Экосистема HF гораздо богаче, чем базовый <code>pipeline()<\/code> — знание нескольких трюков экономит часы работы.<\/p><ul><li><code>device_map=\"auto\"<\/code> в <code>from_pretrained<\/code> автоматически распределяет слои модели между GPU/CPU, если модель не влезает целиком.<\/li><li><code>datasets<\/code> с <code>streaming=True<\/code> позволяет работать с датасетами в терабайты без скачивания на диск.<\/li><li><code>accelerate estimate-memory<\/code> заранее покажет, сколько памяти потребует модель до попытки загрузки.<\/li><li>Загрузка в 4/8-бит через <code>bitsandbytes<\/code> (<code>load_in_4bit=True<\/code>) сжимает большие модели в разы для инференса на потребительском GPU.<\/li><li>HF Hub умеет версионировать модели и датасеты через git-подобные revisions — можно закрепиться на конкретном коммите модели для воспроизводимости.<\/li><\/ul><pre><code>from transformers import AutoModelForCausalLM\n\nmodel = AutoModelForCausalLM.from_pretrained(\n    \"model_name\", device_map=\"auto\", load_in_4bit=True\n)<\/code><\/pre><p>Проверяй лицензии моделей на Hub — не все permissive, некоторые запрещают коммерческое использование.<\/p>", "links": [{"title": "HuggingFace: Big model inference", "url": "https://huggingface.co/docs/accelerate/usage_guides/big_modeling"}, {"title": "HuggingFace: Quantization with bitsandbytes", "url": "https://huggingface.co/docs/transformers/quantization/bitsandbytes"}, {"title": "HuggingFace: Streaming datasets", "url": "https://huggingface.co/docs/datasets/stream"}]}, {"title": "Малоизвестные возможности scikit-learn", "level": "🟡 Middle", "explanation": "<p>Многие используют sklearn только для <code>fit/predict<\/code>, упуская мощные встроенные инструменты для продакшн-пайплайнов.<\/p><ul><li><code>Pipeline<\/code> + <code>ColumnTransformer<\/code> объединяют препроцессинг и модель в один сериализуемый объект — предотвращает data leakage и упрощает деплой.<\/li><li><code>class_weight=\"balanced\"<\/code> автоматически компенсирует дисбаланс классов без ручного oversampling.<\/li><li><code>HalvingGridSearchCV<\/code> — успешный последовательный отбор гиперпараметров, кратно быстрее полного <code>GridSearchCV<\/code>.<\/li><li><code>partial_fit<\/code> у ряда моделей (SGD, MiniBatchKMeans) позволяет обучаться на потоке данных, не помещающихся в память.<\/li><li><code>set_config(transform_output=\"pandas\")<\/code> заставляет трансформеры возвращать DataFrame вместо numpy-массива — удобно для отладки.<\/li><\/ul><pre><code>from sklearn.pipeline import Pipeline\nfrom sklearn.compose import ColumnTransformer\n\npipe = Pipeline([\n    (\"prep\", ColumnTransformer([...])),\n    (\"model\", RandomForestClassifier(class_weight=\"balanced\"))\n])\npipe.fit(X_train, y_train)<\/code><\/pre><p>Сохраняй весь Pipeline через <code>joblib.dump<\/code> — это гарантирует, что препроцессинг в проде идентичен обучению.<\/p>", "links": [{"title": "scikit-learn: Pipelines and composite estimators", "url": "https://scikit-learn.org/stable/modules/compose.html"}, {"title": "scikit-learn: Tuning the hyper-parameters", "url": "https://scikit-learn.org/stable/modules/grid_search.html"}, {"title": "scikit-learn: set_output API", "url": "https://scikit-learn.org/stable/auto_examples/miscellaneous/plot_set_output.html"}]}, {"title": "Инструменты продуктивности: ruff, pre-commit, nbdev", "level": "🟢 Junior", "explanation": "<p>Правильно настроенные инструменты автоматизации экономят часы код-ревью и ловят баги до пуша.<\/p><ul><li><b>ruff<\/b> — линтер и форматтер на Rust, заменяет flake8 + isort + часть black, работает в 10-100 раз быстрее аналогов.<\/li><li><b>pre-commit<\/b> — фреймворк git-хуков: автоматически прогоняет линтеры, форматтеры и проверки секретов перед каждым коммитом.<\/li><li><b>nbdev<\/b> — превращает Jupyter-ноутбуки в полноценный python-пакет с тестами и документацией, решая проблему «грязных» ноутбуков в продакшене.<\/li><li><b>nbstripout<\/b> — убирает output-ячейки из ноутбуков перед коммитом, чтобы не засорять git-историю бинарными diff'ами.<\/li><\/ul><pre><code># .pre-commit-config.yaml\nrepos:\n  - repo: https://github.com/astral-sh/ruff-pre-commit\n    rev: v0.6.0\n    hooks:\n      - id: ruff\n        args: [--fix]<\/code><\/pre><p>Настрой эти инструменты один раз в шаблоне проекта (cookiecutter) — и каждый новый ML-репозиторий будет чистым с первого коммита.<\/p>", "links": [{"title": "Ruff documentation", "url": "https://docs.astral.sh/ruff/"}, {"title": "pre-commit.com", "url": "https://pre-commit.com/"}, {"title": "nbdev by fast.ai", "url": "https://nbdev.fast.ai/"}]}, {"title": "Как быстро читать чужие ML-репозитории", "level": "🔴 Senior", "explanation": "<p>Умение быстро разобраться в незнакомом ML-репозитории (research code, opensource либа) — навык, который сильно ускоряет работу senior-инженера.<\/p><ul><li>Начинай с <code>README<\/code> и <code>train.py<\/code>/<code>main.py<\/code> — точки входа сразу показывают архитектуру пайплайна.<\/li><li>Найди файл конфигурации (YAML/Hydra) — он часто описывает весь пайплайн декларативно лучше любого README.<\/li><li>Ищи класс модели через grep по <code>nn.Module<\/code> или <code>forward(<\/code> — это ядро репозитория.<\/li><li>Смотри на тесты (если есть) — они лучший источник примеров использования API.<\/li><li>Используй граф зависимостей IDE (Go to definition / Find references) вместо линейного чтения файлов сверху вниз.<\/li><li>Запусти код на минимальном примере (toy dataset) под дебаггером — трассировка вызовов быстрее статического чтения.<\/li><\/ul><pre><code># быстро найти определение модели\ngrep -rn \"class.*nn.Module\" src/<\/code><\/pre><p>Не пытайся понять 100% кода сразу — определи «горячий путь» (forward pass + loss) и разбирайся вглубь только там, где это нужно для твоей задачи.<\/p>", "links": [{"title": "Karpathy: A Recipe for Training Neural Networks", "url": "https://karpathy.github.io/2019/04/25/recipe/"}, {"title": "Hydra — configuration framework", "url": "https://hydra.cc/docs/intro/"}, {"title": "Papers with Code", "url": "https://paperswithcode.com/"}]}, {"title": "Как быстро читать arxiv-статьи", "level": "🟡 Middle", "explanation": "<p>ML-инженеру приходится просматривать десятки статей в неделю — линейное чтение от начала до конца не масштабируется.<\/p><ul><li>Метод трёх проходов: 1) заголовок, абстракт, выводы, рисунки — 5 минут; 2) введение и заключение целиком, остальное бегло — 15 минут; 3) полное вдумчивое чтение только если статья прошла первые два фильтра.<\/li><li>Сначала смотри на рисунки и таблицы результатов — часто это даёт 80% сути статьи без чтения текста.<\/li><li>Проверяй раздел Limitations/Related Work — там честно написано, чем метод хуже конкурентов.<\/li><li>Используй ArXiv Sanity, Semantic Scholar или ChatPaper для быстрого саммари и поиска связанных работ.<\/li><li>Следи не за отдельными статьями, а за авторами и лабораториями, которые стабильно выпускают качественные работы в твоей нише.<\/li><\/ul><p>Держи личную базу заметок (Notion/Obsidian) с однострочным summary каждой прочитанной статьи — это окупается уже через месяц активного чтения.<\/p>", "links": [{"title": "How to Read a Paper (S. Keshav)", "url": "https://web.stanford.edu/class/cs224n/readings/how_to_read_a_paper.pdf"}, {"title": "Semantic Scholar", "url": "https://www.semanticscholar.org/"}, {"title": "arxiv-sanity-lite (Karpathy)", "url": "https://github.com/karpathy/arxiv-sanity-lite"}]}, {"title": "Профилирование и бенчмаркинг ML-кода", "level": "🔴 Senior", "explanation": "<p>Оптимизация вслепую — трата времени. Прежде чем ускорять код, нужно точно измерить, где узкое место: данные, GPU-compute или Python-оверхед.<\/p><ul><li><code>torch.profiler<\/code> показывает время по операциям и загрузку GPU/CPU с визуализацией в TensorBoard.<\/li><li><code>py-spy<\/code> позволяет профилировать работающий процесс без изменения кода, включая C-расширения.<\/li><li>Проверяй GPU utilization через <code>nvidia-smi dmon<\/code> — если она стабильно ниже 80%, узкое место чаще всего в DataLoader (I/O или препроцессинг на CPU).<\/li><li>Увеличение <code>num_workers<\/code> и <code>pin_memory=True<\/code> в DataLoader часто даёт больше прироста, чем оптимизация самой модели.<\/li><li>Всегда сравнивай до/после на одинаковом железе и фиксированном сиде — иначе шум измерений исказит выводы.<\/li><\/ul><pre><code>from torch.profiler import profile, ProfilerActivity\n\nwith profile(activities=[ProfilerActivity.CPU, ProfilerActivity.CUDA]) as prof:\n    model(inputs)\nprint(prof.key_averages().table(sort_by=\"cuda_time_total\"))<\/code><\/pre><p>Правило: сначала профилируй, потом оптимизируй — иначе легко потратить день на ускорение кода, который занимает 2% времени выполнения.<\/p>", "links": [{"title": "PyTorch Profiler", "url": "https://pytorch.org/tutorials/recipes/recipes/profiler_recipe.html"}, {"title": "py-spy", "url": "https://github.com/benfred/py-spy"}, {"title": "PyTorch: Data loading best practices", "url": "https://pytorch.org/docs/stable/data.html#data-loading-order-and-sampler"}]}], "quiz": [{"q": "Что даёт наибольший практический выигрыш при ускорении pandas-кода на больших данных?", "options": ["Замена print на logging", "Векторизация вместо .apply() и циклов", "Увеличение количества комментариев", "Импорт pandas дважды"], "answer": 1, "explain": "Векторные операции над колонками используют оптимизированный C-код под капотом и на порядки быстрее построчных .apply() и циклов."}, {"q": "Какой приём НЕ помогает при ошибке CUDA Out Of Memory?", "options": ["Уменьшение batch_size с gradient accumulation", "Включение mixed precision (fp16/bf16)", "Увеличение learning rate в 10 раз", "Gradient checkpointing"], "answer": 2, "explain": "Learning rate влияет на сходимость обучения, но никак не связан с потреблением памяти GPU."}, {"q": "Почему полная бит-в-бит воспроизводимость на GPU часто недостижима даже при фиксации всех сидов?", "options": ["GPU не поддерживает float32", "Некоторые ядра cuDNN недетерминированы по умолчанию", "Python не умеет фиксировать сиды", "NumPy не связан с PyTorch"], "answer": 1, "explain": "Часть CUDA/cuDNN операций использует недетерминированные алгоритмы ради скорости; для полной детерминированности их нужно явно отключать, жертвуя производительностью."}, {"q": "Чем Gradio принципиально отличается от Streamlit в типичном сценарии использования?", "options": ["Gradio требует обязательной оплаты", "Gradio заточен под демо функции вход→выход и легко деплоится в HF Spaces", "Streamlit не поддерживает Python", "Gradio не умеет работать с текстом"], "answer": 1, "explain": "Gradio исторически специализирован на быстрых ML-демо одной функции с готовой интеграцией в Hugging Face Spaces, тогда как Streamlit лучше подходит для многостраничных дашбордов."}, {"q": "Какой сервис даёт около 30 часов бесплатного GPU в неделю без подписки?", "options": ["AWS EC2", "Kaggle Notebooks", "Azure ML Studio Enterprise", "vast.ai по умолчанию"], "answer": 1, "explain": "Kaggle предоставляет бесплатную квоту GPU/TPU часов в неделю без необходимости оплаты, в отличие от AWS и Azure."}, {"q": "Зачем при кэшировании эмбеддингов включать имя модели в ключ кэша?", "options": ["Это требование лицензии", "Чтобы ускорить хэширование текста", "Чтобы избежать использования несовместимых векторов от разных моделей", "Так требует Redis"], "answer": 2, "explain": "Эмбеддинги разных моделей несовместимы по размерности и семантике пространства, поэтому смена модели без версионирования ключа приведёт к тихим ошибкам."}, {"q": "Что из перечисленного является подтверждённой практикой, а не мифом о промптинге?", "options": ["Обещание чаевых модели повышает точность на 100%", "Chain-of-Thought инструкция улучшает результаты на задачах с рассуждением", "Промпт должен быть написан заглавными буквами", "Длина промпта всегда прямо пропорциональна качеству"], "answer": 1, "explain": "Chain-of-Thought prompting подтверждён исследованиями (Wei et al., 2022) как эффективный способ улучшить точность на задачах, требующих пошагового рассуждения."}, {"q": "Какой механизм провайдеров LLM API позволяет заметно снизить стоимость при повторяющемся системном промпте?", "options": ["Batch API исключительно для realtime задач", "Prompt caching", "Увеличение temperature", "Отключение stop-последовательностей"], "answer": 1, "explain": "Prompt caching позволяет провайдеру переиспользовать вычисления для неизменной части промпта, снижая стоимость и задержку повторных запросов."}, {"q": "Для чего нужен параметр device_map=\"auto\" в HuggingFace transformers?", "options": ["Автоматически подбирает learning rate", "Автоматически распределяет слои модели между доступными GPU/CPU при нехватке памяти", "Включает квантизацию по умолчанию", "Меняет токенайзер модели"], "answer": 1, "explain": "device_map=\"auto\" использует accelerate для распределения слоёв большой модели по доступным устройствам, если она не помещается целиком в одну видеокарту."}, {"q": "Какой инструмент из экосистемы sklearn/линтеров написан на Rust и заметно быстрее классических аналогов?", "options": ["flake8", "black", "ruff", "isort"], "answer": 2, "explain": "Ruff написан на Rust и совмещает функциональность flake8, isort и части black, работая на порядки быстрее чисто-питоновских линтеров."}], "id": 18, "pi": 4}, {"phase": "Phase 5 — MLOps & Production", "section": "⚔️ Сравнение моделей", "topics": [{"title": "Классические алгоритмы: линейные модели vs деревья vs kNN vs SVM", "level": "🟢 Junior", "explanation": "<p>Прежде чем тащить нейросеть, стоит понимать, когда классика выигрывает. Выбор зависит от размера данных, интерпретируемости и характера границ решений.<\/p><table><tr><th>Алгоритм<\/th><th>Точность<\/th><th>Скорость<\/th><th>Интерпретируемость<\/th><th>Данные<\/th><\/tr><tr><td>Линейная/логистическая регрессия<\/td><td>средняя<\/td><td>очень высокая<\/td><td>высокая<\/td><td>линейно разделимые<\/td><\/tr><tr><td>Деревья решений<\/td><td>средняя<\/td><td>высокая<\/td><td>высокая<\/td><td>табличные, нелинейные<\/td><\/tr><tr><td>kNN<\/td><td>средняя-высокая<\/td><td>низкая (inference)<\/td><td>низкая<\/td><td>малые/средние выборки<\/td><\/tr><tr><td>SVM<\/td><td>высокая<\/td><td>средняя<\/td><td>низкая<\/td><td>малые, high-dim<\/td><\/tr><\/table><p>Правило большого пальца: начинайте с <code>LogisticRegression<\/code> как baseline, затем сравнивайте с деревьями/ансамблями.<\/p><pre><code>from sklearn.linear_model import LogisticRegression\nfrom sklearn.tree import DecisionTreeClassifier\nbaseline = LogisticRegression().fit(X_train, y_train)<\/code><\/pre><ul><li>Линейные модели — быстрый baseline и легко объяснить бизнесу<\/li><li>Деревья — нелинейные зависимости без масштабирования признаков<\/li><li>kNN/SVM — хороши на малых датасетах, плохо масштабируются<\/li><\/ul>", "links": [{"title": "scikit-learn: Choosing the right estimator", "url": "https://scikit-learn.org/stable/machine_learning_map.html"}, {"title": "An Introduction to Statistical Learning (книга)", "url": "https://www.statlearning.com/"}, {"title": "scikit-learn User Guide", "url": "https://scikit-learn.org/stable/user_guide.html"}]}, {"title": "Бустинг: XGBoost vs LightGBM vs CatBoost", "level": "🟡 Middle", "explanation": "<p>Три главных gradient boosting фреймворка для табличных данных. Каждый оптимизирован под свои сценарии.<\/p><table><tr><th><\/th><th>XGBoost<\/th><th>LightGBM<\/th><th>CatBoost<\/th><\/tr><tr><td>Скорость обучения<\/td><td>средняя<\/td><td>очень высокая<\/td><td>средняя<\/td><\/tr><tr><td>Категориальные признаки<\/td><td>ручной OHE<\/td><td>частично<\/td><td>нативно, лучше всех<\/td><td><\/td><\/tr><tr><td>Память<\/td><td>средняя<\/td><td>низкая (leaf-wise)<\/td><td>высокая<\/td><\/tr><tr><td>Переобучение на малых данных<\/td><td>умеренное<\/td><td>выше (leaf-wise рост)<\/td><td>ниже (ordered boosting)<\/td><\/tr><\/table><p>LightGBM растит деревья leaf-wise — быстрее, но легче переобучается на малых выборках. CatBoost использует ordered boosting и symmetric trees, что снижает утечку таргета в категориальных признаках.<\/p><pre><code>import lightgbm as lgb\nmodel = lgb.LGBMClassifier(num_leaves=31, learning_rate=0.05)\nmodel.fit(X_train, y_train, categorical_feature=cat_cols)<\/code><\/pre><ul><li>Много категориальных признаков без предобработки → CatBoost<\/li><li>Огромный датасет, важна скорость → LightGBM<\/li><li>Нужна зрелая экосистема и множество готовых интеграций → XGBoost<\/li><\/ul>", "links": [{"title": "XGBoost Documentation", "url": "https://xgboost.readthedocs.io/"}, {"title": "LightGBM Documentation", "url": "https://lightgbm.readthedocs.io/"}, {"title": "CatBoost Documentation", "url": "https://catboost.ai/docs/"}, {"title": "CatBoost paper (arXiv)", "url": "https://arxiv.org/abs/1706.09516"}]}, {"title": "Архитектуры для изображений: CNN vs Vision Transformer", "level": "🟡 Middle", "explanation": "<p>CNN доминировали в CV десятилетие благодаря индуктивным смещениям (локальность, сдвиговая инвариантность). ViT обходится без них, но требует больше данных.<\/p><table><tr><th><\/th><th>CNN (ResNet)<\/th><th>ViT<\/th><\/tr><tr><td>Индуктивные смещения<\/td><td>сильные<\/td><td>слабые<\/td><\/tr><tr><td>Данные для обучения с нуля<\/td><td>меньше<\/td><td>очень много (или pretrain)<\/td><\/tr><tr><td>Масштабируемость<\/td><td>ограничена<\/td><td>отличная<\/td><\/tr><tr><td>Fine-tune на малых датасетах<\/td><td>хорошо<\/td><td>нужен сильный pretrain (например DINOv2)<\/td><\/tr><\/table><p>На практике: если данных мало и нет предобученного ViT под домен — берите CNN. Если есть доступ к сильным предобученным ViT (CLIP, DINOv2) — fine-tune часто выигрывает.<\/p><pre><code>import timm\nmodel = timm.create_model('vit_base_patch16_224', pretrained=True)<\/code><\/pre><ul><li>ViT требует patch embedding и часто аугментации типа MixUp<\/li><li>Гибриды (ConvNeXt) берут лучшее из обоих миров<\/li><\/ul>", "links": [{"title": "An Image is Worth 16x16 Words (ViT paper)", "url": "https://arxiv.org/abs/2010.11929"}, {"title": "Deep Residual Learning (ResNet paper)", "url": "https://arxiv.org/abs/1512.03385"}, {"title": "timm library (PyTorch Image Models)", "url": "https://github.com/huggingface/pytorch-image-models"}]}, {"title": "Последовательности: RNN/LSTM vs Transformer", "level": "🟡 Middle", "explanation": "<p>RNN/LSTM обрабатывают последовательность рекуррентно — шаг за шагом, что ограничивает параллелизм и создаёт проблему затухающих градиентов на длинных цепочках. Transformer заменяет рекурренцию self-attention.<\/p><table><tr><th><\/th><th>RNN/LSTM<\/th><th>Transformer<\/th><\/tr><tr><td>Параллелизация обучения<\/td><td>нет (последовательно)<\/td><td>да<\/td><\/tr><tr><td>Долгие зависимости<\/td><td>слабо<\/td><td>хорошо (attention)<\/td><\/tr><tr><td>Сложность по длине N<\/td><td>O(N)<\/td><td>O(N²) для attention<\/td><\/tr><tr><td>Данные для обучения<\/td><td>меньше<\/td><td>больше<\/td><\/tr><\/table><p>Transformer практически вытеснил RNN везде, кроме нишевых сценариев (стриминг с жёсткими ограничениями по памяти, где линейные модели типа Mamba/SSM возвращаются как альтернатива квадратичному attention).<\/p><pre><code># Attention: O(N^2), но полностью параллелен\nscores = Q @ K.T / sqrt(d_k)<\/code><\/pre><ul><li>Изучите SSM/Mamba как современную альтернативу для длинных последовательностей<\/li><li>LSTM всё ещё используют в embedded/edge из-за компактности<\/li><\/ul>", "links": [{"title": "Attention Is All You Need (arXiv)", "url": "https://arxiv.org/abs/1706.03762"}, {"title": "Understanding LSTM Networks (colah's blog)", "url": "https://colah.github.io/posts/2015-08-Understanding-LSTMs/"}, {"title": "The Annotated Transformer", "url": "https://nlp.seas.harvard.edu/annotated-transformer/"}]}, {"title": "LLM-провайдеры: Claude vs GPT vs Gemini", "level": "🟡 Middle", "explanation": "<p>Выбор провайдера — это компромисс между качеством, ценой, контекстным окном и скоростью, а не абсолютный победитель.<\/p><table><tr><th><\/th><th>Claude (Anthropic)<\/th><th>GPT (OpenAI)<\/th><th>Gemini (Google)<\/th><\/tr><tr><td>Контекст<\/td><td>до 200K+ токенов<\/td><td>до 128K-1M (o-серия/GPT-4.1)<\/td><td>до 1M+ (2.5 Pro)<\/td><\/tr><tr><td>Сильные стороны<\/td><td>код, длинный контекст, следование инструкциям<\/td><td>универсальность, экосистема<\/td><td>мультимодальность, интеграция с Google<\/td><\/tr><tr><td>Кэширование промптов<\/td><td>да (prompt caching)<\/td><td>да<\/td><td>да (context caching)<\/td><\/tr><tr><td>Vision/аудио<\/td><td>vision<\/td><td>vision+audio realtime<\/td><td>vision+audio+video нативно<\/td><\/tr><\/table><p>На практике тестируйте на своих реальных задачах (eval-датасет), а не полагайтесь только на паблик-бенчмарки — они легко переобучаются под лидерборды.<\/p><ul><li>Для агентных задач и кода часто выигрывает Claude<\/li><li>Для мультимодальных задач с видео — Gemini<\/li><li>Для широкой экосистемы плагинов — GPT<\/li><\/ul>", "links": [{"title": "Anthropic Models Overview", "url": "https://docs.anthropic.com/en/docs/about-claude/models"}, {"title": "OpenAI Models Documentation", "url": "https://platform.openai.com/docs/models"}, {"title": "Gemini Models", "url": "https://ai.google.dev/gemini-api/docs/models"}, {"title": "LMSYS Chatbot Arena Leaderboard", "url": "https://lmarena.ai/"}]}, {"title": "Open-weights модели: Llama vs Qwen vs Mistral vs DeepSeek", "level": "🟡 Middle", "explanation": "<p>Открытые веса дают контроль над данными, хостингом и fine-tuning. Выбор зависит от лицензии, языка и задачи.<\/p><table><tr><th><\/th><th>Llama (Meta)<\/th><th>Qwen (Alibaba)<\/th><th>Mistral<\/th><th>DeepSeek<\/th><\/tr><tr><td>Лицензия<\/td><td>кастомная (ограничения на масштаб)<\/td><td>Apache 2.0 (в основном)<\/td><td>Apache 2.0<\/td><td>MIT/кастомная<\/td><\/tr><tr><td>Сильная сторона<\/td><td>экосистема, community<\/td><td>мультиязычность, размеры<\/td><td>эффективность на размер<\/td><td>reasoning, MoE-эффективность<\/td><\/tr><tr><td>MoE варианты<\/td><td>ограниченно<\/td><td>да<\/td><td>да (Mixtral)<\/td><td>да (DeepSeek-V3)<\/td><\/tr><\/table><p>DeepSeek-V3/R1 показали, что MoE + грамотное обучение даёт качество топ-уровня при значительно меньших затратах на inference.<\/p><pre><code># Запуск через Ollama\nollama pull qwen2.5:7b\nollama run qwen2.5:7b<\/code><\/pre><ul><li>Для коммерческого использования всегда сверяйте точный текст лицензии<\/li><li>Qwen и DeepSeek особенно сильны на многоязычных и reasoning задачах<\/li><\/ul>", "links": [{"title": "Llama models (Meta)", "url": "https://www.llama.com/"}, {"title": "Qwen GitHub", "url": "https://github.com/QwenLM/Qwen2.5"}, {"title": "Mistral AI docs", "url": "https://docs.mistral.ai/"}, {"title": "DeepSeek-V3 paper (arXiv)", "url": "https://arxiv.org/abs/2412.19437"}]}, {"title": "Embedding-модели для поиска и RAG", "level": "🟡 Middle", "explanation": "<p>Качество embedding напрямую определяет качество retrieval в RAG-системах. Выбор зависит от языка, длины текста и бюджета.<\/p><table><tr><th>Модель<\/th><th>Размерность<\/th><th>Особенность<\/th><\/tr><tr><td>OpenAI text-embedding-3<\/td><td>1536/3072<\/td><td>API, хорошее качество out-of-box<\/td><\/tr><tr><td>Cohere embed-v3<\/td><td>1024<\/td><td>сильна мультиязычность<\/td><\/tr><tr><td>BGE / E5 (open-source)<\/td><td>384-1024<\/td><td>self-hosted, топ на MTEB<\/td><\/tr><tr><td>Voyage AI<\/td><td>1024-2048<\/td><td>оптимизирована под code/RAG<\/td><\/tr><\/table><p>Ориентируйтесь на лидерборд MTEB, но проверяйте на своих данных — метрики бенчмарка не всегда переносятся на домен (юридические тексты, код, медицина).<\/p><pre><code>from sentence_transformers import SentenceTransformer\nmodel = SentenceTransformer('BAAI/bge-large-en-v1.5')\nemb = model.encode(['пример текста'])<\/code><\/pre><ul><li>Учитывайте лимит длины входа модели (обычно 512 токенов)<\/li><li>Матрёшка-эмбеддинги (Matryoshka) позволяют обрезать размерность без сильной потери качества<\/li><\/ul>", "links": [{"title": "MTEB Leaderboard", "url": "https://huggingface.co/spaces/mteb/leaderboard"}, {"title": "OpenAI Embeddings guide", "url": "https://platform.openai.com/docs/guides/embeddings"}, {"title": "BGE models (FlagEmbedding)", "url": "https://github.com/FlagOpen/FlagEmbedding"}]}, {"title": "Векторные БД: FAISS vs Qdrant vs pgvector vs Milvus", "level": "🟡 Middle", "explanation": "<p>Векторное хранилище — критичный компонент RAG. Выбор зависит от масштаба, инфраструктуры и требований к фильтрации.<\/p><table><tr><th><\/th><th>FAISS<\/th><th>Qdrant<\/th><th>pgvector<\/th><th>Milvus<\/th><\/tr><tr><td>Тип<\/td><td>библиотека<\/td><td>отдельный сервис<\/td><td>расширение Postgres<\/td><td>распределённая БД<\/td><\/tr><tr><td>Масштаб<\/td><td>до сотен млн (in-memory)<\/td><td>миллиарды<\/td><td>десятки млн<\/td><td>миллиарды, шардинг<\/td><\/tr><tr><td>Фильтрация по метаданным<\/td><td>слабая<\/td><td>отличная<\/td><td>SQL-native<\/td><td>хорошая<\/td><\/tr><tr><td>Простота эксплуатации<\/td><td>требует своей инфры<\/td><td>средняя<\/td><td>если уже есть Postgres — минимальная<\/td><td>сложнее (etcd, minio)<\/td><\/tr><\/table><p>Если у вас уже есть PostgreSQL — pgvector часто самый быстрый путь к продакшену без новой инфраструктуры. Для больших объёмов с частыми обновлениями — Qdrant или Milvus.<\/p><pre><code>CREATE EXTENSION vector;\nSELECT * FROM docs ORDER BY embedding <-> '[0.1,0.2,...]' LIMIT 5;<\/code><\/pre>", "links": [{"title": "FAISS GitHub", "url": "https://github.com/facebookresearch/faiss"}, {"title": "Qdrant Documentation", "url": "https://qdrant.tech/documentation/"}, {"title": "pgvector GitHub", "url": "https://github.com/pgvector/pgvector"}, {"title": "Milvus Documentation", "url": "https://milvus.io/docs"}]}, {"title": "Фреймворки глубокого обучения: PyTorch vs TensorFlow vs JAX", "level": "🟡 Middle", "explanation": "<p>PyTorch стал де-факто стандартом в исследованиях и большей части продакшена, но TensorFlow и JAX всё ещё имеют свои ниши.<\/p><table><tr><th><\/th><th>PyTorch<\/th><th>TensorFlow<\/th><th>JAX<\/th><\/tr><tr><td>Экосистема исследований<\/td><td>доминирует<\/td><td>снижается<\/td><td>растёт (Google DeepMind)<\/td><\/tr><tr><td>Продакшн-деплой<\/td><td>TorchServe, ONNX<\/td><td>TF Serving, TFLite зрелые<\/td><td>требует доп. инструментов<\/td><\/tr><tr><td>Функциональный стиль<\/td><td>императивный<\/td><td>граф (eager по умолчанию сейчас)<\/td><td>функциональный, composable transforms<\/td><\/tr><tr><td>Компиляция/скорость<\/td><td>torch.compile<\/td><td>XLA<\/td><td>XLA нативно, очень быстрый<\/td><\/tr><\/table><p>JAX особенно силён при исследовании новых архитектур и на TPU благодаря <code>jit<\/code>, <code>vmap<\/code>, <code>grad<\/code> как компонуемым трансформациям.<\/p><pre><code>import torch\nmodel = torch.compile(MyModel())  # ускорение через graph compilation<\/code><\/pre>", "links": [{"title": "PyTorch Documentation", "url": "https://pytorch.org/docs/stable/index.html"}, {"title": "TensorFlow Guide", "url": "https://www.tensorflow.org/guide"}, {"title": "JAX Documentation", "url": "https://jax.readthedocs.io/"}]}, {"title": "Inference-движки: vLLM vs TGI vs Ollama vs llama.cpp", "level": "🔴 Senior", "explanation": "<p>Выбор inference-движка определяет throughput, latency и удобство self-hosting LLM.<\/p><table><tr><th><\/th><th>vLLM<\/th><th>TGI (HF)<\/th><th>Ollama<\/th><th>llama.cpp<\/th><\/tr><tr><td>Целевой сценарий<\/td><td>высокий throughput, GPU-сервер<\/td><td>прод-деплой HF-моделей<\/td><td>локальная разработка<\/td><td>CPU/edge, минимум зависимостей<\/td><\/tr><tr><td>Ключевая техника<\/td><td>PagedAttention, continuous batching<\/td><td>continuous batching, flash-attn<\/td><td>обёртка над llama.cpp<\/td><td>квантование GGUF (4/5/8-bit)<\/td><\/tr><tr><td>Мультизапросы<\/td><td>отличная батчировка<\/td><td>хорошая<\/td><td>ограниченная<\/td><td>слабая<\/td><\/tr><tr><td>Простота запуска<\/td><td>средняя<\/td><td>средняя<\/td><td>очень простая<\/td><td>простая, но ручная сборка<\/td><\/tr><\/table><p>Для продакшн-serving с высокой нагрузкой — vLLM де-факто стандарт благодаря PagedAttention, который экономит память KV-cache. Для ноутбука или прототипа — Ollama.<\/p><pre><code>pip install vllm\npython -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-3-8b<\/code><\/pre>", "links": [{"title": "vLLM Documentation", "url": "https://docs.vllm.ai/"}, {"title": "Text Generation Inference (TGI)", "url": "https://huggingface.co/docs/text-generation-inference/"}, {"title": "Ollama GitHub", "url": "https://github.com/ollama/ollama"}, {"title": "llama.cpp GitHub", "url": "https://github.com/ggml-org/llama.cpp"}]}, {"title": "Публичные бенчмарки LLM: как им (не) доверять", "level": "🔴 Senior", "explanation": "<p>MMLU, HumanEval, GSM8K и подобные бенчмарки полезны, но легко подвержены data contamination (модель могла видеть тестовые данные при обучении) и переобучению лабораторий под лидерборд.<\/p><ul><li><b>Data contamination<\/b> — тестовые примеры просачиваются в обучающий корпус из интернета<\/li><li><b>Benchmark gaming<\/b> — модели дообучают специально под популярные тесты<\/li><li><b>Устаревание<\/b> — топовые модели быстро насыщают старые бенчмарки (saturation)<\/li><li><b>Несоответствие домену<\/b> — высокий MMLU не гарантирует качество на вашей узкой задаче<\/li><\/ul><p>Более надёжные сигналы: LMSYS Chatbot Arena (человеческие сравнения вслепую), приватные held-out бенчмарки (LiveCodeBench с датами после cutoff), и, главное — собственный eval-датасет на реальных задачах продукта.<\/p><pre><code># Простой каркас собственного eval\nfor case in eval_set:\n    response = model.generate(case.prompt)\n    score = judge_model.score(response, case.expected)<\/code><\/pre><table><tr><th>Тип бенчмарка<\/th><th>Доверие<\/th><\/tr><tr><td>Паблик лидерборд (MMLU)<\/td><td>низкое-среднее<\/td><\/tr><tr><td>Human Arena (слепое голосование)<\/td><td>высокое<\/td><\/tr><tr><td>Собственный domain eval<\/td><td>максимальное<\/td><\/tr><\/table>", "links": [{"title": "LMSYS Chatbot Arena", "url": "https://lmarena.ai/"}, {"title": "Data Contamination Quiz (paper)", "url": "https://arxiv.org/abs/2311.09783"}, {"title": "HELM (Holistic Evaluation of Language Models)", "url": "https://crfm.stanford.edu/helm/"}]}, {"title": "Как выбирать модель под задачу и бюджет", "level": "🔴 Senior", "explanation": "<p>Выбор модели — инженерное решение с учётом latency, стоимости за токен/запрос, требований к качеству и compliance (данные не должны покидать периметр).<\/p><ol><li>Определите минимально приемлемое качество через собственный eval, а не 'берём самую мощную'<\/li><li>Оцените реальную стоимость: цена за 1M токенов × ожидаемый объём запросов в месяц<\/li><li>Проверьте требования по latency (realtime chat vs batch-обработка ночью)<\/li><li>Учтите приватность: нужен ли self-hosting из-за регуляций<\/li><\/ol><table><tr><th>Сценарий<\/th><th>Рекомендация<\/th><\/tr><tr><td>Простая классификация/экстракция<\/td><td>маленькая модель (7-8B) или fine-tuned классик<\/td><\/tr><tr><td>Сложный reasoning, агенты<\/td><td>топовый proprietary (Claude/GPT/Gemini flagship)<\/td><\/tr><tr><td>Высокий объём, чувствительность к цене<\/td><td>open-weights + self-host (vLLM)<\/td><\/tr><tr><td>Данные не могут покидать периметр<\/td><td>self-hosted open-weights модель<\/td><\/tr><\/table><p>Часто оптимальна каскадная схема: маленькая модель отвечает на простые запросы, сложные эскалируются к дорогой.<\/p>", "links": [{"title": "Anthropic: Choosing a model", "url": "https://docs.anthropic.com/en/docs/about-claude/models/choosing-a-model"}, {"title": "Artificial Analysis (сравнение моделей по цене/скорости)", "url": "https://artificialanalysis.ai/"}, {"title": "OpenAI Pricing", "url": "https://openai.com/api/pricing/"}]}, {"title": "Сравнение по цене и скорости: как читать метрики провайдеров", "level": "🟡 Middle", "explanation": "<p>При сравнении LLM-провайдеров важно смотреть не только на цену за токен, но и на комплекс метрик: TTFT (time to first token), throughput (токенов/сек) и стоимость реального сценария использования.<\/p><ul><li><b>TTFT<\/b> — критичен для интерактивных чатов<\/li><li><b>Tokens/sec (генерация)<\/b> — важен для длинных ответов и стриминга<\/li><li><b>Input vs output pricing<\/b> — обычно output дороже input в 3-5 раз<\/li><li><b>Prompt caching<\/b> — может снизить стоимость повторяющегося контекста на 50-90%<\/li><\/ul><pre><code>Стоимость запроса ≈\n  (input_tokens × price_in + output_tokens × price_out) / 1_000_000<\/code><\/pre><table><tr><th>Метрика<\/th><th>Когда важна<\/th><\/tr><tr><td>TTFT<\/td><td>чат-интерфейсы, real-time<\/td><\/tr><tr><td>Throughput<\/td><td>batch-обработка, суммаризация больших объёмов<\/td><\/tr><tr><td>Context caching<\/td><td>долгие системные промпты, RAG с постоянным контекстом<\/td><\/tr><\/table><p>Всегда тестируйте на реалистичной длине промпта — короткие тестовые запросы искажают картину по latency.<\/p>", "links": [{"title": "Artificial Analysis benchmarks", "url": "https://artificialanalysis.ai/"}, {"title": "Anthropic Prompt Caching", "url": "https://docs.anthropic.com/en/docs/build-with-claude/prompt-caching"}, {"title": "OpenAI Pricing", "url": "https://openai.com/api/pricing/"}]}, {"title": "Квантование моделей: влияние на качество и скорость", "level": "🔴 Senior", "explanation": "<p>Квантование снижает точность весов (обычно с FP16 до INT8/INT4), уменьшая память и ускоряя inference — критично при сравнении моделей 'как они будут работать в проде'.<\/p><table><tr><th>Формат<\/th><th>Память<\/th><th>Потеря качества<\/th><th>Где используется<\/th><\/tr><tr><td>FP16/BF16<\/td><td>базовая<\/td><td>нет<\/td><td>обучение, серверный inference<\/td><\/tr><tr><td>INT8<\/td><td>~2x меньше<\/td><td>минимальная<\/td><td>прод-serving<\/td><\/tr><tr><td>INT4 (GPTQ/AWQ)<\/td><td>~4x меньше<\/td><td>заметная на сложных задачах<\/td><td>локальный запуск, edge<\/td><\/tr><tr><td>GGUF Q4_K_M<\/td><td>~4x меньше<\/td><td>умеренная<\/td><td>llama.cpp, Ollama<\/td><\/tr><\/table><p>При сравнении open-weights моделей всегда уточняйте, в каком квантовании тестировался бенчмарк — INT4 версия той же модели может заметно уступать FP16 на reasoning-задачах.<\/p><pre><code># Квантование через AWQ\npython -m awq.quantize --model llama-3-8b --w_bit 4<\/code><\/pre>", "links": [{"title": "AWQ paper (arXiv)", "url": "https://arxiv.org/abs/2306.00978"}, {"title": "GPTQ paper (arXiv)", "url": "https://arxiv.org/abs/2210.17323"}, {"title": "llama.cpp quantization guide", "url": "https://github.com/ggml-org/llama.cpp/blob/master/examples/quantize/README.md"}]}], "quiz": [{"q": "Какой алгоритм лучше всего подходит как быстрый интерпретируемый baseline перед сложными моделями?", "options": ["SVM с RBF-ядром", "Логистическая регрессия", "kNN с k=1", "Глубокая нейросеть"], "answer": 1, "explain": "Логистическая регрессия быстро обучается, легко интерпретируется и служит эталоном для сравнения более сложных моделей."}, {"q": "Какая особенность CatBoost выделяет его среди XGBoost и LightGBM?", "options": ["Работа только на GPU", "Нативная обработка категориальных признаков через ordered boosting", "Отсутствие поддержки регрессии", "Требует OHE для всех признаков"], "answer": 1, "explain": "CatBoost использует ordered boosting и специальную обработку категориальных признаков, снижая утечку таргета без ручного OHE."}, {"q": "В чём главное преимущество Transformer перед RNN/LSTM при обучении?", "options": ["Меньше параметров", "Возможность полной параллелизации обучения через self-attention", "Линейная сложность по длине последовательности", "Отсутствие необходимости в данных"], "answer": 1, "explain": "Self-attention обрабатывает все позиции последовательности параллельно, в отличие от последовательной рекурренции RNN."}, {"q": "Что такое PagedAttention в vLLM?", "options": ["Метод квантования весов модели", "Техника эффективного управления памятью KV-cache для батчирования запросов", "Алгоритм токенизации", "Способ сжатия эмбеддингов"], "answer": 1, "explain": "PagedAttention организует KV-cache блоками, аналогично виртуальной памяти ОС, что позволяет эффективно батчировать множество запросов."}, {"q": "Почему высокий результат модели на MMLU не гарантирует качество на вашей задаче?", "options": ["MMLU измеряет только скорость inference", "Возможна data contamination и несоответствие домену бенчмарка", "MMLU доступен только для open-weights моделей", "Результаты MMLU обновляются раз в год"], "answer": 1, "explain": "Публичные бенчмарки подвержены утечке тестовых данных в обучающий корпус и не всегда отражают специфику узкого домена."}, {"q": "Какая векторная БД — оптимальный выбор, если в компании уже используется PostgreSQL и нужен быстрый путь в прод?", "options": ["Milvus", "pgvector", "FAISS", "Отдельный кластер Qdrant"], "answer": 1, "explain": "pgvector — расширение PostgreSQL, позволяющее добавить векторный поиск без новой инфраструктуры."}, {"q": "Что происходит при квантовании модели с FP16 до INT4?", "options": ["Качество всегда улучшается", "Память уменьшается примерно в 4 раза, возможна заметная потеря качества на сложных задачах", "Модель перестаёт работать на GPU", "Размер контекстного окна увеличивается"], "answer": 1, "explain": "INT4-квантование существенно экономит память и ускоряет inference, но может ощутимо просаживать качество на reasoning-задачах."}, {"q": "Какая техника композиции трансформаций (jit, vmap, grad) отличает JAX от PyTorch/TensorFlow?", "options": ["Отсутствие поддержки автодифференцирования", "Функциональный, компонуемый стиль трансформаций", "Работа только на CPU", "Отсутствие поддержки нейросетей"], "answer": 1, "explain": "JAX построен вокруг функциональных, компонуемых трансформаций (jit-компиляция, векторизация vmap, автодифференцирование grad)."}, {"q": "Какая метрика наиболее критична для интерактивного чат-интерфейса с LLM?", "options": ["Throughput батч-обработки", "TTFT (time to first token)", "Размер модели в параметрах", "Стоимость обучения модели"], "answer": 1, "explain": "TTFT определяет, насколько быстро пользователь увидит начало ответа, что критично для ощущения отзывчивости чата."}, {"q": "Что дают Matryoshka-эмбеддинги при выборе embedding-модели для RAG?", "options": ["Увеличение размерности без потери скорости", "Возможность обрезать размерность вектора без сильной потери качества", "Автоматический перевод текста", "Замену векторной БД на реляционную"], "answer": 1, "explain": "Matryoshka representation learning позволяет использовать усечённые эмбеддинги меньшей размерности, экономя память при небольшой потере точности."}], "id": 19, "pi": 4}];
const PHASES = [["Phase 1", "Python + Math + Data", "#2e7d46"], ["Phase 2", "Classical ML", "#1f5fa8"], ["Phase 3", "Deep Learning", "#c07716"], ["Phase 4", "LLM & GenAI", "#b23a3a"], ["Phase 5", "MLOps & Production", "#6d4fa3"]];
const LS = 'ai-learn-v1';
let state = JSON.parse(localStorage.getItem(LS) || '{"read":{},"quiz":{}}');
function save(){ localStorage.setItem(LS, JSON.stringify(state)); }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function sectionProgress(s){
  const read = s.topics.filter((_,ti)=>state.read[s.id+':'+ti]).length;
  return {read, total:s.topics.length, quiz: state.quiz[s.id]};
}

function renderNav(active){
  const nav = document.getElementById('nav');
  let h = '<h1>AI / ML Engineer</h1><p class="sub">учебник · '+DATA.length+' разделов</p>';
  h += '<button class="nav-item" style="--pc:#555" onclick="showDash()"'+(active===-1?' aria-current="page"':'')+'>🏠 Обзор</button>';
  PHASES.forEach((ph,pi)=>{
    const secs = DATA.filter(s=>s.pi===pi);
    if(!secs.length) return;
    h += '<div class="phase-group"><div class="phase-label"><span class="spine" style="background:'+ph[2]+'"></span>'+ph[0]+' · '+ph[1]+'</div>';
    secs.forEach(s=>{
      const p = sectionProgress(s);
      const mark = p.read===p.total ? '✓' : p.read+'/'+p.total;
      h += '<button class="nav-item'+(active===s.id?' active':'')+'" style="--pc:'+ph[2]+'" onclick="showSection('+s.id+')">'+esc(s.section)+'<span class="done-mark">'+mark+'</span></button>';
    });
    h += '</div>';
  });
  nav.innerHTML = h;
}

function showDash(){
  renderNav(-1);
  const total = DATA.reduce((a,s)=>a+s.topics.length,0);
  const read = Object.keys(state.read).filter(k=>state.read[k]).length;
  let h = '<p class="hero-eyebrow">трекер обучения · '+total+' тем · 5 фаз</p>';
  h += '<h2 class="hero">Путь AI / ML инженера</h2>';
  h += '<p class="hero-sub">От Python и линейной алгебры до LLM-агентов и MLOps. Читайте темы, отмечайте изученное и закрепляйте тестом в конце каждого раздела. Прогресс сохраняется в браузере.</p>';
  h += '<p class="mono" style="color:var(--muted)">Изучено тем: '+read+' / '+total+'</p>';
  h += '<div class="shelf">';
  DATA.forEach(s=>{
    const ph = PHASES[s.pi], p = sectionProgress(s);
    const pct = Math.round(100*p.read/p.total);
    const qz = p.quiz ? 'тест: '+p.quiz.score+'/'+p.quiz.total : 'тест не пройден';
    h += '<div class="book" style="--pc:'+ph[2]+'" onclick="showSection('+s.id+')"><div class="bp">'+ph[0]+'</div><h4>'+esc(s.section)+'</h4><div class="bar"><i style="width:'+pct+'%"></i></div><div class="stats">'+p.read+'/'+p.total+' тем · '+qz+'</div></div>';
  });
  h += '</div>';
  document.getElementById('main').innerHTML = h;
  window.scrollTo(0,0);
  document.getElementById('nav').classList.remove('open');
}

function showSection(id){
  const s = DATA.find(x=>x.id===id); if(!s) return;
  renderNav(id);
  const ph = PHASES[s.pi];
  let h = '<p class="eyebrow" style="--pc:'+ph[2]+'">'+ph[0]+' — '+ph[1]+'</p>';
  h += '<h2 class="section-title">'+esc(s.section)+'</h2>';
  h += '<p class="section-meta">'+s.topics.length+' тем · тест из '+s.quiz.length+' вопросов в конце</p>';
  s.topics.forEach((t,ti)=>{
    const key = s.id+':'+ti, checked = state.read[key] ? 'checked' : '';
    h += '<div class="topic" style="--pc:'+ph[2]+'" id="t'+ti+'">'
      + '<div class="topic-head" onclick="toggleTopic('+ti+')">'
      + '<span class="topic-num">'+String(ti+1).padStart(2,'0')+'</span>'
      + '<span class="topic-title">'+esc(t.title)+'</span>'
      + '<span class="topic-level">'+esc(t.level)+'</span>'
      + '<input type="checkbox" class="topic-check" '+checked+' onclick="event.stopPropagation();markRead('+s.id+','+ti+',this.checked)" title="отметить изученным">'
      + '</div><div class="topic-body">'+t.explanation+linksHtml(t)+'</div></div>';
  });
  h += '<div id="quiz-block" style="--pc:'+ph[2]+'"><h3>Проверьте себя</h3><p class="section-meta">Выберите ответы и нажмите «Проверить».</p>';
  s.quiz.forEach((q,qi)=>{
    h += '<div class="q-card" data-a="'+q.answer+'" id="q'+qi+'"><div class="q-text"><span class="q-num">'+(qi+1)+'.</span>'+esc(q.q)+'</div>';
    q.options.forEach((o,oi)=>{
      h += '<label class="opt"><input type="radio" name="q'+qi+'" value="'+oi+'">'+esc(o)+'</label>';
    });
    h += '<div class="q-explain">'+esc(q.explain)+'</div></div>';
  });
  h += '<div id="quiz-actions"><button class="primary" onclick="gradeQuiz('+s.id+')">Проверить</button>'
    + '<button class="ghost" onclick="showSection('+s.id+')">Сбросить тест</button>'
    + '<span id="quiz-result"></span></div></div>';
  document.getElementById('main').innerHTML = h;
  window.scrollTo(0,0);
  document.getElementById('nav').classList.remove('open');
}

function linksHtml(t){
  if(!t.links || !t.links.length) return '';
  let h = '<div class="deep-links"><div class="dl-title">📚 Углубиться в тему</div><ul>';
  t.links.forEach(l=>{ h += '<li><a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.title)+'</a></li>'; });
  return h + '</ul></div>';
}
function toggleTopic(ti){ document.getElementById('t'+ti).classList.toggle('open'); }
function markRead(sid,ti,v){ state.read[sid+':'+ti]=v; save(); renderNav(sid); }

function gradeQuiz(sid){
  const s = DATA.find(x=>x.id===sid);
  let score=0;
  s.quiz.forEach((q,qi)=>{
    const card = document.getElementById('q'+qi);
    card.classList.add('answered');
    const sel = card.querySelector('input:checked');
    const opts = card.querySelectorAll('.opt');
    opts[q.answer].classList.add('correct');
    if(sel){
      const v = +sel.value;
      if(v===q.answer) score++;
      else opts[v].classList.add('wrong');
    }
  });
  state.quiz[sid] = {score, total:s.quiz.length}; save();
  const pct = Math.round(100*score/s.quiz.length);
  document.getElementById('quiz-result').textContent =
    'Результат: '+score+' / '+s.quiz.length+' ('+pct+'%)'+(pct>=80?' — отлично!':pct>=60?' — неплохо, повторите слабые темы':' — стоит перечитать раздел');
  renderNav(sid);
}

showDash();
</script>
</body>
</html>
